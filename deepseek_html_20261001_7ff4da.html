<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayan Product Brain · Roadmap</title>
<style>
  :root{
    --ink:#04060a;--ink2:#080b11;--panel:#0d1218;--panel2:#131a22;
    --line:#1a222e;--txt:#e9eef6;--mut:#78849a;--mut2:#4d5666;
    --gold:245,190,60;--cyan:34,211,238;--emerald:52,211,153;
    --violet:167,139,250;--amber:255,138,61;--rose:244,63,94;
    --slate:148,163,184;
    --accent:52,211,153;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--txt);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;line-height:1.5}

  /* ambient */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg::before{content:"";position:absolute;inset:-30%;
    background:
      radial-gradient(40% 32% at 12% 6%, rgba(var(--accent),.10), transparent 60%),
      radial-gradient(38% 32% at 90% 84%, rgba(167,139,250,.06), transparent 62%);
    transition:background 1.1s ease;filter:blur(30px)}
  .bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(78% 62% at 50% 38%,#000 20%,transparent 100%)}

  /* grid */
  .app{position:relative;z-index:1;display:grid;
    grid-template-columns:264px 1fr;height:100vh}

  /* ============ LEFT RAIL ============ */
  .rail{border-right:1px solid var(--line);
    background:linear-gradient(180deg,rgba(13,18,24,.94),rgba(8,12,17,.94));
    backdrop-filter:blur(14px);display:flex;flex-direction:column;
    padding:18px 12px 14px;gap:14px;min-height:0}

  .brand{display:flex;align-items:center;gap:11px;
    padding:2px 6px 14px;border-bottom:1px solid var(--line)}
  .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    font:700 15px/1 var(--mono);color:#06090d;letter-spacing:.02em;
    background:linear-gradient(140deg,rgb(var(--accent)),rgba(var(--accent),.5));
    box-shadow:0 0 26px -4px rgba(var(--accent),.75);
    transition:background .7s ease,box-shadow .7s ease}
  .brand-name{font-size:13px;font-weight:650;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{font:400 9px/1.35 var(--mono);color:var(--mut2);
    letter-spacing:.11em;text-transform:uppercase;margin-top:2px}

  .rail-label{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--mut2);padding:0 8px;margin-bottom:2px}

  .view-switch{display:flex;flex-direction:column;gap:3px}
  .view-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:9px 11px;border-radius:9px;color:var(--mut);transition:.2s;
    font:500 11.5px/1 var(--sans);letter-spacing:.01em}
  .view-btn:hover{background:rgba(255,255,255,.04);color:#c3ccdc}
  .view-btn.on{background:rgba(var(--accent),.1);color:var(--txt);
    box-shadow:inset 2px 0 0 rgb(var(--accent))}
  .view-btn .vi{width:20px;height:20px;border-radius:6px;flex:0 0 20px;
    display:grid;place-items:center;font:600 10px/1 var(--mono);
    background:rgba(255,255,255,.05);color:var(--mut2)}
  .view-btn.on .vi{background:rgba(var(--accent),.2);color:rgb(var(--accent))}

  .phase-list{display:flex;flex-direction:column;gap:3px;overflow-y:auto;
    flex:1;min-height:0;padding-right:2px}
  .phase-list::-webkit-scrollbar{width:4px}
  .phase-list::-webkit-scrollbar-thumb{background:#222a36;border-radius:9px}

  .phase-link{all:unset;cursor:pointer;position:relative;
    display:flex;align-items:center;gap:10px;
    padding:9px 10px 9px 12px;border-radius:9px;
    transition:background .18s,color .18s;color:var(--mut)}
  .phase-link:hover{background:rgba(255,255,255,.035);color:#c3ccdc}
  .phase-link.on{background:rgba(var(--pc),.1);color:var(--txt)}
  .phase-link.on::before{content:"";position:absolute;left:0;top:50%;
    translate:0 -50%;width:3px;height:18px;border-radius:9px;
    background:rgb(var(--pc));box-shadow:0 0 12px 0 rgba(var(--pc),.9)}
  .phase-link .pn{flex:0 0 24px;width:24px;height:24px;border-radius:7px;
    display:grid;place-items:center;font:700 10px/1 var(--mono);
    background:rgba(var(--pc),.14);color:rgb(var(--pc));
    border:1px solid rgba(var(--pc),.28);transition:.3s}
  .phase-link.locked .pn{border-style:dashed;
    background:rgba(var(--pc),.06);color:rgba(var(--pc),.7)}
  .phase-link .pt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .phase-link .pt-name{font-size:11.5px;font-weight:560;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phase-link .pt-sub{font:400 9px/1.3 var(--mono);color:var(--mut2);
    letter-spacing:.04em}
  .phase-link.locked .pt-sub{color:rgba(var(--pc),.55)}

  .rail-foot{border-top:1px solid var(--line);padding-top:12px;
    display:flex;flex-direction:column;gap:10px}

  .commit-meter{padding:0 8px;display:flex;flex-direction:column;gap:7px}
  .commit-row{display:flex;justify-content:space-between;align-items:baseline}
  .commit-lbl{font:500 9.5px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--mut2)}
  .commit-val{font:700 13px/1 var(--mono);
    color:rgb(var(--emerald));letter-spacing:-.02em}
  .commit-bar{height:4px;border-radius:99px;background:#171e28;overflow:hidden}
  .commit-fill{height:100%;width:22%;border-radius:99px;
    background:linear-gradient(90deg,rgb(var(--emerald)),rgba(var(--emerald),.4));
    box-shadow:0 0 12px -2px rgba(var(--emerald),.9);
    transition:width .5s cubic-bezier(.22,.75,.3,1)}

  .btn-demo{all:unset;cursor:pointer;text-align:center;
    font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
    padding:10px 12px;border-radius:9px;color:rgb(var(--accent));
    background:rgba(var(--accent),.10);border:1px solid rgba(var(--accent),.3);
    transition:.2s}
  .btn-demo:hover{background:rgba(var(--accent),.18)}
  .btn-demo.playing{color:#0a0e13;background:rgb(var(--accent))}

  /* ============ MAIN ============ */
  .canvas{display:flex;flex-direction:column;min-width:0;min-height:0}

  .topbar{display:flex;align-items:center;gap:14px;
    padding:14px 26px;border-bottom:1px solid var(--line);
    background:rgba(8,12,17,.55);backdrop-filter:blur(10px);flex-wrap:wrap}
  .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:11px;
    font:500 12px/1.3 var(--mono);color:var(--mut);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb b{color:#dfe7f4;font-weight:600}
  .crumb .sep{color:var(--mut2)}
  .crumb .pill{font:600 10px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;padding:5px 9px;border-radius:7px;
    background:rgba(var(--accent),.12);color:rgb(var(--accent));
    border:1px solid rgba(var(--accent),.28)}

  .top-badges{display:flex;gap:7px;flex-wrap:wrap}
  .tb{font:600 9.5px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;padding:6px 9px;border-radius:6px;
    border:1px solid var(--line);color:var(--mut);
    background:rgba(255,255,255,.025)}
  .tb.hot{color:rgb(var(--rose));border-color:rgba(var(--rose),.3);
    background:rgba(var(--rose),.08)}
  .tb.good{color:rgb(var(--emerald));border-color:rgba(var(--emerald),.3);
    background:rgba(var(--emerald),.08)}

  .stage{flex:1;min-height:0;overflow-y:auto;padding:26px 26px 40px;
    display:flex;flex-direction:column;gap:18px}
  .stage::-webkit-scrollbar{width:9px}
  .stage::-webkit-scrollbar-thumb{background:#1d2531;border-radius:9px}
  .stage::-webkit-scrollbar-thumb:hover{background:#28323f}

  /* hero */
  .hero{border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:26px 28px;position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
  .hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--emerald)),rgb(var(--cyan)),rgb(var(--violet)),rgb(var(--amber)))}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}}
  .hero .h-k{font:600 10px/1 var(--mono);letter-spacing:.15em;
    text-transform:uppercase;color:rgb(var(--accent));margin-bottom:12px}
  .hero h1{font:700 28px/1.15 var(--sans);letter-spacing:-.03em;
    margin-bottom:12px;max-width:22ch}
  .hero p{font-size:13.5px;color:#a5b1c3;max-width:74ch;line-height:1.65}
  .hero p b{color:#dfe7f4;font-weight:600}
  .hero p em{font-style:normal;color:rgb(var(--accent));font-weight:600}

  /* framing lock */
  .framing{margin-top:18px;padding:15px 17px;border-radius:11px;
    border:1px solid rgba(var(--amber),.28);
    background:rgba(var(--amber),.05);
    display:flex;align-items:flex-start;gap:12px;
    font-size:12.5px;line-height:1.6;color:#d8d0bd}
  .framing .ic{flex:0 0 22px;width:22px;height:22px;border-radius:7px;
    display:grid;place-items:center;font-size:11px;
    background:rgba(var(--amber),.14);color:rgb(var(--amber))}
  .framing b{color:#fff;font-weight:600}

  /* ============ PHASE STACK ============ */
  .phase-stack{display:flex;flex-direction:column;gap:0;position:relative}
  .phase-block{display:grid;grid-template-columns:64px 1fr;gap:20px;
    align-items:flex-start;position:relative;padding-bottom:6px}

  .phase-rail{display:flex;flex-direction:column;align-items:center;height:100%}
  .phase-node{
    width:52px;height:52px;border-radius:15px;flex:0 0 52px;
    display:grid;place-items:center;position:relative;
    font:700 16px/1 var(--mono);
    background:rgba(var(--pc),.14);color:rgb(var(--pc));
    border:2px solid rgba(var(--pc),.35);
    box-shadow:0 0 30px -12px rgba(var(--pc),.9),inset 0 0 20px -12px rgba(var(--pc),.5);
    z-index:2;transition:all .3s}
  .phase-block.committed .phase-node{
    background:rgb(var(--pc));color:var(--ink);
    border-color:rgb(var(--pc));
    box-shadow:0 0 40px -8px rgba(var(--pc),.95),
               0 0 0 4px rgba(var(--pc),.12),
               inset 0 0 24px -8px rgba(var(--pc),.6)}
  .phase-block.committed .phase-node::after{
    content:"";position:absolute;inset:-8px;border-radius:20px;
    border:1px solid rgba(var(--pc),.3);
    animation:nodePulse 2.4s ease-in-out infinite}
  @keyframes nodePulse{
    0%,100%{transform:scale(1);opacity:.6}
    50%{transform:scale(1.07);opacity:1}}
  .phase-block.locked .phase-node{border-style:dashed;
    background:rgba(var(--pc),.06);
    box-shadow:none}

  .phase-flow-line{
    flex:1;width:2px;position:relative;margin-top:6px;
    background:linear-gradient(180deg,rgba(var(--pc),.4),rgba(var(--pc),.05));
    min-height:44px;overflow:hidden}
  .phase-flow-line.locked{background:linear-gradient(180deg,rgba(var(--pc),.2),rgba(var(--pc),.02));
    opacity:.5}
  .phase-flow-line .dot{
    position:absolute;left:50%;translate:-50% 0;
    width:8px;height:8px;border-radius:50%;
    background:rgb(var(--pc));
    box-shadow:0 0 14px 2px rgba(var(--pc),.9);
    animation:drop 2.6s cubic-bezier(.45,.05,.55,.95) infinite}
  @keyframes drop{
    0%{top:-8px;opacity:0}
    15%{opacity:1}
    85%{opacity:1}
    100%{top:100%;opacity:0}}
  .phase-block:last-child .phase-flow-line{display:none}

  .phase-card{
    border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:20px 22px 20px;margin-bottom:14px;
    position:relative;overflow:hidden;
    transition:border-color .3s,transform .3s,box-shadow .3s;
    cursor:pointer}
  .phase-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,rgb(var(--pc)),rgba(var(--pc),.1))}
  .phase-card:hover{border-color:rgba(var(--pc),.45)}
  .phase-card.expanded{border-color:rgba(var(--pc),.55);
    box-shadow:0 22px 50px -30px rgba(var(--pc),.9)}
  .phase-block.committed .phase-card{border-color:rgba(var(--pc),.4);
    background:linear-gradient(180deg,rgba(var(--pc),.06),rgba(13,18,24,.85))}
  .phase-block.committed .phase-card::before{height:3px}
  .phase-block.locked .phase-card{border-style:dashed}
  .phase-block.locked .phase-card::before{
    background:linear-gradient(90deg,rgba(var(--pc),.4),rgba(var(--pc),.05))}

  .phase-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .phase-meta{flex:1;min-width:0}
  .phase-kicker{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:rgb(var(--pc));margin-bottom:6px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .phase-kicker .commit-tag{
    font:700 8.5px/1 var(--mono);letter-spacing:.11em;
    padding:3px 6px;border-radius:4px;
    background:rgb(var(--pc));color:var(--ink)}
  .phase-kicker .locked-tag{
    font:700 8.5px/1 var(--mono);letter-spacing:.11em;
    padding:3px 6px;border-radius:4px;
    background:rgba(var(--pc),.14);color:rgb(var(--pc));
    border:1px dashed rgba(var(--pc),.4)}
  .phase-name{font:650 19px/1.25 var(--sans);letter-spacing:-.02em;
    color:#eef3fb;margin-bottom:8px}
  .phase-desc{font-size:13px;line-height:1.65;color:#a5b1c3;max-width:72ch}
  .phase-desc b{color:#cfd8e8;font-weight:600}
  .phase-desc em{font-style:normal;color:rgb(var(--pc));font-weight:600}
  .phase-desc code{font-family:var(--mono);font-size:11.5px;
    color:#cfd8e8;background:rgba(255,255,255,.05);
    padding:1.5px 6px;border-radius:5px}

  .phase-facts{display:flex;flex-direction:column;gap:6px;
    align-items:flex-end;flex:0 0 auto;min-width:160px}
  .pfact{font:600 10px/1.3 var(--mono);letter-spacing:.04em;
    padding:6px 10px;border-radius:6px;
    background:rgba(var(--pc),.1);color:rgb(var(--pc));
    border:1px solid rgba(var(--pc),.25);
    white-space:nowrap}
  .pfact.soft{background:rgba(255,255,255,.03);color:var(--mut);
    border-color:var(--line)}

  /* expandable phase components */
  .phase-parts{max-height:0;overflow:hidden;opacity:0;
    transition:max-height .55s cubic-bezier(.2,.7,.3,1),
               opacity .35s .08s ease,margin .4s}
  .phase-card.expanded .phase-parts{max-height:900px;opacity:1;
    margin-top:16px;padding-top:16px;border-top:1px dashed #232c39}

  .part-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:10px}
  .part{padding:13px 15px;border-radius:11px;
    background:rgba(255,255,255,.025);border:1px solid var(--line);
    display:flex;flex-direction:column;gap:7px;
    transition:.25s;cursor:default}
  .part:hover{border-color:rgba(var(--pc),.4);
    background:rgba(var(--pc),.04);transform:translateY(-2px)}
  .part .pn2{font:600 9px/1 var(--mono);letter-spacing:.13em;
    text-transform:uppercase;color:rgb(var(--pc))}
  .part .pname{font:600 13px/1.35 var(--sans);color:#eef3fb;
    letter-spacing:-.005em}
  .part .pdesc{font:400 11.5px/1.55 var(--sans);color:#a5b1c3}

  .phase-maps{margin-top:14px;padding-top:12px;
    border-top:1px dashed #232c39;
    display:flex;gap:20px;flex-wrap:wrap;
    font:500 10.5px/1.5 var(--mono);color:var(--mut);
    letter-spacing:.03em}
  .phase-maps .map-row{display:flex;gap:8px;align-items:baseline}
  .phase-maps .map-k{color:var(--mut2);text-transform:uppercase;
    letter-spacing:.1em;font-size:9.5px;flex:0 0 auto}
  .phase-maps .map-v{color:#cfd8e8}
  .phase-maps .map-v em{font-style:normal;color:rgb(var(--pc));font-weight:600}

  .phase-expand-hint{
    font:500 9.5px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--mut2);margin-top:14px;
    display:flex;align-items:center;gap:6px;transition:.2s}
  .phase-card.expanded .phase-expand-hint{color:rgb(var(--pc))}
  .phase-expand-hint .chev{transition:transform .3s;font-size:10px}
  .phase-card.expanded .phase-expand-hint .chev{transform:rotate(90deg)}

  /* ============ PILOT ANATOMY VIEW ============ */
  .pilot-hero{border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:26px 28px;position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
  .pilot-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--emerald)),rgb(var(--cyan)))}
  .pilot-hero .k{font:600 10px/1 var(--mono);letter-spacing:.15em;
    text-transform:uppercase;color:rgb(var(--emerald));margin-bottom:12px}
  .pilot-hero h2{font:700 26px/1.2 var(--sans);letter-spacing:-.025em;
    margin-bottom:10px}
  .pilot-hero p{font-size:13.5px;color:#a5b1c3;max-width:74ch;line-height:1.65}

  /* brain diagram */
  .brain-diagram{
    display:grid;grid-template-columns:1fr 240px 1fr;gap:22px;
    align-items:center;margin-top:34px;
    padding:34px 22px;border-radius:20px;
    border:1px solid var(--line);
    background:radial-gradient(60% 60% at 50% 50%,
      rgba(var(--emerald),.06),rgba(13,18,24,.7));
    position:relative;overflow:hidden}
  .brain-diagram::before{content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle at 50% 50%,
      rgba(var(--emerald),.08) 1px,transparent 1px);
    background-size:22px 22px;
    mask-image:radial-gradient(circle at 50% 50%,#000 30%,transparent 75%);
    opacity:.5;pointer-events:none}

  .brain-side{display:flex;flex-direction:column;gap:14px;position:relative}

  .brain-node{padding:16px 18px;border-radius:14px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);
    position:relative;overflow:hidden;
    transition:.3s;cursor:pointer;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
  .brain-node:hover{transform:translateY(-3px);
    border-color:rgba(var(--nc),.5);
    box-shadow:0 20px 44px -28px rgba(var(--nc),.9)}
  .brain-node::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,rgb(var(--nc)),rgba(var(--nc),.15))}
  .brain-node .bn-k{font:600 9.5px/1 var(--mono);letter-spacing:.13em;
    text-transform:uppercase;color:rgb(var(--nc));margin-bottom:7px}
  .brain-node .bn-name{font:650 14px/1.3 var(--sans);color:#eef3fb;
    letter-spacing:-.005em;margin-bottom:6px}
  .brain-node .bn-desc{font-size:11.5px;line-height:1.55;color:#a5b1c3}

  .brain-hub{display:flex;flex-direction:column;
    align-items:center;justify-content:center;position:relative}
  .hub-core{
    width:190px;height:190px;border-radius:50%;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;text-align:center;padding:22px;
    background:radial-gradient(circle at 38% 32%,
      rgba(var(--emerald),.28),rgba(var(--emerald),.05));
    border:2px solid rgba(var(--emerald),.5);
    box-shadow:0 0 60px -14px rgba(var(--emerald),.9),
               inset 0 0 40px -10px rgba(var(--emerald),.5);
    animation:hubPulse 4s ease-in-out infinite}
  @keyframes hubPulse{
    0%,100%{box-shadow:0 0 60px -14px rgba(var(--emerald),.75),
                       inset 0 0 40px -10px rgba(var(--emerald),.4)}
    50%{box-shadow:0 0 82px -10px rgba(var(--emerald),1),
                    inset 0 0 50px -8px rgba(var(--emerald),.65)}}
  .hub-core::before,.hub-core::after{
    content:"";position:absolute;inset:-16px;border-radius:50%;
    border:1px dashed rgba(var(--emerald),.28);
    animation:ringSpin 24s linear infinite}
  .hub-core::after{inset:-32px;
    border-style:dotted;
    border-color:rgba(var(--emerald),.14);
    animation-duration:38s;
    animation-direction:reverse}
  @keyframes ringSpin{to{transform:rotate(360deg)}}

<body>

<div class="bg" id="bg"></div>

<div class="app">

  <!-- ==================== LEFT RAIL ==================== -->

</div>

const OPEN_ITEMS = [
  {
    num:"1", color:"245,190,60",
    name:"Pricing",
    desc:"$500 / $200 is a deliberate <b>foot-in-the-door, below market</b>. Keep as a loss-leader (and anchor it against the <em>$15k+ real-build cost</em>, as the proposal now does), or raise to ~$1,500 pilot / $500/mo. Judgment call — <em>no benchmark data</em>.",

  },
  {
    num:"2", color:"34,211,238",
    name:"Founder-credibility paragraph",
    desc:"Not pre-written for the Bayan context. Would be assembled from the <b>3 AITransforms case studies</b> + the site if the proposal needs one.",
    tags:["assemble if needed","3 case studies","not pre-written"]
  },
  {
    num:"3", color:"167,139,250",
    name:"AITransforms recognition",
    desc:"Confirm whether the CEO knows AITransforms as a <b>distinct entity</b> vs <em>\"Nasim's technical person\"</em> before leaning on the \"Why AITransforms\" section.",
    tags:["pre-send check","entity or role?","framing risk"]

  {
    num:"4", color:"255,138,61",
    name:"Nasim alignment",
    desc:"The <em>hard pre-send gate</em>. See <code>nasim-alignment-message.md</code>.",
    tags:["hard gate","pre-send","blocking"]
  }
];

/* =========================================================
   STATE
   ========================================================= */
const state = {
  view:"roadmap",
  expandedPhase:"p1",
  demoPlaying:false,
  demoTimeout:null,
  demoQueue:[],
  demoIdx:0
};

/* =========================================================
   HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* =========================================================
   NAV
   ========================================================= */
function renderNav(){
  const html = PHASES.map(p => {
    const isActive = (state.view === 'roadmap' && state.expandedPhase === p.id)
      || (state.view === 'pilot' && p.id === 'p1');
    return `
      <button class="phase-link ${isActive?'on':''} ${p.committed?'':'locked'}"
              data-phase="${p.id}" style="--pc:${p.color}">
        <span class="pn">${p.committed ? '✓' : p.num}</span>
        <span class="pt">
          <span class="pt-name">${esc(p.name)}</span>
          <span class="pt-sub">${p.committed ? 'committed' : 'earned later'}</span>
        </span>
      </button>`;
  }).join('');
  $('phaseList').innerHTML = html;

  $('phaseList').querySelectorAll('.phase-link').forEach(btn => {
    btn.addEventListener('click', () => {
      stopDemo();
      const id = btn.dataset.phase;
      if (id === 'p1'){
        state.view = 'pilot';
      } else {
        state.view = 'roadmap';
        state.expandedPhase = id;
      }
      document.querySelectorAll('.view-btn').forEach(b =>
        b.classList.toggle('on', b.dataset.view === state.view));
      renderAll();
      if (state.view === 'roadmap'){
        setTimeout(() => {
          const el = document.querySelector(`[data-phase-wrap="${id}"]`);
          if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
        }, 100);
      }
    });
  });
}

/* =========================================================
   CHROME
   ========================================================= */
function renderChrome(){
  const labels = {
    roadmap:"phase roadmap",
    pilot:"pilot anatomy",
    lanes:"scope lanes",
    items:"open items"
  };
  $('crumb').innerHTML = `
    <span class="pill">PB</span>
    <span class="sep">·</span>
    <span>Product Brain</span>
    <span class="sep">·</span>
    <span style="color:var(--mut2)">${labels[state.view]}</span>`;

  $('topBadges').innerHTML = `
    <span class="tb good">draft-first</span>
    <span class="tb">1-week pilot</span>
    <span class="tb">$500 one-time</span>
    <span class="tb hot">pre-revenue</span>`;

  // commit meter
  const committed = PHASES.filter(p => p.committed).length;
  const total = PHASES.length;
  $('commitPct').textContent = committed + '/' + total;
  $('commitFill').style.width = (committed / total * 100) + '%';

  // status bar
  const current = PHASES.find(p => p.id === state.expandedPhase) || PHASES[0];
  $('statusbar').innerHTML = `
    <span>plan <b>Bayan Product Brain · Roadmap</b></span>
    <span class="right">
      <span><b>${PHASES.length}</b> phases</span>
      <span class="chip">1 committed</span>
      <span class="chip hot">3 earned</span>
    </span>`;
}

/* =========================================================

function renderAll(){

  renderChrome();
  renderStage();
}

function renderStage(){
  const accents = {
    roadmap:"52,211,153",

    lanes:"148,163,184",
    items:"245,190,60"
  };
  document.documentElement.style.setProperty('--accent', accents[state.view]);

  if (state.view === 'roadmap') renderRoadmap();
  else if (state.view === 'pilot') renderPilot();
  else if (state.view === 'lanes') renderLanes();
  else if (state.view === 'items') renderItems();
}

/* =========================================================
   ROADMAP
   ========================================================= */
function renderRoadmap(){
  const hero = `
    <div class="hero">
      <div class="h-k">Roadmap · ${META.subtitle}</div>
      <h1>From a 1-week pilot to a standing AI system.</h1>
      <p>${META.framing}</p>
      <div class="framing">
        <span class="ic">✦</span>
        <div>${META.valueStory}</div>
      </div>
    </div>`;

  const stack = PHASES.map((p, pi) => {
    const isExpanded = state.expandedPhase === p.id;
    const isCommitted = p.committed;

    const partsHTML = p.parts.map(part => `
      <div class="part">
        <div class="pn2">${esc(part.name)}</div>
        <div class="pdesc">${esc(part.desc)}</div>
      </div>`).join('');

    const mapsHTML = `
      <div class="phase-maps">
        <div class="map-row">
          <span class="map-k">Maps to</span>
          <span class="map-v">${p.maps.map(m => `<em>${esc(m)}</em>`).join(' · ')}</span>
        </div>
        <div class="map-row">
          <span class="map-k">Proof</span>
          <span class="map-v">${esc(p.proof)}</span>
        </div>
        <div class="map-row">
          <span class="map-k">CEO cost</span>
          <span class="map-v">${esc(p.ceoCost)}</span>
        </div>
        ${p.note ? `<div class="map-row"><span class="map-k">Note</span><span class="map-v">${esc(p.note)}</span></div>` : ''}
      </div>`;

    const flowDot = `<div class="phase-flow-line ${isCommitted?'':'locked'}">
        <span class="dot" style="animation-delay:${pi*0.4}s"></span>
      </div>`;

    return `
      <div class="phase-block ${isCommitted?'committed':'locked'}"
           data-phase-wrap="${p.id}" style="--pc:${p.color}">
        <div class="phase-rail">
          <div class="phase-node">${isCommitted ? '✓' : p.num}</div>
          ${pi < PHASES.length - 1 ? flowDot : ''}
        </div>

        <div>
          <div class="phase-card ${isExpanded?'expanded':''}"
               data-phase-card="${p.id}" style="--pc:${p.color}">
            <div class="phase-head">
              <div class="phase-meta">
                <div class="phase-kicker">
                  ${esc(p.kicker)}
                  ${isCommitted
                    ? '<span class="commit-tag">committed</span>'
                    : '<span class="locked-tag">earned later</span>'}
                </div>
                <div class="phase-name">${esc(p.name)}</div>
                <div class="phase-desc">${p.desc}</div>
              </div>
              <div class="phase-facts">
                <span class="pfact">${esc(p.time)}</span>
                <span class="pfact soft">${esc(p.price)}</span>
              </div>
            </div>

            <div class="phase-parts">
              <div class="part-list">${partsHTML}</div>
              ${mapsHTML}
            </div>

            <div class="phase-expand-hint">
              <span class="chev">›</span>
              ${isExpanded ? 'collapse' : 'expand'} · ${p.parts.length} component${p.parts.length===1?'':'s'}
            </div>
          </div>
        </div>
      </div>`;
  }).join('');

  $('stage').innerHTML = hero + `<div class="phase-stack">${stack}</div>`;
  wireRoadmap();
}

function wireRoadmap(){
  document.querySelectorAll('[data-phase-card]').forEach(card => {
    card.addEventListener('click', () => {
      stopDemo();
      const id = card.dataset.phaseCard;
      const wasOpen = state.expandedPhase === id;
      state.expandedPhase = wasOpen ? null : id;
      renderAll();
      if (!wasOpen){
        setTimeout(() => {
          const el = document.querySelector(`[data-phase-wrap="${id}"]`);
          if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
        }, 100);
      }
    });
  });
}

/* =========================================================
   PILOT ANATOMY
   ========================================================= */
function renderPilot(){
  const hero = `
    <div class="pilot-hero">
      <div class="k">Phase 1 · pilot anatomy</div>
      <h2>Three pieces. One canonical record.</h2>
      <p>The wedge. A versioned, CEO-approved record per product, a plain-language
        query surface (EN + AR), and an automated audit that finds every surface
        that disagrees with the approved brain.</p>
    </div>`;

  const diagram = `
    <div class="brain-diagram">
      <div class="brain-side left">
        <div class="brain-node" style="--nc:var(--cyan)">
          <div class="bn-k">Input · governed</div>
          <div class="bn-name">CEO approval</div>
          <div class="bn-desc">Every record is versioned and approved before it becomes the canonical fact.</div>
        </div>
        <div class="brain-node" style="--nc:var(--cyan)">
          <div class="bn-k">Source</div>
          <div class="bn-name">Approved facts</div>
          <div class="bn-desc">Figures, pricing, positioning, taglines, brand entity, live/in-dev status.</div>
        </div>
      </div>

      <div class="brain-hub">
        <div class="hub-core">
          <div class="hk">Product Brain</div>
          <div class="hv">Canonical</div>
          <div class="hs">versioned · CEO-approved · draft-first</div>
        </div>
      </div>

      <div class="brain-side right">
        <div class="brain-node" style="--nc:var(--cyan)">
          <div class="bn-k">Output · query</div>
          <div class="bn-name">Ask-the-brain</div>
          <div class="bn-desc">Plain-language, EN + AR. "What's our official question count?" → the one approved answer.</div>
        </div>
        <div class="brain-node" style="--nc:var(--amber)">
          <div class="bn-k">Output · audit</div>
          <div class="bn-name">Drift check</div>
          <div class="bn-desc">Automated pass over site, product pages, and app listings → a drift report listing every disagreement.</div>
        </div>

  const proofs = [
    { k:"Maps to", color:"52,211,153", v:"2 services", sub:"Business Brain Mapping + RAG & Knowledge Architecture" },

    { k:"CEO cost", color:"167,139,250", v:"~2 calls", sub:"+ one approval pass + one weekly written report." },
    { k:"Price", color:"245,190,60", v:"$500", sub:"one-time · below market, deliberate foot-in-the-door." }
  ].map((x, i) => `
    <div class="proof-card" style="--pc:${x.color};--d:${i*60}ms">
      <div class="pc-k">${esc(x.k)}</div>
      <div class="pc-v">${esc(x.v)}</div>
      <div class="pc-sub">${esc(x.sub)}</div>

  $('stage').innerHTML = hero + diagram + `<div class="proof-strip">${proofs}</div>`;

/* =========================================================
   LANES
   ========================================================= */
function renderLanes(){
  const hero = `
    <div class="lanes-hero">
      <div class="k">Scope lanes</div>
      <h2>What's in, what's deferred, what isn't ours.</h2>
      <p>Three lanes, kept deliberately separate. In scope = the 4-phase wedge.
        Deferred = Approach B, parked on purpose. Not owned = Bayan-side decisions
        this engagement feeds but does not decide.</p>
    </div>`;

  const laneHTML = (lane, key) => {
    const items = lane.items.map(it => `
      <div class="lane-item">
        <div class="li-num">${esc(it.num)}</div>
        <div class="li-name">${esc(it.name)}</div>
        <div class="li-desc">${esc(it.desc)}</div>
      </div>`).join('');
    const note = lane.note ? `<div style="margin-top:14px;padding-top:12px;
      border-top:1px dashed #232c39;font-size:11.5px;line-height:1.55;
      color:var(--mut);font-family:var(--mono);letter-spacing:.02em">
      ${esc(lane.note)}</div>` : '';
    return `
      <div class="lane-col ${key} ${lane.locked?'locked-style':''}"
           style="--lc:${lane.color}">
        <div class="lane-head">
          <div class="lane-ico">${lane.ico}</div>
          <div>
            <div class="lane-name">${esc(lane.label)}</div>
            <div class="lane-count">${esc(lane.count)}</div>
          </div>
        </div>
        <div class="lane-items">${items}</div>
        ${note}
      </div>`;
  };

  $('stage').innerHTML = hero + `
    <div class="lanes-grid">
      ${laneHTML(LANES.inScope, 'inscope')}
      ${laneHTML(LANES.deferred, 'deferred')}
      ${laneHTML(LANES.notOwned, 'notowned')}
    </div>`;
}

/* =========================================================
   OPEN ITEMS
   ========================================================= */
function renderItems(){
  const hero = `
    <div class="items-hero">
      <div class="k">Open items · the founder owns</div>
      <h2>Not decidable from here.</h2>
      <p>Four decisions that belong to the founder. Each one is a fork the
        roadmap can't take without a call from you.</p>
    </div>`;

  const cards = OPEN_ITEMS.map((it, i) => `
    <div class="item-card" style="--ic:${it.color};--d:${i*60}ms">
      <div class="item-num">${it.num}</div>
      <div class="item-body">
        <div class="item-name">${esc(it.name)}</div>
        <div class="item-desc">${it.desc}</div>
        <div class="item-actions">
          ${it.tags.map((t, j) => `
            <span class="item-tag ${j === 0 ? '' : 'ghost'}">${esc(t)}</span>
          `).join('')}
        </div>
      </div>
    </div>`).join('');

  $('stage').innerHTML = hero + `<div class="items-list">${cards}</div>`;
}

/* =========================================================
   VIEW SWITCH
   ========================================================= */
$('viewSwitch').addEventListener('click', e => {
  const btn = e.target.closest('.view-btn');
  if (!btn) return;
  stopDemo();
  state.view = btn.dataset.view;
  if (state.view !== 'roadmap') state.expandedPhase = null;
  else state.expandedPhase = 'p1';
  $('stage').scrollTop = 0;
  renderAll();
});

/* =========================================================
   DEMO
   ========================================================= */
function startDemo(){
  stopDemo();
  state.demoPlaying = true;
  $('demoBtn').classList.add('playing');
  $('demoBtn').textContent = '■ stop demo';

  state.view = 'roadmap';
  state.expandedPhase = null;
  document.querySelectorAll('.view-btn').forEach(b =>
    b.classList.toggle('on', b.dataset.view === 'roadmap'));
  renderAll();

  state.demoTimeout = setTimeout(() => {
    // Walk through each phase: expand, pause, collapse
    let i = 0;
    function step(){
      if (!state.demoPlaying) return;
      if (i >= PHASES.length){
        // move to pilot view
        state.view = 'pilot';
        state.expandedPhase = null;
        document.querySelectorAll('.view-btn').forEach(b =>
          b.classList.toggle('on', b.dataset.view === 'pilot'));
        renderAll();
        state.demoTimeout = setTimeout(() => {
          // move to lanes
          state.view = 'lanes';
          document.querySelectorAll('.view-btn').forEach(b =>
            b.classList.toggle('on', b.dataset.view === 'lanes'));
          renderAll();
          state.demoTimeout = setTimeout(() => {
            // move to items
            state.view = 'items';
            document.querySelectorAll('.view-btn').forEach(b =>
              b.classList.toggle('on', b.dataset.view === 'items'));
            renderAll();
            stopDemo();
          }, 2600);
        }, 3200);
        return;
      }
      const p = PHASES[i];
      state.view = 'roadmap';
      state.expandedPhase = p.id;
      document.querySelectorAll('.view-btn').forEach(b =>
        b.classList.toggle('on', b.dataset.view === 'roadmap'));
      renderAll();
      setTimeout(() => {
        const el = document.querySelector(`[data-phase-wrap="${p.id}"]`);
        if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
      }, 80);
      i++;
      state.demoTimeout = setTimeout(step, 2200);
    }
    step();
  }, 400);
}

function stopDemo(){
  state.demoPlaying = false;
  if (state.demoTimeout) clearTimeout(state.demoTimeout);
  state.demoTimeout = null;
  const btn = $('demoBtn');
  if (btn){
    btn.classList.remove('playing');
    btn.textContent = '▶ run demo';
  }
}

$('demoBtn').addEventListener('click', () => {
  if (state.demoPlaying) stopDemo();
  else startDemo();
});

/* =========================================================
   KEYBOARD
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  const views = ['roadmap','pilot','lanes','items'];
  const i = views.indexOf(state.view);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){
    e.preventDefault();
    const next = views[(i+1) % views.length];
    stopDemo();
    state.view = next;
    state.expandedPhase = next === 'roadmap' ? 'p1' : null;
    document.querySelectorAll('.view-btn').forEach(b =>
      b.classList.toggle('on', b.dataset.view === next));
    renderAll();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
    e.preventDefault();
    const prev = views[(i-1+views.length) % views.length];
    stopDemo();
    state.view = prev;
    state.expandedPhase = prev === 'roadmap' ? 'p1' : null;
    document.querySelectorAll('.view-btn').forEach(b =>
      b.classList.toggle('on', b.dataset.view === prev));
    renderAll();
  }
});

/* =========================================================
   BOOT
   ========================================================= */
renderAll();
</script>
