<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayan Medical Education · Instagram Review</title>
<style>
  :root{
    --ink:#05060a;--ink2:#0b0d13;--panel:#121521;--panel2:#191d2c;
    --line:#232838;--txt:#f1f4fb;--mut:#7b8299;--mut2:#4d5468;
    --bayan:#1a4ff5;--bayan2:#4d7bff;
    --ig-purple:#833ab4;--ig-pink:#fd1d1d;--ig-orange:#fcb045;
    --gold:245,190,60;--emerald:52,211,153;--rose:244,63,94;
    --violet:167,139,250;--cyan:34,211,238;
    --accent:26,79,245;
    --ig-gradient:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--txt);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;line-height:1.5}

  /* ambient */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg::before{content:"";position:absolute;inset:-30%;
    background:
      radial-gradient(40% 32% at 8% 6%, rgba(26,79,245,.13), transparent 60%),
      radial-gradient(34% 30% at 92% 94%, rgba(131,58,180,.08), transparent 62%),
      radial-gradient(30% 26% at 50% 50%, rgba(253,29,29,.04), transparent 60%);
    filter:blur(32px)}
  .bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(78% 62% at 50% 38%,#000 20%,transparent 100%)}

  .app{position:relative;z-index:1;display:grid;
    grid-template-columns:270px 1fr;height:100vh}

  /* ============ LEFT RAIL ============ */
  .rail{border-right:1px solid var(--line);
    background:linear-gradient(180deg,rgba(18,21,33,.96),rgba(11,13,19,.96));
    backdrop-filter:blur(14px);display:flex;flex-direction:column;
    padding:18px 12px 14px;gap:14px;min-height:0}

  .brand{display:flex;align-items:center;gap:11px;
    padding:2px 6px 16px;border-bottom:1px solid var(--line)}

  /* Bayan avatar — logo placeholder */
  .bayan-avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;
    position:relative;
    background:linear-gradient(135deg,#0a1a52 0%,#1a4ff5 60%,#4d7bff 100%);
    display:grid;place-items:center;
    box-shadow:0 0 28px -4px rgba(26,79,245,.7)}
  .bayan-avatar::before{content:"";position:absolute;inset:-3px;border-radius:50%;
    background:conic-gradient(from 210deg,#833ab4,#fd1d1d,#fcb045,#1a4ff5,#833ab4);
    z-index:-1;padding:2px;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude}
  .bayan-avatar .mark{
    font:800 19px/1 var(--sans);color:#fff;letter-spacing:-.06em;
    position:relative;display:flex;align-items:center}
  .bayan-avatar .mark::after{
    content:"";position:absolute;right:-5px;bottom:-1px;
    width:12px;height:12px;border-radius:3px;
    background:#fff;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    opacity:.9}

  .brand-info{flex:1;min-width:0}
  .brand-name{font-size:13px;font-weight:700;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:#fff}
  .brand-sub{font:500 9px/1.35 var(--mono);color:var(--mut2);
    letter-spacing:.11em;text-transform:uppercase;margin-top:3px}

  .rail-label{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--mut2);padding:0 8px;margin-bottom:2px}

  .view-switch{display:flex;flex-direction:column;gap:3px;
    flex:1;overflow-y:auto;padding-right:2px;min-height:0}
  .view-switch::-webkit-scrollbar{width:4px}
  .view-switch::-webkit-scrollbar-thumb{background:#222a36;border-radius:9px}

  .view-btn{all:unset;cursor:pointer;position:relative;
    display:flex;align-items:center;gap:11px;
    padding:9px 11px 9px 12px;border-radius:10px;
    transition:background .18s,color .18s;color:var(--mut);
    font:500 11.5px/1.3 var(--sans);letter-spacing:.01em}
  .view-btn:hover{background:rgba(255,255,255,.04);color:#c8d2e2}
  .view-btn.on{background:rgba(var(--accent),.12);color:var(--txt)}
  .view-btn.on::before{content:"";position:absolute;left:0;top:50%;
    translate:0 -50%;width:3px;height:18px;border-radius:9px;
    background:rgb(var(--accent));box-shadow:0 0 14px 0 rgba(var(--accent),.9)}
  .view-btn .vi{width:22px;height:22px;flex:0 0 22px;border-radius:7px;
    display:grid;place-items:center;font-size:12px;
    background:rgba(255,255,255,.05);color:var(--mut2);transition:.2s}
  .view-btn.on .vi{background:rgba(var(--accent),.2);color:rgb(var(--accent))}

  .rail-foot{border-top:1px solid var(--line);padding-top:12px;
    display:flex;flex-direction:column;gap:10px}
  .handle-badge{padding:11px 13px;border-radius:11px;
    background:linear-gradient(135deg,rgba(26,79,245,.1),
      rgba(131,58,180,.06));
    border:1px solid rgba(26,79,245,.28);
    display:flex;align-items:center;gap:10px}
  .handle-badge .hb-dot{width:8px;height:8px;border-radius:50%;
    background:var(--emerald);box-shadow:0 0 12px 0 rgba(52,211,153,.9);
    flex:0 0 8px;
    animation:blip 2.2s ease-in-out infinite}
  @keyframes blip{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.7)}}
  .handle-badge .hb-text{flex:1;min-width:0}
  .handle-badge .hb-k{font:600 8.5px/1 var(--mono);letter-spacing:.13em;
    text-transform:uppercase;color:rgb(var(--accent));margin-bottom:3px}
  .handle-badge .hb-v{font:600 11px/1.3 var(--sans);color:#eef2f9;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .btn-demo{all:unset;cursor:pointer;text-align:center;
    font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
    padding:10px 12px;border-radius:9px;color:rgb(var(--accent));
    background:rgba(var(--accent),.1);border:1px solid rgba(var(--accent),.3);
    transition:.2s}
  .btn-demo:hover{background:rgba(var(--accent),.18)}
  .btn-demo.playing{color:#fff;background:rgb(var(--accent))}

  /* ============ MAIN ============ */
  .canvas{display:flex;flex-direction:column;min-width:0;min-height:0}

  .topbar{display:flex;align-items:center;gap:14px;
    padding:14px 26px;border-bottom:1px solid var(--line);
    background:rgba(11,13,19,.6);backdrop-filter:blur(10px);flex-wrap:wrap}
  .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:11px;
    font:500 12px/1.3 var(--mono);color:var(--mut);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb b{color:#dfe7f4;font-weight:600}
  .crumb .sep{color:var(--mut2)}
  .crumb .pill{font:600 10px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;padding:5px 9px;border-radius:7px;
    background:rgba(var(--accent),.14);color:rgb(var(--accent));
    border:1px solid rgba(var(--accent),.3)}
  .crumb .ig-pill{background:var(--ig-gradient);color:#fff;
    border:none;padding:5px 9px;border-radius:7px;
    font:600 10px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase}

  .stage{flex:1;min-height:0;overflow-y:auto;padding:26px 26px 40px;
    display:flex;flex-direction:column;gap:18px}
  .stage::-webkit-scrollbar{width:9px}
  .stage::-webkit-scrollbar-thumb{background:#1d2531;border-radius:9px}
  .stage::-webkit-scrollbar-thumb:hover{background:#28323f}

  /* reveal */
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}}
  .reveal{animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}

  /* ============ HERO ============ */
  .hero{border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:26px 28px;position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
  .hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045,#1a4ff5)}
  .hero .h-k{font:600 10px/1 var(--mono);letter-spacing:.15em;
    text-transform:uppercase;color:rgb(var(--accent));margin-bottom:12px;
    display:flex;align-items:center;gap:9px}
  .hero .h-k::before{content:"";width:14px;height:3px;border-radius:3px;
    background:var(--ig-gradient)}
  .hero h1{font:800 30px/1.12 var(--sans);letter-spacing:-.035em;
    margin-bottom:14px;max-width:26ch;color:#fff}
  .hero p{font-size:13.5px;color:#a8b3c5;max-width:78ch;line-height:1.65}
  .hero p b{color:#dfe7f4;font-weight:600}
  .hero p em{font-style:normal;color:rgb(var(--accent));font-weight:600}
  .hero p + p{margin-top:12px}

  .status-tag{display:inline-flex;align-items:center;gap:9px;
    font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    padding:7px 11px;border-radius:7px;margin-top:18px;
    background:rgba(245,190,60,.12);color:rgb(var(--gold));
    border:1px dashed rgba(245,190,60,.4)}

  /* ============ INSTAGRAM PHONE MOCKUP ============ */
  .ig-compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;
    align-items:start;margin-top:8px}
  .ig-phone-wrap{display:flex;flex-direction:column;gap:14px;align-items:center}
  .ig-label{font:700 10px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;padding:7px 13px;border-radius:8px;
    display:inline-flex;align-items:center;gap:8px}
  .ig-label.now{background:rgba(244,63,94,.14);color:rgb(var(--rose));
    border:1px solid rgba(244,63,94,.32)}
  .ig-label.next{background:rgba(26,79,245,.14);color:rgb(var(--bayan2));
    border:1px solid rgba(26,79,245,.32)}
  .ig-label.now::before{content:"●";font-size:8px}
  .ig-label.next::before{content:"◉";font-size:11px}

  .ig-phone{
    width:100%;max-width:340px;
    aspect-ratio:9/19.5;
    background:#000;border-radius:44px;
    border:10px solid #1a1d27;
    box-shadow:
      0 0 0 1px #2a2f3f,
      0 40px 90px -30px rgba(0,0,0,.95),
      0 0 70px -20px rgba(26,79,245,.35);
    position:relative;overflow:hidden;
    animation:fadeUp .65s cubic-bezier(.2,.7,.3,1) both}

  .ig-phone::before{content:"";position:absolute;top:12px;left:50%;
    translate:-50% 0;width:96px;height:26px;border-radius:99px;
    background:#000;z-index:10}

  .ig-screen{position:absolute;inset:0;
    background:#000;
    display:flex;flex-direction:column;overflow:hidden}

  .ig-status{display:flex;justify-content:space-between;
    padding:16px 24px 4px;
    font:500 11px/1 var(--sans);color:#fff;letter-spacing:.02em;
    z-index:11;position:relative}
  .ig-status .right{display:flex;gap:5px;align-items:center;font-size:10px}

  .ig-top{display:flex;align-items:center;padding:10px 16px 8px;
    gap:16px;color:#fff;font-size:15px}
  .ig-top .user{flex:1;display:flex;align-items:center;gap:8px;
    font:600 15px/1 var(--sans);letter-spacing:-.01em}
  .ig-top .user .chk{color:#0095f6;font-size:11px;margin-left:-4px;
    opacity:.4}
  .ig-top .icons{display:flex;gap:16px;font-size:17px;color:#fff}

  .ig-profile{padding:8px 16px 0;overflow-y:auto;flex:1}
  .ig-profile::-webkit-scrollbar{display:none}

  .ig-row-1{display:flex;align-items:center;gap:20px;margin-bottom:14px}
  .ig-avatar-wrap{position:relative;flex:0 0 82px;width:82px;height:82px}
  .ig-avatar-ring{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 210deg,#833ab4,#fd1d1d,#fcb045,#833ab4);
    display:grid;place-items:center}
  .ig-avatar-ring.hot{background:conic-gradient(from 210deg,#1a4ff5,#4d7bff,#833ab4,#1a4ff5)}
  .ig-avatar-inner{width:72px;height:72px;border-radius:50%;
    background:#000;display:grid;place-items:center;position:relative}
  .ig-avatar-inner .av-core{
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(135deg,#0a1a52,#1a4ff5 60%,#4d7bff);
    display:grid;place-items:center;
    font:800 26px/1 var(--sans);color:#fff;letter-spacing:-.06em}
  .ig-avatar-inner .av-core::after{
    content:"";position:absolute;right:6px;bottom:6px;
    width:14px;height:14px;border-radius:4px;
    background:#fff;opacity:.95;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}

  .ig-stats{display:flex;gap:22px;flex:1;justify-content:space-around}
  .ig-stat{display:flex;flex-direction:column;align-items:center;gap:2px}
  .ig-stat .num{font:700 16px/1 var(--sans);color:#fff;letter-spacing:-.02em}
  .ig-stat .lbl{font:400 11px/1.2 var(--sans);color:#a8a8a8}

  .ig-bio{padding:0 0 14px;font-size:12.5px;line-height:1.5;color:#fff}
  .ig-bio .name{font:700 13px/1.3 var(--sans);letter-spacing:-.01em;
    margin-bottom:4px;color:#fff}
  .ig-bio .desc{font-size:12.5px;line-height:1.55;color:#efefef}
  .ig-bio .desc .hl{color:rgb(var(--accent));font-weight:600}
  .ig-bio .link{margin-top:6px;font:500 12.5px/1.4 var(--sans);
    color:#0095f6;display:flex;align-items:center;gap:5px}
  .ig-bio .link .ic{font-size:11px}

  .ig-buttons{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;
    margin-bottom:16px}
  .ig-btn{all:unset;cursor:default;text-align:center;
    font:600 12px/1 var(--sans);letter-spacing:-.005em;
    padding:8px 10px;border-radius:9px;
    background:#262626;color:#fff;
    transition:.2s}
  .ig-btn.primary{background:#0095f6}

  .ig-highlights{display:flex;gap:14px;padding:4px 0 18px;
    overflow-x:auto;margin:0 -16px;padding-left:16px;padding-right:16px}
  .ig-highlights::-webkit-scrollbar{display:none}
  .ig-hl{display:flex;flex-direction:column;align-items:center;gap:6px;
    flex:0 0 auto}
  .ig-hl .ring{width:62px;height:62px;border-radius:50%;
    background:#262626;border:2px solid #2f2f2f;
    display:grid;place-items:center;position:relative;
    font:700 11px/1 var(--mono);color:#6b7280;
    letter-spacing:.04em}
  .ig-hl.filled .ring{background:conic-gradient(from 210deg,#1a4ff5,#4d7bff,#833ab4,#1a4ff5);}
  .ig-hl.filled .ring::before{content:"";position:absolute;inset:3px;
    border-radius:50%;background:#000}
  .ig-hl.filled .ring span{position:relative;color:#fff;
    font:700 10px/1 var(--sans);letter-spacing:-.005em;
    text-align:center;padding:0 4px}
  .ig-hl .lbl{font:400 10.5px/1.2 var(--sans);color:#fff;max-width:66px;
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .ig-tabs{display:flex;border-top:1px solid #2f2f2f;padding-top:8px;
    gap:0;margin:0 -16px;padding-left:16px;padding-right:16px}
  .ig-tab{all:unset;cursor:default;flex:1;text-align:center;
    padding:8px 0;font-size:20px;color:#8e8e8e}
  .ig-tab.on{color:#fff;border-bottom:1px solid #fff}

  .ig-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;
    margin:0 -16px;padding-bottom:20px}
  .ig-cell{aspect-ratio:1;background:#1a1d27;
    display:grid;place-items:center;
    font:700 9px/1.3 var(--mono);color:var(--mut2);
    letter-spacing:.05em;text-align:center;padding:8px}

  /* pin overlay for pinned posts */
  .ig-cell.pinned{position:relative}
  .ig-cell.pinned::before{content:"📌";position:absolute;top:5px;right:5px;
    font-size:11px}

  /* phone caption below */
  .phone-caption{font:500 10.5px/1.55 var(--mono);color:var(--mut2);
    letter-spacing:.03em;text-align:center;max-width:340px}

  /* ============ SECTION HEADERS ============ */
  .sec-head{display:flex;align-items:baseline;gap:14px;
    padding:6px 0;flex-wrap:wrap;animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
  .sec-num{font:700 11px/1 var(--mono);letter-spacing:.14em;
    padding:7px 11px;border-radius:8px;
    background:rgba(var(--accent),.14);color:rgb(var(--accent));
    border:1px solid rgba(var(--accent),.3)}
  .sec-title{font:700 22px/1.2 var(--sans);letter-spacing:-.025em;
    color:#fff;flex:1;min-width:0}
  .sec-title small{display:block;font:500 11.5px/1.4 var(--mono);
    color:var(--mut2);letter-spacing:.03em;margin-top:5px;font-weight:400}

  /* ============ DIAGNOSIS CARDS ============ */
  .diag-grid{display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .diag-card{padding:22px 24px 20px;border-radius:16px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);position:relative;overflow:hidden;
    animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:var(--d,0ms)}
  .diag-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,rgb(var(--dc)),rgba(var(--dc),.1))}
  .diag-card.works{--dc:52,211,153}
  .diag-card.friction{--dc:244,63,94}

  .diag-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;
    padding-bottom:14px;border-bottom:1px dashed #232c39}
  .diag-ico{width:36px;height:36px;flex:0 0 36px;border-radius:11px;
    display:grid;place-items:center;font-size:16px;
    background:rgba(var(--dc),.14);color:rgb(var(--dc));
    border:1px solid rgba(var(--dc),.32)}
  .diag-title{font:700 14px/1.3 var(--sans);color:#eef2f9;
    letter-spacing:-.01em}
  .diag-sub{font:500 10px/1.35 var(--mono);color:var(--mut2);
    letter-spacing:.06em;margin-top:3px;text-transform:lowercase}

  .diag-list{display:flex;flex-direction:column;gap:10px}
  .diag-item{display:flex;gap:11px;align-items:flex-start;
    padding:11px 13px;border-radius:10px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
    transition:.25s}
  .diag-item:hover{border-color:rgba(var(--dc),.4);
    background:rgba(var(--dc),.04);transform:translateX(3px)}
  .diag-n{flex:0 0 22px;width:22px;height:22px;border-radius:7px;
    display:grid;place-items:center;
    font:700 10px/1 var(--mono);
    background:rgba(var(--dc),.14);color:rgb(var(--dc));
    border:1px solid rgba(var(--dc),.3);margin-top:1px}
  .diag-body{flex:1;min-width:0}
  .diag-name{font:600 12.5px/1.4 var(--sans);color:#eef2f9;
    letter-spacing:-.005em;margin-bottom:5px}
  .diag-desc{font-size:11.5px;line-height:1.55;color:var(--mut)}
  .diag-desc b{color:#cfd8e8;font-weight:600}
  .diag-desc em{font-style:normal;color:rgb(var(--dc));font-weight:600}
  .diag-desc code{font-family:var(--mono);font-size:10.5px;
    color:#cfd8e8;background:rgba(255,255,255,.05);
    padding:1px 5px;border-radius:4px}

  /* ============ EVIDENCE SNAPSHOT ============ */
  .evidence{display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;
    border-radius:14px;overflow:hidden;
    border:1px solid var(--line);background:var(--line);
    animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
  .ev-cell{background:var(--ink2);padding:18px 20px 16px;
    position:relative;overflow:hidden}
  .ev-cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:rgb(var(--ec));opacity:.85}
  .ev-cell .ev-k{font:600 9.5px/1 var(--mono);letter-spacing:.13em;
    text-transform:uppercase;color:var(--mut2);margin-bottom:10px}
  .ev-cell .ev-v{font:700 20px/1.1 var(--sans);letter-spacing:-.03em;
    color:rgb(var(--ec));font-variant-numeric:tabular-nums;
    margin-bottom:6px}
  .ev-cell .ev-v small{font-size:12px;color:var(--mut2);font-weight:600;
    letter-spacing:0}
  .ev-cell .ev-n{font:400 10.5px/1.4 var(--mono);color:var(--mut);
    letter-spacing:.02em}

  /* ============ CONTENT PILLARS ============ */
  .pillars-grid{display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .pillar{border-radius:16px;overflow:hidden;

  .pillar-top{padding:18px 20px 14px;position:relative;

  .pillar-body{padding:16px 20px 18px}

  /* ============ WEEK CALENDAR ============ */
  .cal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

  .week-head{padding:14px 16px 12px;

  /* ============ KPI DASHBOARD ============ */
  .kpi-grid{display:grid;

  .kpi{padding:20px 20px 18px;border-radius:14px;

  .kpi:hover{transform:translateY(-3px);

  /* ============ APPROVAL BOUNDARY ============ */
  .boundary{margin-top:6px;padding:22px 26px;border-radius:16px;
    border:1px solid rgba(245,190,60,.32);

  .boundary .b-ico{flex:0 0 40px;width:40px;height:40px;border-radius:12px;

  .boundary .b-d{font-size:12.5px;line-height:1.65;color:#a8b3c5}
  .boundary .b-d b{color:#fff;font-weight:600}
  .boundary .b-d em{font-style:normal;color:rgb(var(--gold));font-weight:600}

  /* ============ STATUS BAR ============ */
  .statusbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:10px 26px;border-top:1px solid var(--line);

  .statusbar b{color:var(--mut);font-weight:500}
  .statusbar .right{margin-left:auto;display:flex;align-items:center;

  /* ============ RESPONSIVE ============ */

      padding-bottom:10px}

    .ig-phone{max-width:290px}

<body>

<div class="bg"></div>

<div class="app">

  <!-- ============ LEFT RAIL ============ -->
  <aside class="rail">
    <div class="brand">
      <div class="bayan-avatar">
        <span class="mark">B</span>
      </div>
      <div class="brand-info">
        <div class="brand-name">Bayan Medical Education</div>
        <div class="brand-sub">Instagram Review</div>
      </div>
    </div>

    <div class="rail-label">Views</div>
    <div class="view-switch" id="viewSwitch">
      <button class="view-btn on" data-view="overview">
        <span class="vi">◐</span> Executive summary
      </button>
      <button class="view-btn" data-view="profile">
        <span class="vi">◎</span> Profile refresh
      </button>
      <button class="view-btn" data-view="diagnosis">
        <span class="vi">◇</span> Diagnosis
      </button>
      <button class="view-btn" data-view="pillars">
        <span class="vi">▤</span> Content pillars
      </button>
      <button class="view-btn" data-view="calendar">
        <span class="vi">▥</span> 4-week calendar
      </button>
      <button class="view-btn" data-view="measurement">
        <span class="vi">◈</span> Measurement
      </button>
      <button class="view-btn" data-view="decisions">
        <span class="vi">⚑</span> CEO decisions
      </button>
    </div>

    <div class="rail-foot">
      <div class="handle-badge">
        <span class="hb-dot"></span>
        <div class="hb-text">
          <div class="hb-k">Reviewed account</div>
          <div class="hb-v">@bayanaitech</div>
        </div>
      </div>
      <button class="btn-demo" id="demoBtn">▶ run demo</button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="canvas">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
    </header>

    <section class="stage" id="stage"></section>

    <footer class="statusbar" id="statusbar"></footer>
  </main>

</div>

<script>
/* =========================================================
   HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;');

const VIEWS = [
  { id:'overview', label:'Executive summary', accent:'26,79,245' },
  { id:'profile', label:'Profile refresh', accent:'26,79,245' },
  { id:'diagnosis', label:'Diagnosis', accent:'52,211,153' },
  { id:'pillars', label:'Content pillars', accent:'131,58,180' },
  { id:'calendar', label:'4-week calendar', accent:'253,29,29' },
  { id:'measurement', label:'Measurement', accent:'252,176,69' },
  { id:'decisions', label:'CEO decisions', accent:'26,79,245' }
];

/* =========================================================
   CHROME
   ========================================================= */
function renderCrumb(){
  const v = VIEWS.find(x => x.id === state.view);
  $('crumb').innerHTML = `
    <span class="ig-pill">Instagram</span>
    <span class="sep">·</span>
    <span>Bayan Medical Education</span>
    <span class="sep">·</span>
    <span style="color:var(--mut2)">${v.label}</span>`;
}

function renderStatus(){
  $('statusbar').innerHTML = `
    <span>review <b>@bayanaitech · 2 Oct 2026</b></span>
    <span class="right">
      <span><b>~775</b> followers</span>
      <span class="chip ig">draft · not authorized</span>
      <span class="chip">insights pending</span>
    </span>`;
}

/* =========================================================
   STATE
   ========================================================= */
const state = { view:'overview', demoPlaying:false, demoTimeout:null };

/* =========================================================
   STAGE DISPATCH
   ========================================================= */
function renderAll(){
  renderCrumb();
  renderStatus();
  renderStage();
  $('viewSwitch').querySelectorAll('.view-btn').forEach(b =>
    b.classList.toggle('on', b.dataset.view === state.view));
  const accent = VIEWS.find(x => x.id === state.view).accent;
  document.documentElement.style.setProperty('--accent', accent);
}

function renderStage(){
  const el = $('stage');
  el.innerHTML = '';
  if (state.view === 'overview') renderOverview();
  else if (state.view === 'profile') renderProfile();
  else if (state.view === 'diagnosis') renderDiagnosis();
  else if (state.view === 'pillars') renderPillars();
  else if (state.view === 'calendar') renderCalendar();
  else if (state.view === 'measurement') renderMeasurement();
  else if (state.view === 'decisions') renderDecisions();
  el.scrollTop = 0;
}

/* =========================================================
   VIEW: OVERVIEW
   ========================================================= */
function renderOverview(){
  const html = `
    <div class="hero">
      <div class="h-k">Executive recommendation · 2 October 2026</div>
      <h1>Treat the profile as a company front door — not an exam-only feed.</h1>
      <p>
        The account currently describes itself as <em>"AI platforms for
        healthcare, education &amp; research. 6 live products. Built in Oman"</em>,
        with bio links pointing to both <b>bayanai.tech</b> and
        <b>bayan.edu.om</b>. The main opportunity is not more generic
        posting — it is making the company promise, product navigation, and
        next action clearer, then establishing a repeatable proof-led
        editorial system.
      </p>
      <p>
        <b>Specific trust risk:</b> the Instagram bio says "6 live products"
        while the site currently reads "Seven initiatives" and "Showing 6
        solutions." Reconcile <em>count vs. initiative vs. live product</em>
        before repeating any count in the bio.
      </p>

      <div class="status-tag">⚠ Draft plan · no edit, post, or spend authorized</div>
    </div>

    <div class="sec-head">
      <span class="sec-num">01</span>
      <h2 class="sec-title">Evidence snapshot
        <small>public, observed 2026-10-02 · analytics not available</small>
      </h2>
    </div>

    <div class="evidence">
      <div class="ev-cell" style="--ec:34,211,238">
        <div class="ev-k">Followers</div>
        <div class="ev-v">773–775</div>
        <div class="ev-n">approx. point-in-time</div>
      </div>
      <div class="ev-cell" style="--ec:26,79,245">
        <div class="ev-k">Display name</div>
        <div class="ev-v" style="font-size:14px">Bayanai-tech</div>
        <div class="ev-n">brand-ambiguous</div>
      </div>
      <div class="ev-cell" style="--ec:131,58,180">
        <div class="ev-k">Category</div>
        <div class="ev-v" style="font-size:14px">IT Company</div>
        <div class="ev-n">verify more precise option</div>
      </div>
      <div class="ev-cell" style="--ec:244,63,94">
        <div class="ev-k">Verified badge</div>
        <div class="ev-v" style="font-size:18px">None</div>
        <div class="ev-n">absent</div>
      </div>
      <div class="ev-cell" style="--ec:252,176,69">
        <div class="ev-k">Highlights</div>
        <div class="ev-v" style="font-size:18px">0</div>
        <div class="ev-n">no persistent navigation</div>
      </div>
      <div class="ev-cell" style="--ec:167,139,250">
        <div class="ev-k">Bio links</div>
        <div class="ev-v" style="font-size:14px">2</div>
        <div class="ev-n">no audience-first routing</div>
      </div>
    </div>
  `;
  $('stage').innerHTML = html;
}

/* =========================================================
   VIEW: PROFILE (before / after phones)
   ========================================================= */
function renderProfile(){
  const html = `
    <div class="hero">
      <div class="h-k">Profile refresh · draft for CEO / brand review</div>
      <h1>Before and after — how the profile reads at a glance.</h1>
      <p>
        The recommended direction is a <b>company-level front door</b> —
        portfolio first, product routes second, exam-prep routing delegated
        to <b>bayan.edu.om</b>. The bio's unverified "6 live products"
        count is removed until product status and count are reconciled.
      </p>
    </div>

    <div class="sec-head" style="margin-top:6px">
      <span class="sec-num">02</span>
      <h2 class="sec-title">Profile comparison
        <small>left: current · right: recommended draft · not published</small>
      </h2>
    </div>

    <div class="ig-compare">
      <!-- CURRENT -->
      <div class="ig-phone-wrap">
        <span class="ig-label now">current</span>
        ${renderPhone({current:true})}
        <div class="phone-caption">
          Bio still uses "6 live products" · two links, no audience-first routing<br>
          · no highlights · display name reads "Bayanai-tech"
        </div>
      </div>

      <!-- RECOMMENDED -->
      <div class="ig-phone-wrap">
        <span class="ig-label next">recommended draft</span>
        ${renderPhone({current:false})}
        <div class="phone-caption">
          Bio removes the count · company name explicit · primary link routes<br>
          to a portfolio with labeled destinations · highlights installed
        </div>
      </div>
    </div>
  `;
  $('stage').innerHTML = html;
}

function renderPhone({current}){
  const bio = current
    ? `<div class="desc">
         AI platforms for healthcare, education &amp; research.
         <span class="hl">6 live products</span>. Built in Oman
       </div>
       <div class="link"><span class="ic">🔗</span> bayanai.tech / bayan.edu.om</div>`
    : `<div class="desc">
         Healthcare, education &amp; research from Oman.<br>
         <b style="color:#fff">Bayan AI Technologies</b> | Explore our work ↓
       </div>
       <div class="link"><span class="ic">🔗</span> bayanai.tech (portfolio)</div>`;

  const highlights = current
    ? `<div class="ig-hl"><div class="ring">empty</div><div class="lbl">—</div></div>
       <div class="ig-hl"><div class="ring">empty</div><div class="lbl">—</div></div>
       <div class="ig-hl"><div class="ring">empty</div><div class="lbl">—</div></div>
       <div class="ig-hl"><div class="ring">empty</div><div class="lbl">—</div></div>`
    : `<div class="ig-hl filled"><div class="ring"><span>START</span></div><div class="lbl">Start here</div></div>
       <div class="ig-hl filled"><div class="ring"><span>BAYAN</span></div><div class="lbl">Bayan</div></div>
       <div class="ig-hl filled"><div class="ring"><span>R&amp;D</span></div><div class="lbl">Research</div></div>
       <div class="ig-hl filled"><div class="ring"><span>TEAM</span></div><div class="lbl">Team</div></div>`;

  const gridCells = current
    ? Array(9).fill(0).map(() =>
        `<div class="ig-cell">no public feed evidence</div>`).join('')
    : Array(9).fill(0).map((_,i) =>
        `<div class="ig-cell${i < 3 ? ' pinned' : ''}">
          ${i === 0 ? 'WHAT WE DO\\nportfolio' :
            i === 1 ? 'PRODUCT MAP\\nstatus · links' :
            i === 2 ? 'PROOF / DEMO\\nstrongest reel' :
            'content ' + (i+1)}
         </div>`).join('');

  return `
    <div class="ig-phone">
      <div class="ig-screen">
        <div class="ig-status">
          <span>9:41</span>
          <span class="right"><span>●●●</span><span>▮</span></span>
        </div>

        <div class="ig-top">
          <div class="user">
            ${current ? 'bayanai-tech' : 'bayanaitech'}
            <span class="chk">✓</span>
          </div>
          <div class="icons">
            <span>＋</span>
            <span>☰</span>
          </div>
        </div>

        <div class="ig-profile">
          <div class="ig-row-1">
            <div class="ig-avatar-wrap">
              <div class="ig-avatar-ring${current ? '' : ' hot'}">
                <div class="ig-avatar-inner">
                  <div class="av-core">B</div>
                </div>
              </div>
            </div>
            <div class="ig-stats">
              <div class="ig-stat">
                <span class="num">${current ? '—' : '—'}</span>
                <span class="lbl">posts</span>
              </div>

function startDemo(){
  stopDemo();
  state.demoPlaying = true;
  $('demoBtn').classList.add('playing');
  $('demoBtn').textContent = '■ stop demo';

  state.view = 'overview';
  renderAll();

  const sequence = [
    { view:'overview', delay:2400 },
    { view:'profile', delay:3400 },
    { view:'diagnosis', delay:3000 },
    { view:'pillars', delay:2800 },
    { view:'calendar', delay:3200 },
    { view:'measurement', delay:3200 },
    { view:'decisions', delay:3200 }
  ];

  let i = 0;
  function step(){
    if (!state.demoPlaying) return;
    if (i >= sequence.length){
      stopDemo();
      return;
    }
    state.view = sequence[i].view;
    renderAll();
    i++;
    state.demoTimeout = setTimeout(step, sequence[i-1].delay);
  }
  state.demoTimeout = setTimeout(step, 500);
}

function stopDemo(){
  state.demoPlaying = false;
  if (state.demoTimeout) clearTimeout(state.demoTimeout);
  state.demoTimeout = null;
  const btn = $('demoBtn');
  if (btn){
    btn.classList.remove('playing');
    btn.textContent = '▶ run demo';
  }
}

$('demoBtn').addEventListener('click', () => {
  if (state.demoPlaying) stopDemo();
  else startDemo();
});

/* =========================================================
   KEYBOARD
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  const idx = VIEWS.findIndex(v => v.id === state.view);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){
    e.preventDefault();
    stopDemo();
    state.view = VIEWS[(idx+1) % VIEWS.length].id;
    renderAll();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
    e.preventDefault();
    stopDemo();
    state.view = VIEWS[(idx-1+VIEWS.length) % VIEWS.length].id;
    renderAll();
  }
});

/* =========================================================
   BOOT
   ========================================================= */
renderAll();
</script>
</body>
</html>
