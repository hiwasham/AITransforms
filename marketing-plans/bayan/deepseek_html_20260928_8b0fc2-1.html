<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayan · Health Progression — Brick by Brick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050810;
    --panel:#0c1420;
    --panel-2:#101a28;
    --line:#1a2638;
    --line-2:#14202f;
    --line-hi:#33445c;
    --text:#eaf0f8;
    --muted:#7e8fa6;
    --dim:#4e5d73;
    --gold:#e7b544;
    --gold-deep:#a76d13;
    --bayan:#1a4ff5;
    --bayan-soft:#5c7cff;
    --pass:#2ed573;
    --warn:#ffb020;
    --fail:#ff6b6b;
    --cyan:#22d3ee;
    --violet:#a06bff;
    --orange:#ff8a5c;
    --pink:#ff5c8a;
    --teal:#2DD4BF;
    --green:#34D399;
    --blue:#60A5FA;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1200px 700px at 12% -8%, #0e1a3a 0%, transparent 55%),
      radial-gradient(1000px 600px at 95% 0%, #241a0a 0%, transparent 52%),
      var(--bg);
    color:var(--text);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;padding:40px 22px;overflow-x:hidden;
  }
  .wrap{max-width:1160px;margin:0 auto}

  /* ═══════════════════════════════════════════════════════════
     HEALTH TOWER CARD
     ═══════════════════════════════════════════════════════════ */
  .ht-card{
    border:1px solid rgba(231,181,68,.32);
    border-radius:20px;
    background:
      radial-gradient(700px 300px at 0% 0%, rgba(231,181,68,.06), transparent 65%),
      linear-gradient(180deg, #0a1220, #0c1420);
    position:relative;
    overflow:hidden;
  }
  .ht-card::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    animation:ht-scan 3s ease-in-out infinite;
  }
  @keyframes ht-scan{0%,100%{opacity:.4}50%{opacity:1}}

  /* ── HEADER ───────────────────────────────────── */
  .ht-head{
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
    padding:24px 26px 20px;border-bottom:1px solid var(--line-2);
    flex-wrap:wrap;
  }
  .ht-kicker{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold);font-weight:700;
    margin-bottom:8px;
  }
  .ht-title{
    font-family:var(--serif);font-size:22px;font-weight:400;
    letter-spacing:-.015em;color:#fff;line-height:1.2;
  }
  .ht-score{
    display:flex;align-items:baseline;gap:4px;
    font-family:var(--serif);font-variant-numeric:tabular-nums;
    letter-spacing:-.04em;line-height:1;
    padding:6px 14px;
    background:rgba(0,0,0,.25);
    border:1px solid var(--line-2);
    border-radius:12px;
  }
  .ht-now{
    font-size:44px;color:#ffb020;
    text-shadow:0 0 18px rgba(255,176,32,.3);
    transition:color .3s;
  }
  .ht-sep{font-size:28px;color:var(--dim);padding:0 4px;opacity:.75}
  .ht-target{
    font-size:44px;color:#2DD4BF;
    text-shadow:0 0 18px rgba(45,212,191,.35);
  }

  /* ── BRICK WALL — the 6 tasks as bricks ────────── */
  .ht-wall{
    padding:24px 26px 0;
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:10px;
    position:relative;
  }
  @media(max-width:960px){ .ht-wall{grid-template-columns:repeat(3, 1fr)} }
  @media(max-width:560px){ .ht-wall{grid-template-columns:repeat(2, 1fr)} }

  /* baseline under bricks — makes them look seated */
  .ht-wall::after{
    content:"";
    grid-column:1 / -1;
    height:3px;
    border-radius:2px;
    background:linear-gradient(90deg, transparent, rgba(231,181,68,.25), transparent);
    margin-top:2px;
    margin-bottom:-4px;
  }

  .ht-brick{
    position:relative;
    padding:16px 14px 14px;
    border-radius:10px;
    border:1.5px solid var(--line-hi);
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.01)),
      linear-gradient(180deg, #0d1626, #0a1220);
    cursor:pointer;
    user-select:none;
    transition:all .35s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;gap:10px;
    min-height:132px;
    overflow:hidden;
    /* mortar-line detail */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.04),
      inset 0 -1px 0 rgba(0,0,0,.3),
      0 4px 12px -6px rgba(0,0,0,.5);
  }
  /* brick texture — subtle horizontal notch */
  .ht-brick::before{
    content:"";
    position:absolute;
    top:0;left:-8%;right:-8%;height:6px;
    background:linear-gradient(180deg, rgba(255,255,255,.06), transparent);
    border-radius:0 0 50% 50% / 0 0 100% 100%;
    pointer-events:none;
  }
  .ht-brick:hover{
    transform:translateY(-3px);
    border-color:var(--gold);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 -1px 0 rgba(0,0,0,.3),
      0 10px 24px -10px rgba(231,181,68,.4);
  }
  .ht-brick.done{
    border-color:var(--brick-color, var(--green));
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--brick-color, var(--green)) 18%, transparent),
        color-mix(in srgb, var(--brick-color, var(--green)) 6%, transparent)),
      linear-gradient(180deg, #0d1626, #0a1220);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 -1px 0 rgba(0,0,0,.3),
      0 6px 20px -6px var(--brick-color, var(--green));
    animation:brick-lock .5s cubic-bezier(.22,1,.36,1);
  }
  @keyframes brick-lock{
    0%{ transform:translateY(-3px) scale(1.02); }
    40%{ transform:translateY(2px) scale(.98); }
    70%{ transform:translateY(-1px) scale(1.01); }
    100%{ transform:translateY(0) scale(1); }
  }

  .ht-brick-top{
    display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  }
  .ht-brick-num{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    color:var(--dim);font-weight:700;
  }
  .ht-brick-check{
    width:20px;height:20px;border-radius:6px;
    border:1.5px solid var(--line-hi);
    display:grid;place-items:center;
    font-size:11px;color:transparent;font-weight:800;
    transition:.35s;
    flex:0 0 auto;
  }
  .ht-brick.done .ht-brick-check{
    background:var(--brick-color, var(--green));
    border-color:var(--brick-color, var(--green));
    color:#04211E;
    transform:scale(1.1);
  }

  .ht-brick-title{
    font-size:12.5px;font-weight:650;color:#eef4fb;
    line-height:1.3;
    flex:1;
  }
  .ht-brick.done .ht-brick-title{color:#fff}

  .ht-brick-foot{
    display:flex;align-items:center;justify-content:space-between;
    padding-top:8px;
    border-top:1px solid rgba(255,255,255,.06);
  }
  .ht-brick-desc{
    font-family:var(--mono);font-size:9px;letter-spacing:.04em;
    color:var(--dim);line-height:1.3;
    flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ht-brick-delta{
    font-family:var(--mono);font-size:11.5px;font-weight:800;
    color:var(--brick-color, #2DD4BF);
    padding:3px 8px;border-radius:6px;
    background:color-mix(in srgb, var(--brick-color, #2DD4BF) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--brick-color, #2DD4BF) 30%, transparent);
    transition:.3s;
    flex:0 0 auto;
    margin-left:8px;
  }
  .ht-brick.done .ht-brick-delta{
    background:var(--brick-color, var(--green));
    color:#04211E;
    border-color:var(--brick-color, var(--green));
  }

  /* ── VISUAL ─────────────────────────────────── */
  .ht-visual{
    padding:8px 20px 12px;
    display:flex;justify-content:center;
    position:relative;
  }
  /* small connector line from the wall to the diagram */
  .ht-visual::before{
    content:"";
    position:absolute;
    top:0; left:50%;
    width:1px;height:24px;
    background:linear-gradient(180deg, rgba(231,181,68,.4), transparent);
    transform:translateX(-50%);
  }
  .ht-visual svg{
    width:100%;max-width:1000px;height:auto;display:block;overflow:visible;
  }

  /* tower transition */
  #htRightBody,
  #htRightDots,
  #htRightGlow,
  #htRightBeacon,
  #htRightBeaconCore,
  #htRightLabel,
  #htRightTopEdge,
  #htRightGhost{
    transition:
      y .7s cubic-bezier(.22,1,.36,1),
      height .7s cubic-bezier(.22,1,.36,1),
      cy .7s cubic-bezier(.22,1,.36,1),
      y1 .7s cubic-bezier(.22,1,.36,1),
      y2 .7s cubic-bezier(.22,1,.36,1),
      fill .7s ease,
      stroke .7s ease,
      opacity .5s ease;
  }

  /* ── FOOTER ─────────────────────────────────── */
  .ht-foot{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:16px 26px;border-top:1px solid var(--line-2);
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--dim);
    flex-wrap:wrap;
  }
  .ht-foot .ht-progress b{ color:#2DD4BF; font-weight:700; }
  .ht-reset{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:700;
    padding:7px 14px;border-radius:8px;
    border:1px solid var(--line-2);background:#0a121d;
    color:var(--dim);cursor:pointer;transition:.2s;
  }
  .ht-reset:hover{
    color:#F87171;border-color:rgba(248,113,113,.4);
    background:rgba(248,113,113,.08);
  }

  /* ── SVG text helpers ────────────────────────── */
  .ht-visual .t-label{
    font-family:'Inter', sans-serif; font-weight:800; letter-spacing:-.02em;
  }
  .ht-visual .t-sub{
    font-family:'JetBrains Mono', monospace; font-size:10.5px;
    letter-spacing:.14em; text-transform:uppercase;
  }
  .ht-visual .t-cap{
    font-family:'Caveat', cursive; font-weight:600;
  }
  @keyframes ht-pulse{0%,100%{opacity:1}50%{opacity:.6}}
  #htGapLabel{transition:opacity .5s ease}
  #htGapLabel text:first-child{animation:ht-pulse 3.2s ease-in-out infinite}

  @media(max-width:640px){
    body{padding:24px 12px}
    .ht-head{padding:20px 20px 16px;flex-direction:column}
    .ht-score{align-self:flex-start}
    .ht-now,.ht-target{font-size:36px}
    .ht-wall{padding:20px 18px 0;gap:8px}
    .ht-brick{min-height:120px;padding:14px 12px 12px}
    .ht-brick-title{font-size:11.5px}
    .ht-foot{padding:14px 18px}
    .ht-visual{padding:6px 10px 8px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="ht-card">
    <div class="ht-head">
      <div>
        <div class="ht-kicker">◆ health progression · task-driven</div>
        <div class="ht-title">Build it brick by brick — 25 to 54</div>
      </div>
      <div class="ht-score">
        <span class="ht-now" id="htNow">25</span>
        <span class="ht-sep">/</span>
        <span class="ht-target">54</span>
      </div>
    </div>

    <!-- ═══ BRICK WALL — 6 tasks as clickable bricks ═══ -->
    <div class="ht-wall" id="htWall"></div>

    <!-- ═══ DIAGRAM ═══ -->
    <div class="ht-visual" id="htVisual">
      <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="Bayan health growth from 25 to 54 driven by tasks">

        <defs>
          <linearGradient id="htLeftGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2DD4BF" stop-opacity=".95"/>
            <stop offset="60%" stop-color="#0D9488" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#0D9488" stop-opacity=".2"/>
          </linearGradient>
          <linearGradient id="htRightGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--tower-color, #F87171)" stop-opacity=".95"/>
            <stop offset="100%" stop-color="var(--tower-color, #F87171)" stop-opacity=".35"/>
          </linearGradient>
          <pattern id="htDenseDots" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
            <circle cx="4.5" cy="4.5" r=".9" fill="#2DD4BF" opacity=".35"/>
          </pattern>
          <pattern id="htSparseDots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r=".9" fill="var(--tower-color, #F87171)" opacity=".55"/>
          </pattern>
          <filter id="htGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="htGlowTight" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- GROUND -->
        <line x1="60" y1="600" x2="1140" y2="600" stroke="rgba(137,152,176,.28)" stroke-width="1"/>
        <line x1="60" y1="600" x2="1140" y2="600" stroke="rgba(137,152,176,.08)" stroke-width="6"/>
        <g opacity=".3" stroke="rgba(137,152,176,.5)" stroke-width="1">
          <line x1="200" y1="600" x2="200" y2="608"/>
          <line x1="500" y1="600" x2="500" y2="608"/>
          <line x1="700" y1="600" x2="700" y2="608"/>
          <line x1="1000" y1="600" x2="1000" y2="608"/>
        </g>

        <!-- TARGET LINE at 54 -->
        <line x1="60" y1="340" x2="1140" y2="340" stroke="#2DD4BF"
              stroke-width="1.2" stroke-dasharray="4 8" opacity=".45"/>
        <rect x="60" y="326" width="104" height="16" rx="4" fill="#04070E" opacity=".9"/>
        <text x="70" y="338" font-family="JetBrains Mono, monospace" font-size="10"
              fill="#2DD4BF" opacity=".9" letter-spacing=".14em">TARGET · 54</text>

        <!-- LEFT TOWER -->
        <rect x="180" y="120" width="200" height="480"
              fill="url(#htLeftGrad)" stroke="#2DD4BF" stroke-width="1.4" stroke-opacity=".7"/>
        <rect x="180" y="120" width="200" height="480" fill="url(#htDenseDots)"/>
        <line x1="246" y1="120" x2="246" y2="600" stroke="#2DD4BF" stroke-opacity=".18" stroke-width=".8"/>
        <line x1="313" y1="120" x2="313" y2="600" stroke="#2DD4BF" stroke-opacity=".18" stroke-width=".8"/>
        <line x1="180" y1="120" x2="380" y2="120" stroke="#7DFFE7" stroke-width="2"/>
        <circle cx="280" cy="108" r="6" fill="#7DFFE7" filter="url(#htGlow)"/>
        <circle cx="280" cy="108" r="3" fill="#fff"/>
        <circle cx="280" cy="108" r="14" fill="none" stroke="#2DD4BF" stroke-width="1" opacity=".6">
          <animate attributeName="r" values="14;48;14" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".6;0;.6" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <text x="280" y="86" text-anchor="middle" class="t-cap"
              font-size="22" fill="#2DD4BF">what Bayan built</text>
        <text x="280" y="638" text-anchor="middle" class="t-label"
              font-size="15" fill="#2DD4BF">SUPPLY</text>
        <text x="280" y="658" text-anchor="middle" class="t-sub"
              fill="#8998B0">5,589 questions · 55+ countries</text>

        <!-- RIGHT TOWER -->
        <rect id="htRightGhost" x="820" y="340" width="200" height="140"
              fill="none" stroke="#2DD4BF" stroke-width="1.4"
              stroke-dasharray="5 6" opacity=".35"/>

        <rect id="htRightGlow" x="820" y="480" width="200" height="120"
              fill="var(--tower-color, #F87171)" opacity=".14"/>

        <rect id="htRightBody" x="820" y="480" width="200" height="120"
              fill="url(#htRightGrad)" stroke="var(--tower-color, #F87171)"
              stroke-width="1.6" stroke-opacity=".9"/>

        <rect id="htRightDots" x="820" y="480" width="200" height="120"
              fill="url(#htSparseDots)"/>

        <line id="htRightTopEdge" x1="820" y1="480" x2="1020" y2="480"
              stroke="var(--tower-color, #F87171)" stroke-width="2.4"/>

        <circle id="htRightBeacon" cx="920" cy="472" r="6"
                fill="var(--tower-color, #F87171)" filter="url(#htGlowTight)"/>
        <circle id="htRightBeaconCore" cx="920" cy="472" r="2.8" fill="#fff"/>

        <text id="htRightLabel" x="920" y="460" text-anchor="middle" class="t-cap"
              font-size="22" fill="var(--tower-color, #F87171)">what the market finds</text>

        <text x="920" y="638" text-anchor="middle" class="t-label"
              font-size="15" fill="var(--tower-color, #F87171)">DISCOVERY</text>
        <text id="htRightCount" x="920" y="658" text-anchor="middle" class="t-sub"
              fill="var(--tower-color, #F87171)">25 / 100 health</text>

        <!-- GAP readout -->
        <g id="htGapLabel" transform="translate(600,300)">
          <text text-anchor="middle" class="t-cap" font-size="34"
                fill="#FBBF24">the gap</text>
          <text y="26" text-anchor="middle" font-family="JetBrains Mono, monospace"
                font-size="11" fill="#FBBF24" letter-spacing=".1em">
            <tspan id="htGapValue" font-weight="600">29</tspan> points to close
          </text>
        </g>
      </svg>
    </div>

    <div class="ht-foot">
      <span class="ht-progress" id="htProgress"><b>0</b> of 6 bricks placed</span>
      <button type="button" class="ht-reset" id="htReset">Reset all</button>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   HEALTH TOWER — bricks drive the tower
   ═══════════════════════════════════════════════════════════ */
(function(){
  const BASE_HEALTH = 25;
  const TARGET_HEALTH = 54;
  const TOWER_BASE_Y = 600;
  const TOWER_MAX_H = 480;   // full tower when health = 100

  // Tasks sum to +29 exactly: 25 + 29 = 54
  // Each task gets its own accent color so the brick wall feels varied
  const TASKS = [
    {
      id: 'kw',
      label: 'Rank for commercial-intent keywords',
      desc: 'buyer intent searches',
      from: '0 keywords', to: '4 keywords',
      delta: 6,
      color: '#60A5FA'
    },
    {
      id: 'ai',
      label: 'Get named in AI answers',
      desc: 'the new search layer',
      from: '0 of 3 probes', to: '3 of 3 probes',
      delta: 5,
      color: '#A78BFA'
    },
    {
      id: 'goog',
      label: 'Google visibility climbs',
      desc: 'top 100 for exam terms',
      from: '0 / 100', to: '28 / 100',
      delta: 5,
      color: '#22D3EE'
    },
    {
      id: 'ais',
      label: 'AI search visibility improves',
      desc: 'cited in more answers',
      from: '10 / 100', to: '42 / 100',
      delta: 4,
      color: '#2DD4BF'
    },
    {
      id: 'web',
      label: 'Website & content reaches full',
      desc: 'BLUF · meta · noscript',
      from: '73 / 100', to: '100 / 100',
      delta: 5,
      color: '#FBBF24'
    },
    {
      id: 'geo',
      label: 'GEO readiness hits target',
      desc: 'six gaps closed',
      from: '71 / 100', to: '90 / 100',
      delta: 4,
      color: '#F472B6'
    }
  ];

  const done = new Set();
  let currentHealth = BASE_HEALTH;
  let animating = false;

  // ── DOM refs
  const visual    = document.getElementById('htVisual');
  const body      = document.getElementById('htRightBody');
  const dots      = document.getElementById('htRightDots');
  const glow      = document.getElementById('htRightGlow');
  const topEdge   = document.getElementById('htRightTopEdge');
  const beacon    = document.getElementById('htRightBeacon');
  const beaconC   = document.getElementById('htRightBeaconCore');
  const label     = document.getElementById('htRightLabel');
  const count     = document.getElementById('htRightCount');
  const ghost     = document.getElementById('htRightGhost');
  const gapVal    = document.getElementById('htGapValue');
  const gapLabel  = document.getElementById('htGapLabel');
  const nowOut    = document.getElementById('htNow');
  const progress  = document.getElementById('htProgress');
  const wall      = document.getElementById('htWall');
  const resetBtn  = document.getElementById('htReset');

  // ── Color interpolation: red → amber → green (for the tower)
  const RED   = { r: 248, g: 113, b: 113 };
  const AMBER = { r: 251, g: 191, b: 36  };
  const GREEN = { r: 52,  g: 211, b: 153 };
  const lerp = (a, b, t) => Math.round(a + (b - a) * t);

  function towerColor(progressRatio){
    // progressRatio: 0 = health 25, 1 = health 54
    let c1, c2, t;
    if (progressRatio < 0.5) {
      c1 = RED; c2 = AMBER; t = progressRatio * 2;
    } else {
      c1 = AMBER; c2 = GREEN; t = (progressRatio - 0.5) * 2;
    }
    return `rgb(${lerp(c1.r, c2.r, t)}, ${lerp(c1.g, c2.g, t)}, ${lerp(c1.b, c2.b, t)})`;
  }

  // ── Render tower at a given health value
  function renderTower(health){
    const h = Math.max(10, (health / 100) * TOWER_MAX_H);
    const topY = TOWER_BASE_Y - h;

    const progressRatio = Math.max(0,
      Math.min(1, (health - BASE_HEALTH) / (TARGET_HEALTH - BASE_HEALTH))
    );
    const color = towerColor(progressRatio);

    body.setAttribute('y', topY);
    body.setAttribute('height', h);
    dots.setAttribute('y', topY);
    dots.setAttribute('height', h);
    glow.setAttribute('y', topY);
    glow.setAttribute('height', h);
    topEdge.setAttribute('y1', topY);
    topEdge.setAttribute('y2', topY);
    beacon.setAttribute('cy', topY - 8);
    beaconC.setAttribute('cy', topY - 8);
    label.setAttribute('y', topY - 20);

    // Ghost outline — from target line down to current top
    const ghostTop = 340;
    const ghostHeight = Math.max(0, topY - ghostTop);
    ghost.setAttribute('y', ghostTop);
    ghost.setAttribute('height', ghostHeight);
    ghost.style.opacity = ghostHeight < 4 ? 0 : .35;

    // Apply color
    visual.style.setProperty('--tower-color', color);
    label.setAttribute('fill', color);
    count.setAttribute('fill', color);
    topEdge.setAttribute('stroke', color);
    body.setAttribute('stroke', color);
    beacon.setAttribute('fill', color);
    glow.setAttribute('fill', color);

    // Readouts
    nowOut.textContent = Math.round(health);
    count.textContent = Math.round(health) + ' / 100 health';

    const remaining = Math.max(0, Math.round(TARGET_HEALTH - health));
    gapVal.textContent = remaining;
    gapLabel.style.opacity = remaining === 0 ? 0 : 1;

    if (remaining === 0) {
      count.textContent = '54 / 100 · target reached';
    }
  }

  // ── Animate health to target
  function animateTo(targetHealth){
    if (animating) return;
    const start = currentHealth;
    const dur = 700;
    const t0 = performance.now();
    animating = true;
    function tick(now){
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      currentHealth = start + (targetHealth - start) * eased;
      renderTower(currentHealth);
      if (p < 1) requestAnimationFrame(tick);
      else { currentHealth = targetHealth; animating = false; }
    }
    requestAnimationFrame(tick);
  }

  // ── Render the brick wall
  function renderBricks(){
    wall.innerHTML = '';
    TASKS.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'ht-brick';
      el.dataset.id = t.id;
      el.style.setProperty('--brick-color', t.color);
      el.innerHTML = `
        <div class="ht-brick-top">
          <span class="ht-brick-num">0${i + 1}</span>
          <span class="ht-brick-check">✓</span>
        </div>
        <div class="ht-brick-title">${t.label}</div>
        <div class="ht-brick-foot">
          <span class="ht-brick-desc">${t.desc}</span>
          <span class="ht-brick-delta">+${t.delta}</span>
        </div>`;
      el.addEventListener('click', () => toggle(t.id));
      wall.appendChild(el);
    });
  }

  // ── Toggle a brick
  function toggle(id){
    const t = TASKS.find(x => x.id === id);
    if (!t) return;

    if (done.has(id)) done.delete(id);
    else               done.add(id);

    const el = wall.querySelector(`.ht-brick[data-id="${id}"]`);
    if (el) {
      // re-trigger the lock animation on placement
      el.classList.remove('done');
      if (done.has(id)) {
        void el.offsetWidth;      // force reflow
        el.classList.add('done');
      }
    }

    // Compute new target health
    let target = BASE_HEALTH;
    TASKS.forEach(x => { if (done.has(x.id)) target += x.delta; });
    target = Math.min(target, TARGET_HEALTH);

    animateTo(target);

    // Progress line
    progress.innerHTML = `<b>${done.size}</b> of ${TASKS.length} bricks placed` +
      (done.size === TASKS.length ? ' — <b>target reached</b>' : '');
  }

  // ── Reset
  resetBtn.addEventListener('click', () => {
    done.clear();
    wall.querySelectorAll('.ht-brick').forEach(el => el.classList.remove('done'));
    progress.innerHTML = `<b>0</b> of ${TASKS.length} bricks placed`;
    animateTo(BASE_HEALTH);
  });

  // ── Init
  renderBricks();
  renderTower(BASE_HEALTH);
  progress.innerHTML = `<b>0</b> of ${TASKS.length} bricks placed`;
})();
</script>
</body>
</html>
