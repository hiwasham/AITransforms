<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayan · Conversion-First Trial</title>
<style>
  :root{
    --ink:#04060a;--ink2:#080b11;--panel:#0d1218;--panel2:#131a22;
    --line:#1a222e;--txt:#e9eef6;--mut:#78849a;--mut2:#4d5666;
    --gold:245,190,60;--cyan:34,211,238;--emerald:52,211,153;
    --violet:167,139,250;--amber:255,138,61;--rose:244,63,94;
    --slate:148,163,184;
    --accent:52,211,153;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--txt);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;line-height:1.5}

  /* ambient */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg::before{content:"";position:absolute;inset:-30%;
    background:
      radial-gradient(40% 32% at 12% 6%, rgba(var(--accent),.09), transparent 60%),
      radial-gradient(38% 32% at 90% 84%, rgba(245,190,60,.06), transparent 62%);
    transition:background 1.1s ease;filter:blur(30px)}
  .bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(78% 62% at 50% 38%,#000 20%,transparent 100%)}

  .app{position:relative;z-index:1;display:grid;
    grid-template-columns:268px 1fr;height:100vh}

  /* ============ LEFT RAIL ============ */
  .rail{border-right:1px solid var(--line);
    background:linear-gradient(180deg,rgba(13,18,24,.94),rgba(8,12,17,.94));
    backdrop-filter:blur(14px);display:flex;flex-direction:column;
    padding:18px 12px 14px;gap:14px;min-height:0}

  .brand{display:flex;align-items:center;gap:11px;
    padding:2px 6px 14px;border-bottom:1px solid var(--line)}
  .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    font:700 10px/1 var(--mono);color:#06090d;letter-spacing:.03em;
    background:linear-gradient(140deg,rgb(var(--accent)),rgba(var(--accent),.5));
    box-shadow:0 0 26px -4px rgba(var(--accent),.75);
    transition:background .7s ease,box-shadow .7s ease;
    text-align:center;padding:4px}
  .brand-name{font-size:12.5px;font-weight:650;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{font:400 9px/1.35 var(--mono);color:var(--mut2);
    letter-spacing:.11em;text-transform:uppercase;margin-top:2px}

  .rail-label{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--mut2);padding:0 8px;margin-bottom:2px}

  .view-switch{display:flex;flex-direction:column;gap:3px}
  .view-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:9px;color:var(--mut);transition:.2s;
    font:500 11.5px/1 var(--sans);letter-spacing:.005em}
  .view-btn:hover{background:rgba(255,255,255,.04);color:#c3ccdc}
  .view-btn.on{background:rgba(var(--accent),.1);color:var(--txt);
    box-shadow:inset 2px 0 0 rgb(var(--accent))}
  .view-btn .vi{width:20px;height:20px;border-radius:6px;flex:0 0 20px;
    display:grid;place-items:center;font:600 10px/1 var(--mono);
    background:rgba(255,255,255,.05);color:var(--mut2)}
  .view-btn.on .vi{background:rgba(var(--accent),.2);color:rgb(var(--accent))}

  .sub-list{display:flex;flex-direction:column;gap:3px;overflow-y:auto;
    flex:1;min-height:0;padding-right:2px}
  .sub-list::-webkit-scrollbar{width:4px}
  .sub-list::-webkit-scrollbar-thumb{background:#222a36;border-radius:9px}

  .sub-link{all:unset;cursor:pointer;position:relative;
    display:flex;align-items:center;gap:10px;
    padding:8px 10px 8px 12px;border-radius:8px;
    transition:background .18s,color .18s;color:var(--mut)}
  .sub-link:hover{background:rgba(255,255,255,.035);color:#c3ccdc}
  .sub-link.on{background:rgba(var(--sc),.1);color:var(--txt)}
  .sub-link.on::before{content:"";position:absolute;left:0;top:50%;
    translate:0 -50%;width:3px;height:16px;border-radius:9px;
    background:rgb(var(--sc));box-shadow:0 0 12px 0 rgba(var(--sc),.9)}
  .sub-link .sn{flex:0 0 22px;width:22px;height:22px;border-radius:6px;
    display:grid;place-items:center;font:700 10px/1 var(--mono);
    background:rgba(var(--sc),.13);color:rgb(var(--sc));
    border:1px solid rgba(var(--sc),.28)}
  .sub-link .st{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .sub-link .st-name{font-size:11px;font-weight:560;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub-link .st-sub{font:400 8.5px/1.3 var(--mono);color:var(--mut2);
    letter-spacing:.04em}

  .rail-foot{border-top:1px solid var(--line);padding-top:12px;
    display:flex;flex-direction:column;gap:10px}

  .confirm-counter{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-radius:10px;background:rgba(var(--amber),.07);
    border:1px dashed rgba(var(--amber),.35);transition:.3s}
  .confirm-counter:hover{background:rgba(var(--amber),.11)}
  .confirm-counter .cc-ico{width:22px;height:22px;flex:0 0 22px;border-radius:6px;
    display:grid;place-items:center;font-size:11px;
    background:rgba(var(--amber),.16);color:rgb(var(--amber))}
  .confirm-counter .cc-body{flex:1;min-width:0}
  .confirm-counter .cc-n{font:700 13px/1 var(--mono);
    color:rgb(var(--amber));letter-spacing:-.02em}
  .confirm-counter .cc-l{font:500 9px/1.3 var(--mono);
    letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);
    margin-top:3px}

  .btn-demo{all:unset;cursor:pointer;text-align:center;
    font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
    padding:10px 12px;border-radius:9px;color:rgb(var(--accent));
    background:rgba(var(--accent),.10);border:1px solid rgba(var(--accent),.3);
    transition:.2s}
  .btn-demo:hover{background:rgba(var(--accent),.18)}
  .btn-demo.playing{color:#0a0e13;background:rgb(var(--accent))}

  /* ============ MAIN ============ */
  .canvas{display:flex;flex-direction:column;min-width:0;min-height:0}

  .topbar{display:flex;align-items:center;gap:14px;
    padding:14px 26px;border-bottom:1px solid var(--line);
    background:rgba(8,12,17,.55);backdrop-filter:blur(10px);flex-wrap:wrap}
  .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:11px;
    font:500 12px/1.3 var(--mono);color:var(--mut);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb b{color:#dfe7f4;font-weight:600}
  .crumb .sep{color:var(--mut2)}
  .crumb .pill{font:600 10px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;padding:5px 9px;border-radius:7px;
    background:rgba(var(--accent),.12);color:rgb(var(--accent));
    border:1px solid rgba(var(--accent),.28)}

  .top-badges{display:flex;gap:7px;flex-wrap:wrap}
  .tb{font:600 9.5px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;padding:6px 9px;border-radius:6px;
    border:1px solid var(--line);color:var(--mut);
    background:rgba(255,255,255,.025)}
  .tb.hot{color:rgb(var(--rose));border-color:rgba(var(--rose),.3);
    background:rgba(var(--rose),.08)}
  .tb.warn{color:rgb(var(--amber));border-color:rgba(var(--amber),.3);
    background:rgba(var(--amber),.08)}
  .tb.good{color:rgb(var(--emerald));border-color:rgba(var(--emerald),.3);
    background:rgba(var(--emerald),.08)}

  .stage{flex:1;min-height:0;overflow-y:auto;padding:26px 26px 40px;
    display:flex;flex-direction:column;gap:18px}
  .stage::-webkit-scrollbar{width:9px}
  .stage::-webkit-scrollbar-thumb{background:#1d2531;border-radius:9px}
  .stage::-webkit-scrollbar-thumb:hover{background:#28323f}

  /* hero cards */
  .hero{border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:26px 28px;position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
  .hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--accent)),rgba(var(--accent),.15))}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}}
  .hero .h-k{font:600 10px/1 var(--mono);letter-spacing:.15em;
    text-transform:uppercase;color:rgb(var(--accent));margin-bottom:12px}
  .hero h1{font:700 28px/1.15 var(--sans);letter-spacing:-.03em;
    margin-bottom:12px;max-width:24ch}
  .hero p{font-size:13.5px;color:#a5b1c3;max-width:74ch;line-height:1.65}
  .hero p b{color:#dfe7f4;font-weight:600}
  .hero p em{font-style:normal;color:rgb(var(--accent));font-weight:600}
  .hero p code{font-family:var(--mono);font-size:11.5px;
    color:#cfd8e8;background:rgba(255,255,255,.05);
    padding:1.5px 6px;border-radius:5px}

  /* [confirm] chip */
  .cf{display:inline-flex;align-items:center;gap:4px;
    font:700 9px/1 var(--mono);letter-spacing:.08em;
    padding:3px 6px;border-radius:5px;
    background:rgba(var(--amber),.12);color:rgb(var(--amber));
    border:1px dashed rgba(var(--amber),.42);
    text-transform:uppercase;vertical-align:middle;
    transition:.2s}
  .cf::before{content:"?";font-size:9px;opacity:.8}
  .cf:hover{background:rgba(var(--amber),.18)}

  /* ============ view: reorder ============ */
  .reorder-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;
    align-items:stretch;margin-top:6px}
  .reorder-card{padding:22px 24px;border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:var(--d,0ms)}
  .reorder-card.before{border-color:rgba(var(--slate),.25);
    opacity:.75}
  .reorder-card.before::before{content:"";position:absolute;top:0;
    left:0;right:0;height:2px;
    background:linear-gradient(90deg,rgba(var(--slate),.6),transparent)}
  .reorder-card.after{border-color:rgba(var(--cyan),.4);
    box-shadow:0 20px 50px -30px rgba(var(--cyan),.7)}
  .reorder-card.after::before{content:"";position:absolute;top:0;
    left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--cyan)),rgb(var(--emerald)))}
  .reorder-tag{display:inline-flex;align-items:center;gap:8px;
    font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;padding:5px 9px;border-radius:6px;
    margin-bottom:16px}
  .reorder-card.before .reorder-tag{
    background:rgba(var(--slate),.14);color:rgb(var(--slate));
    border:1px solid rgba(var(--slate),.28)}
  .reorder-card.after .reorder-tag{
    background:rgba(var(--cyan),.14);color:rgb(var(--cyan));
    border:1px solid rgba(var(--cyan),.3)}
  .reorder-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .reorder-step{display:flex;align-items:flex-start;gap:11px;
    padding:10px 13px;border-radius:9px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
    font-size:12.5px;line-height:1.5;color:#b9c4d6;
    transition:.25s}
  .reorder-card.after .reorder-step{border-color:rgba(var(--cyan),.2)}
  .reorder-card.after .reorder-step:hover{
    border-color:rgba(var(--cyan),.45);
    background:rgba(var(--cyan),.04);transform:translateX(3px)}
  .reorder-step .rn{flex:0 0 20px;width:20px;height:20px;border-radius:6px;
    display:grid;place-items:center;font:700 10px/1 var(--mono);
    background:rgba(255,255,255,.05);color:var(--mut2);
    margin-top:1px}
  .reorder-card.after .reorder-step .rn{
    background:rgba(var(--cyan),.16);color:rgb(var(--cyan))}
  .reorder-step .rt b{color:#dfe7f4;font-weight:600}

  .reorder-arrow{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:0 4px;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:.2s}
  .reorder-arrow .ra{
    font-size:26px;color:rgb(var(--cyan));
    animation:arrowSlide 2.4s ease-in-out infinite}
  @keyframes arrowSlide{
    0%,100%{transform:translateX(-3px);opacity:.6}
    50%{transform:translateX(3px);opacity:1}}
  .reorder-arrow .rl{font:600 9px/1.3 var(--mono);
    letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);
    text-align:center}

  /* why-order */
  .why-block{margin-top:22px;padding:20px 24px;border-radius:14px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(var(--cyan),.03),rgba(13,18,24,.6));
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:.3s}
  .why-block .wk{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:rgb(var(--cyan));margin-bottom:14px}
  .why-list{display:flex;flex-direction:column;gap:11px}
  .why-item{display:flex;align-items:flex-start;gap:12px;
    font-size:13px;line-height:1.6;color:#b9c4d6}
  .why-item .wi{flex:0 0 18px;width:18px;height:18px;border-radius:6px;
    display:grid;place-items:center;font-size:10px;
    background:rgba(var(--cyan),.14);color:rgb(var(--cyan));
    margin-top:2px}
  .why-item b{color:#dfe7f4;font-weight:600}
  .why-item em{font-style:normal;color:rgb(var(--cyan));font-weight:600}

  /* ============ view: cohort ============ */
  .bucket-grid{display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:14px;margin-top:6px}
  .bucket{padding:22px 22px 20px;border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:var(--d,0ms);
    transition:.3s}
  .bucket:hover{transform:translateY(-3px);
    border-color:rgba(var(--bc),.5);
    box-shadow:0 22px 50px -28px rgba(var(--bc),.9)}
  .bucket::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--bc)),rgba(var(--bc),.15))}
  .bucket.b-g{--bc:var(--slate)}
  .bucket.b-f{--bc:var(--cyan)}
  .bucket.b-a{--bc:var(--emerald)}
  .bucket.b-u{--bc:var(--amber)}

  .bucket-letter{
    width:44px;height:44px;border-radius:12px;
    display:grid;place-items:center;
    font:700 20px/1 var(--sans);letter-spacing:-.03em;
    background:rgba(var(--bc),.14);color:rgb(var(--bc));
    border:1px solid rgba(var(--bc),.32);
    box-shadow:0 0 24px -10px rgba(var(--bc),.9);
    margin-bottom:16px}
  .bucket-name{font:650 15px/1.3 var(--sans);color:#eef3fb;
    letter-spacing:-.01em;margin-bottom:8px}
  .bucket-desc{font-size:12.5px;line-height:1.6;color:#a5b1c3;
    margin-bottom:14px;min-height:60px}
  .bucket-count{display:flex;align-items:baseline;gap:8px;
    margin-bottom:12px}
  .bucket-count .cn{font:700 34px/1 var(--sans);letter-spacing:-.045em;
    color:rgb(var(--bc));font-variant-numeric:tabular-nums}
  .bucket-count .cn.unknown{color:rgba(var(--bc),.55)}
  .bucket-count .cu{font:600 11px/1 var(--mono);color:var(--mut2);
    letter-spacing:.05em}
  .bucket-role{
    padding-top:12px;border-top:1px dashed #232c39;
    font:500 10.5px/1.5 var(--mono);color:var(--mut);
    letter-spacing:.02em}
  .bucket-role b{color:rgb(var(--bc));font-weight:600}

  .reconcile-block{margin-top:18px;padding:22px 26px;border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(var(--emerald),.04),rgba(13,18,24,.6));
    position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:.3s}
  .reconcile-block::before{content:"";position:absolute;top:0;left:0;right:0;
    height:2px;
    background:linear-gradient(90deg,rgb(var(--emerald)),rgba(var(--emerald),.15))}
  .reconcile-formula{
    font:700 17px/1.6 var(--mono);color:#dfe7f4;
    letter-spacing:.02em;padding:18px 20px;border-radius:11px;
    background:rgba(8,12,17,.6);border:1px solid rgba(var(--emerald),.25);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:14px}
  .reconcile-formula .tok{padding:5px 11px;border-radius:7px;
    background:rgba(var(--emerald),.12);color:rgb(var(--emerald));
    border:1px solid rgba(var(--emerald),.28);
    font-size:14px}
  .reconcile-formula .op{color:var(--mut2);font-size:16px}
  .reconcile-formula .eq{color:rgb(var(--emerald));font-size:20px}
  .reconcile-formula .tot{padding:5px 14px;border-radius:7px;
    background:rgb(var(--emerald));color:var(--ink);
    font-size:14px;box-shadow:0 0 22px -6px rgba(var(--emerald),.9)}
  .reconcile-note{margin-top:14px;font-size:12.5px;line-height:1.65;
    color:#a5b1c3}
  .reconcile-note b{color:#dfe7f4;font-weight:600}
  .reconcile-note em{font-style:normal;color:rgb(var(--emerald));font-weight:600}

  /* ============ view: weeks ============ */
  .week-stack{display:flex;flex-direction:column;gap:0}
  .week-block{display:grid;grid-template-columns:64px 1fr;gap:20px;
    align-items:flex-start;position:relative;padding-bottom:6px}
  .week-rail{display:flex;flex-direction:column;align-items:center;height:100%}
  .week-node{
    width:52px;height:52px;border-radius:15px;flex:0 0 52px;
    display:grid;place-items:center;position:relative;
    font:700 16px/1 var(--mono);
    background:rgba(var(--wc),.14);color:rgb(var(--wc));
    border:2px solid rgba(var(--wc),.35);
    box-shadow:0 0 30px -12px rgba(var(--wc),.9),
               inset 0 0 20px -12px rgba(var(--wc),.5);
    z-index:2}
  .week-flow{flex:1;width:2px;position:relative;margin-top:6px;
    background:linear-gradient(180deg,rgba(var(--wc),.4),rgba(var(--wc),.05));
    min-height:44px;overflow:hidden}
  .week-flow .dot{position:absolute;left:50%;translate:-50% 0;
    width:8px;height:8px;border-radius:50%;
    background:rgb(var(--wc));
    box-shadow:0 0 14px 2px rgba(var(--wc),.9);
    animation:drop 2.6s cubic-bezier(.45,.05,.55,.95) infinite}
  @keyframes drop{
    0%{top:-8px;opacity:0}
    15%{opacity:1}
    85%{opacity:1}
    100%{top:100%;opacity:0}}
  .week-block:last-child .week-flow{display:none}

  .week-card{border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:20px 22px 20px;margin-bottom:14px;
    position:relative;overflow:hidden;
    transition:border-color .3s}
  .week-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,rgb(var(--wc)),rgba(var(--wc),.1))}
  .week-card:hover{border-color:rgba(var(--wc),.42)}
  .week-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .week-meta{flex:1;min-width:0}
  .week-kicker{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:rgb(var(--wc));margin-bottom:7px}
  .week-title{font:650 18px/1.25 var(--sans);letter-spacing:-.015em;
    color:#eef3fb;margin-bottom:8px}
  .week-desc{font-size:13px;line-height:1.65;color:#a5b1c3;max-width:74ch}
  .week-desc b{color:#cfd8e8;font-weight:600}
  .week-when{flex:0 0 auto;
    font:600 10px/1.3 var(--mono);letter-spacing:.05em;
    padding:6px 10px;border-radius:6px;
    background:rgba(var(--wc),.1);color:rgb(var(--wc));
    border:1px solid rgba(var(--wc),.28);white-space:nowrap}

  .week-deliverables{display:flex;flex-direction:column;gap:8px;
    margin-top:14px}
  .deliv{display:flex;align-items:flex-start;gap:11px;
    padding:11px 13px;border-radius:9px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);

  .week-foot{margin-top:14px;padding-top:12px;
    border-top:1px dashed #232c39;
    display:flex;gap:18px;flex-wrap:wrap;
    font:500 10.5px/1.5 var(--mono);color:var(--mut);
    letter-spacing:.02em}
  .week-foot .wf-k{color:var(--mut2);letter-spacing:.11em;
    text-transform:uppercase;font-size:9.5px;flex:0 0 auto}
  .week-foot .wf-v{color:#cfd8e8}
  .week-foot .wf-v em{font-style:normal;color:rgb(var(--wc));font-weight:600}

  /* ============ view: ladder ============ */
  .ladder-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:14px;margin-top:6px}
  .rung{padding:24px 22px;border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:var(--d,0ms);
    transition:.3s}
  .rung:hover{transform:translateY(-3px);
    border-color:rgba(var(--rc),.55);
    box-shadow:0 24px 55px -30px rgba(var(--rc),.95)}
  .rung::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--rc)),rgba(var(--rc),.15))}
  .rung.m1{--rc:var(--cyan)}
  .rung.m2{--rc:var(--violet)}
  .rung.m3{--rc:var(--gold)}

  .rung-tag{display:inline-flex;align-items:center;gap:8px;
    font:700 10px/1 var(--mono);letter-spacing:.12em;
    text-transform:uppercase;padding:5px 9px;border-radius:6px;
    background:rgba(var(--rc),.14);color:rgb(var(--rc));
    border:1px solid rgba(var(--rc),.3);margin-bottom:14px}
  .rung-rate{font:700 48px/1 var(--sans);letter-spacing:-.045em;
    color:rgb(var(--rc));font-variant-numeric:tabular-nums;
    margin-bottom:6px}
  .rung-rate small{font-size:16px;color:var(--mut2);font-weight:600;
    margin-left:4px}
  .rung-cum{font:500 11px/1.4 var(--mono);color:var(--mut2);
    letter-spacing:.04em;margin-bottom:16px;text-transform:lowercase}
  .rung-formula{
    padding:12px 14px;border-radius:9px;
    background:rgba(8,12,17,.6);border:1px solid var(--line);
    font:500 10.5px/1.55 var(--mono);color:#93a1b8;
    letter-spacing:.02em;word-break:break-word;margin-bottom:14px;
    min-height:76px}
  .rung-formula em{color:rgb(var(--rc));font-style:normal;font-weight:600}
  .rung-why{font-size:12px;line-height:1.6;color:#a5b1c3;
    padding-top:12px;border-top:1px dashed #232c39}
  .rung-why b{color:#dfe7f4;font-weight:600}

  .examples-block{margin-top:6px;padding:22px 26px;border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:.25s}
  .examples-block .ek{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:rgb(var(--gold));margin-bottom:14px}
  table.examples{width:100%;border-collapse:separate;border-spacing:0;
    font:500 12px/1.4 var(--sans)}
  table.examples th,table.examples td{padding:11px 14px;
    border-bottom:1px solid var(--line);text-align:left}
  table.examples thead th{
    font:600 9.5px/1 var(--mono);letter-spacing:.09em;
    text-transform:uppercase;color:var(--mut);
    background:rgba(255,255,255,.02)}
  table.examples tbody td{color:#b9c4d6}
  table.examples tbody td.num{
    font-family:var(--mono);font-variant-numeric:tabular-nums;
    color:#dfe7f4;text-align:center}
  table.examples tbody td.num.cyan{color:rgb(var(--cyan))}
  table.examples tbody td.num.violet{color:rgb(var(--violet))}
  table.examples tbody td.num.gold{color:rgb(var(--gold))}
  table.examples tbody tr:hover td{background:rgba(255,255,255,.015)}
  table.examples tbody tr:last-child td{border-bottom:none}

  .why-not-8{margin-top:18px;padding:18px 22px;border-radius:14px;
    border:1px solid rgba(var(--amber),.28);
    background:rgba(var(--amber),.05);
    display:flex;align-items:flex-start;gap:14px;
    font-size:12.5px;line-height:1.65;color:#d8d0bd}
  .why-not-8 .ic{flex:0 0 26px;width:26px;height:26px;border-radius:8px;
    display:grid;place-items:center;font-size:13px;
    background:rgba(var(--amber),.16);color:rgb(var(--amber))}
  .why-not-8 b{color:#fff;font-weight:600}
  .why-not-8 em{font-style:normal;color:rgb(var(--amber));font-weight:600}
  .why-not-8 code{font-family:var(--mono);font-size:11.5px;
    color:#cfd8e8;background:rgba(255,255,255,.05);
    padding:1.5px 6px;border-radius:5px}
  .why-not-8 a{color:rgb(var(--amber));text-decoration:none;
    border-bottom:1px dotted rgba(var(--amber),.5)}

  /* ============ view: confirm ============ */
  .confirm-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .confirm-item{
    padding:16px 20px;border-radius:12px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);
    display:flex;gap:14px;align-items:flex-start;
    cursor:pointer;transition:.25s;
    animation:fadeUp .45s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:var(--d,0ms)}
  .confirm-item:hover{border-color:rgba(var(--amber),.45);
    background:rgba(var(--amber),.03);transform:translateX(3px)}
  .confirm-item.resolved{opacity:.4}
  .confirm-item.resolved .ci-name{text-decoration:line-through;
    text-decoration-color:rgba(var(--emerald),.5);
    color:var(--mut2)}
  .confirm-num{
    flex:0 0 32px;width:32px;height:32px;border-radius:9px;
    display:grid;place-items:center;font:700 11px/1 var(--mono);
    background:rgba(var(--amber),.14);color:rgb(var(--amber));
    border:1px solid rgba(var(--amber),.3);
    transition:.25s}
  .confirm-item.resolved .confirm-num{
    background:rgb(var(--emerald));color:var(--ink);
    border-color:rgb(var(--emerald))}
  .confirm-item.resolved .confirm-num::after{content:"✓"}
  .confirm-item.resolved .confirm-num span{display:none}
  .confirm-body{flex:1;min-width:0}
  .confirm-name{font:650 13.5px/1.35 var(--sans);
    letter-spacing:-.005em;color:#eef3fb;margin-bottom:6px}
  .confirm-detail{font-size:12px;line-height:1.55;color:#a5b1c3}
  .confirm-detail b{color:#cfd8e8;font-weight:600}
  .confirm-detail em{font-style:normal;color:rgb(var(--amber));font-weight:600}
  .confirm-check{flex:0 0 20px;width:20px;height:20px;border-radius:6px;
    border:1.5px solid rgba(var(--amber),.4);margin-top:6px;
    transition:.25s}
  .confirm-item.resolved .confirm-check{
    background:rgb(var(--emerald));border-color:rgb(var(--emerald))}

  .sources-block{margin-top:22px;padding:22px 26px;border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:.3s}
  .sources-block .sk{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:rgb(var(--rose));margin-bottom:14px}
  .source-list{display:flex;flex-direction:column;gap:10px}
  .source-item{display:flex;gap:12px;align-items:flex-start;
    padding:11px 14px;border-radius:9px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
    font-size:12px;line-height:1.55;color:#b9c4d6;transition:.2s}
  .source-item:hover{border-color:rgba(var(--rose),.35)}
  .source-item .si{flex:0 0 18px;width:18px;height:18px;border-radius:5px;
    display:grid;place-items:center;font-size:10px;
    background:rgba(var(--rose),.13);color:rgb(var(--rose));
    margin-top:1px}
  .source-item b{color:#dfe7f4;font-weight:600}
  .source-item code{font-family:var(--mono);font-size:11px;
    color:#cfd8e8;background:rgba(255,255,255,.05);
    padding:1px 5px;border-radius:4px}

  /* ============ view: budget ============ */
  .budget-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;
    margin-top:6px}
  .budget-card{padding:24px 24px 22px;border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:var(--d,0ms);
    transition:.3s}
  .budget-card:hover{transform:translateY(-3px)}
  .budget-card.a{--bc:var(--emerald)}
  .budget-card.b{--bc:var(--rose);border-color:rgba(var(--rose),.28)}
  .budget-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--bc)),rgba(var(--bc),.15))}
  .budget-tag{display:inline-flex;align-items:center;gap:8px;
    font:700 10px/1 var(--mono);letter-spacing:.13em;
    text-transform:uppercase;padding:5px 9px;border-radius:6px;
    background:rgba(var(--bc),.14);color:rgb(var(--bc));
    border:1px solid rgba(var(--bc),.3);margin-bottom:14px}
  .budget-card h3{font:650 17px/1.25 var(--sans);letter-spacing:-.015em;
    color:#eef3fb;margin-bottom:8px}
  .budget-status{
    display:inline-flex;align-items:center;gap:6px;
    font:600 9.5px/1 var(--mono);letter-spacing:.1em;
    text-transform:uppercase;padding:4px 8px;border-radius:5px;
    margin-bottom:14px}
  .budget-card.a .budget-status{
    background:rgba(var(--emerald),.13);color:rgb(var(--emerald));
    border:1px solid rgba(var(--emerald),.3)}
  .budget-card.b .budget-status{
    background:rgba(var(--rose),.13);color:rgb(var(--rose));
    border:1px solid rgba(var(--rose),.3)}
  .budget-status .d{width:6px;height:6px;border-radius:50%;
    background:currentColor;box-shadow:0 0 8px 0 currentColor}
  .budget-status.recommended{background:rgb(var(--emerald));color:var(--ink)}
  .budget-table{margin-top:14px;display:flex;flex-direction:column;gap:1px;
    border-radius:9px;overflow:hidden;
    background:var(--line);border:1px solid var(--line)}
  .budget-row{display:grid;grid-template-columns:1.4fr 1fr;gap:1px;
    background:var(--line)}
  .budget-row > div{padding:10px 13px;background:var(--panel);
    font:500 11.5px/1.5 var(--sans);color:#b9c4d6}
  .budget-row .br-l{font-weight:500;color:#dfe7f4}
  .budget-row .br-v{font-family:var(--mono);font-size:11px;
    text-align:right;color:#cfd8e8}
  .budget-row .br-v .cf{margin-left:4px}
  .budget-row.head > div{
    background:rgba(255,255,255,.025);
    font:600 9.5px/1 var(--mono);letter-spacing:.1em;
    text-transform:uppercase;color:var(--mut2)}

  .cac-block{margin-top:22px;padding:22px 26px;border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:.3s}
  .cac-block .ck{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:rgb(var(--cyan));margin-bottom:14px}
  .cac-list{display:flex;flex-direction:column;gap:11px}
  .cac-item{display:flex;flex-direction:column;gap:5px;
    padding:12px 15px;border-radius:10px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
    transition:.2s}
  .cac-item:hover{border-color:rgba(var(--cyan),.35)}
  .cac-item .ci{font:600 10px/1.3 var(--mono);
    letter-spacing:.08em;text-transform:uppercase;
    color:rgb(var(--cyan))}
  .cac-item .cf2{font:500 11px/1.55 var(--mono);color:#93a1b8;
    letter-spacing:.02em;word-break:break-word}
  .cac-item .cf2 em{color:#dfe7f4;font-style:normal;font-weight:600}
  .cac-item .cf2 code{font-family:var(--mono);color:rgb(var(--cyan));
    background:rgba(var(--cyan),.08);padding:1px 5px;border-radius:4px;
    font-size:10.5px}

  /* ============ statusbar ============ */
  .statusbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:10px 26px;border-top:1px solid var(--line);
    background:rgba(8,12,17,.6);
    font:400 10.5px/1 var(--mono);color:var(--mut2);letter-spacing:.03em}
  .statusbar b{color:var(--mut);font-weight:500}
  .statusbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;
    flex-wrap:wrap}
  .statusbar .chip{color:rgb(var(--accent));background:rgba(var(--accent),.1);
    padding:4px 7px;border-radius:5px;font-size:9.5px;letter-spacing:.05em}
  .statusbar .chip.hot{color:rgb(var(--rose));background:rgba(var(--rose),.1)}
  .statusbar .chip.warn{color:rgb(var(--amber));background:rgba(var(--amber),.1)}

  /* responsive */
  @media (max-width:1000px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .rail{flex-direction:column;border-right:none;
      border-bottom:1px solid var(--line);padding:12px 12px 0;gap:10px}
    .brand{padding-bottom:10px}
    .view-switch{flex-direction:row;overflow-x:auto;gap:5px;
      padding-bottom:6px}
    .view-btn{flex:0 0 auto;padding:8px 11px}
    .sub-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;
      padding-bottom:12px;gap:6px}
    .sub-link{flex:0 0 auto;padding:8px 11px}
    .sub-link.on::before{display:none}
    .rail-foot{display:none}
    .stage{padding:18px 16px 30px}
    .reorder-grid{grid-template-columns:1fr;gap:14px}
    .reorder-arrow{flex-direction:row;gap:14px;padding:8px 0}
    .reorder-arrow .ra{transform:rotate(90deg)}
    .budget-grid{grid-template-columns:1fr}
    .week-block{grid-template-columns:44px 1fr;gap:14px}
    .week-node{width:38px;height:38px;flex:0 0 38px;border-radius:11px;
      font-size:13px}
    .hero h1{font-size:22px}
    .topbar{padding:12px 16px}
    .statusbar{padding:10px 16px}
    .statusbar .right{margin-left:0}
  }

  /* scroll into view helper */
  .scroll-target{scroll-margin-top:80px}
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="app">

  <!-- ==================== LEFT RAIL ==================== -->
  <aside class="rail">
    <div class="brand">
      <div class="logo">C→F</div>
      <div>
        <div class="brand-name">Conversion-First Trial</div>
        <div class="brand-sub">30 days · draft v1</div>
      </div>
    </div>

    <div class="rail-label">Views</div>
    <div class="view-switch" id="viewSwitch">
      <button class="view-btn on" data-view="reorder">
        <span class="vi">⇄</span> Reorder
      </button>
      <button class="view-btn" data-view="cohort">
        <span class="vi">◧</span> Cohort math
      </button>
      <button class="view-btn" data-view="weeks">
        <span class="vi">▤</span> Four weeks
      </button>
      <button class="view-btn" data-view="ladder">
        <span class="vi">◈</span> Scenario ladder
      </button>
      <button class="view-btn" data-view="confirm">
        <span class="vi">?</span> Confirm list
      </button>
      <button class="view-btn" data-view="budget">
        <span class="vi">$</span> Budget
      </button>
    </div>

    <div class="rail-label" id="subLabel">Reorder</div>
    <div class="sub-list" id="subList"></div>

    <div class="rail-foot">
      <div class="confirm-counter" id="confirmCounter">
        <span class="cc-ico">?</span>
        <div class="cc-body">
          <div class="cc-n" id="confirmCount">0</div>
          <div class="cc-l">unconfirmed inputs</div>
        </div>
      </div>
      <button class="btn-demo" id="demoBtn">▶ run demo</button>
    </div>
  </aside>

  <!-- ==================== MAIN ==================== -->
  <main class="canvas">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="top-badges" id="topBadges"></div>
    </header>

    <section class="stage" id="stage"></section>

    <footer class="statusbar" id="statusbar"></footer>
  </main>

</div>

<script>
/* =========================================================
   DATA
   ========================================================= */

// -- cohort buckets (counts are [confirm] — we render "?" placeholders)
const BUCKETS = [
  { id:"g", letter:"G", color:"148,163,184",
    name:"Grandfathered",
    desc:"Legacy access whose terms may exempt users from current paid offers. Verify terms; do not revoke or pressure.",
    role:"Exclude from addressable denominator." },
  { id:"f", letter:"F", color:"34,211,238",
    name:"Free-country",
    desc:"Covered by a country-based free-access policy. Country list and policy must be confirmed first.",
    role:"Exclude unless policy change approved." },
  { id:"a", letter:"A", color:"52,211,153",
    name:"Addressable non-payers",
    desc:"Remaining non-paying accounts eligible for an existing paid offer and payment path, under approved rules.",
    role:"Main conversion cohort." },
  { id:"u", letter:"U", color:"255,138,61",
    name:"Unresolved",
    desc:"Missing, conflicting, or overlapping entitlement / country / payment evidence.",
    role:"Exclude until classified." }
];

// -- four weeks
const WEEKS = [
  {
    id:"w1", num:"1", color:"34,211,238",
    kicker:"Week 1 · establish who can convert",
    title:"Segment the base, prepare three paths",
    when:"Days 1–7",
    desc:"Reconcile the 1,300 accounts into G / F / A / U. Draft three <b>full-copy, unpublished</b> conversion landing pages mapped to existing site paths.",
    deliverables:[
      { n:"a", t:"Non-payer segmentation analysis — reconcile 1,300 into G / F / A / U; show counts, percentages, entitlement rules, source timestamp." },
      { n:"b", t:"Full draft — <b>Gulf Licensing Exam Preparation</b> (use this brand phrase; not bare \"Prometric\")." },
      { n:"c", t:"Full draft — <b>Nursing exam preparation</b> (/nursing path)." },
      { n:"d", t:"Full draft — <b>Postgraduate preparation</b> (/postgrad path)." }
    ],
    owner:"Nasim (analysis + copy) · CEO (segment eligibility + message direction)",
    done:"Denominator reconciles or unresolved amount is explicit. All three full page drafts have source-backed offers, no invented price or outcome claim, and remain unpublished."
  },
  {
    id:"w2", num:"2", color:"violet",
    kicker:"Week 2 · measure and locate friction",
    title:"Read-only baseline, experiment brief",
    when:"Days 8–14",
    desc:"Establish the funnel baseline by eligible segment. Document missing instrumentation. Produce a one-page experiment brief.",
    deliverables:[
      { n:"a", t:"Read-only funnel baseline by segment: eligible → page view → price view → checkout start → successful first payment." },
      { n:"b", t:"Measurement specification for missing events. Short checkout / offer review using existing routes." },
      { n:"c", t:"One-page experiment brief: primary change, control/holdout design, eligibility, exposure dates, primary metric, guardrails, stopping rule." }
    ],
    owner:"Data / payment owner (with Nasim) · CEO approves experiment brief",
    done:"Unique eligible users and unique first-time payers can be counted for a closed, matched period, or the precise instrumentation blocker is documented."
  },
  {
    id:"w3", num:"3", color:"167,139,250",
    kicker:"Week 3 · run one approved test",
    title:"Segment-specific offer on the highest-priority path",
    when:"Days 15–21",
    desc:"Draft-first, segment-specific presentation of the verified offer. One primary change. Not a traffic campaign.",
    deliverables:[
      { n:"a", t:"Draft-first segment-specific offer + CTA on the highest-priority landing path from Week 1." },
      { n:"b", t:"Limited test on the existing addressable base only if CEO approves copy, audience, dates, and any product/pricing change. Preserve a comparable holdout if assignment allows." },
      { n:"c", t:"Daily/weekly readout template: first purchases, conversion by segment, checkout completion, refunds, support issues." }
    ],
    owner:"Nasim runs; CEO approves exact treatment and audience; Data owner monitors",
    done:"Exact approved treatment is documented, the comparison cohort is preserved, and no grandfathered or free-country account receives a changed offer without explicit policy approval."
  },
  {
    id:"w4", num:"4", color:"52,211,153",
    kicker:"Week 4 · close the 30-day trial",
    title:"Results memo, economics sheet, CEO decision",
    when:"Days 22–30",
    desc:"Separate <b>measured outcome</b> from interpretation. Then ask the CEO: stop, revise, or continue.",
    deliverables:[
      { n:"a", t:"Results memo: baseline vs treatment/control, cohort sizes, paid conversions, revenue and refunds in same window, data coverage, confidence limits." },
      { n:"b", t:"Economics sheet: actual plan price, net receipts, gross margin / variable costs, Nasim's fee, tools, any approved media spend." },
      { n:"c", t:"CEO decision: stop, revise, or continue the conversion program. Next 30-day scope and budget only after numbers are read back." }
    ],
    owner:"Nasim drafts · CEO decides",
    done:"CEO has a concise decision pack and all next actions are either approved or remain draft-only."
  }
];

// -- scenario ladder
const LADDER = [
  {
    id:"m1", tag:"M1 · 30-day trial", color:"34,211,238",
    rate:"1.0", unit:"% cumulative",
    cum:"deliberately conservative first threshold",
    formula:"max(0, ceil(0.010 × A) − cumulative first-time payers since M0)",
    why:"A deliberately conservative first decision threshold, pending denominator cleanup, and below the broad 8% six-month software median. It is a hypothesis — not inferred from Bayan history. If a clean baseline is unavailable, M1 is instrumentation + observed result, not a claim of lift."

        <em style="color:rgb(var(--gold));font-style:normal">These examples
        must not be substituted for the missing segment counts.</em>
      </div>
    </div>

    <div class="why-not-8">
      <span class="ic">?</span>
      <div>
        <b>Why not set the target to the benchmark median?</b>
        ChartMogul/ProductLed's January 2026 report covers 200 software products and defines conversion as leads/free signups converting within six months. It reports an <em>8% median but also large dispersion</em>; this mixed-model cross-company median is not Bayan's appropriate causal target.
        The 1% / 2% / 3% values are therefore proposed <b>operating thresholds</b>, not purported benchmarks. They must be reset against the verified addressable-cohort baseline before any experiment.
        <a href="https://chartmogul.com/reports/saas-conversion-report/" target="_blank">chartmogul.com/reports/saas-conversion-report/</a>
      </div>
    </div>

    <div class="hero" style="animation-delay:.35s">
      <div class="h-k">Revenue scenarios · parameterized, not fabricated</div>
      <h1 style="font-size:22px">It is not responsible to turn conversion targets into a revenue forecast.</h1>
      <p>Verified price, purchase mix, discounts, refunds, and net contribution are absent. Let <code>P</code> = verified net revenue per new payer for the stated period (after refunds/discounts, excluding taxes). Let <code>A</code> = addressable non-payer count. Let <code>r</code> = cumulative first-time purchase rate. Then:</p>
      <div style="margin-top:14px;padding:16px 20px;border-radius:11px;
        background:rgba(8,12,17,.6);border:1px solid var(--line);
        font:600 14px/1.8 var(--mono);color:#dfe7f4">
        gross receipts <span style="color:var(--mut2)">=</span>
        <span style="color:rgb(var(--cyan))">A</span> ×
        <span style="color:rgb(var(--violet))">r</span> ×
        <span style="color:rgb(var(--gold))">P</span>
      </div>
      <p style="margin-top:14px;font-size:12.5px;color:var(--mut)">
        All terms except <code>r</code> remain <span class="cf">confirm</span>.
        Existing <code>$277</code> cannot be used as <code>P</code> without a
        matched buyer count and window.
      </p>
    </div>
  `;
}

    return `

           data-sub-target="${c.n}"
           style="--d:${i*30}ms">

          <div class="confirm-detail">${c.detail}</div>
        </div>
        <span class="confirm-check"></span>
      </div>`;
  }).join('');

  const sources = SOURCES.map(s => `
    <div class="source-item">
      <span class="si">${s.i}</span>
      <span>${s.t}</span>
    </div>`).join('');

  $('stage').innerHTML = `

      <h1>${CONFIRMS.length} inputs marked confirm must be reconciled first.</h1>
      <p>Every item below is currently unverified in the plan materials reviewed. Click any card to mark it resolved. The counter in the left rail drops as you work through them.</p>
    </div>

    <div class="confirm-list">${items}</div>

    <div class="sources-block" data-sub-target="sources">
      <div class="sk">Audit sources — what we do know</div>
      <div class="source-list">${sources}</div>
    </div>
  `;

  document.querySelectorAll('.confirm-item').forEach(el => {
    el.addEventListener('click', () => {
      stopDemo();
      const n = el.dataset.confirm;
      if (state.resolvedConfirms.has(n)){
        state.resolvedConfirms.delete(n);
      } else {
        state.resolvedConfirms.add(n);
      }
      renderConfirmCounter();
      // visual toggle only
      el.classList.toggle('resolved');
    });
  });
}

/* =========================================================
   VIEW SWITCH HANDLER
   ========================================================= */
$('viewSwitch').addEventListener('click', e => {
  const btn = e.target.closest('.view-btn');
  if (!btn) return;
  stopDemo();
  state.view = btn.dataset.view;
  $('stage').scrollTop = 0;
  renderAll();
});

/* =========================================================
   DEMO
   ========================================================= */
function startDemo(){
  stopDemo();
  state.demoPlaying = true;
  $('demoBtn').classList.add('playing');
  $('demoBtn').textContent = '■ stop demo';

  state.view = 'reorder';
  state.expandedWeek = 'w1';
  renderAll();

  // walk through views
  const views = ['reorder','cohort','weeks','ladder','confirm','budget'];
  let idx = 0;
  function step(){
    if (!state.demoPlaying) return;
    if (idx >= views.length){
      stopDemo();
      return;
    }
    state.view = views[idx];
    $('stage').scrollTop = 0;
    renderAll();
    idx++;
    state.demoTimeout = setTimeout(step, 3200);
  }
  step();
}

function stopDemo(){
  state.demoPlaying = false;
  if (state.demoTimeout) clearTimeout(state.demoTimeout);
  state.demoTimeout = null;
  const btn = $('demoBtn');
  if (btn){
    btn.classList.remove('playing');
    btn.textContent = '▶ run demo';
  }
}

$('demoBtn').addEventListener('click', () => {
  if (state.demoPlaying) stopDemo();
  else startDemo();
});

/* =========================================================
   KEYBOARD
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  const views = ['reorder','cohort','weeks','ladder','confirm','budget'];
  const i = views.indexOf(state.view);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){
    e.preventDefault();
    stopDemo();
    state.view = views[(i+1) % views.length];
    $('stage').scrollTop = 0;
    renderAll();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
    e.preventDefault();
    stopDemo();
    state.view = views[(i-1+views.length) % views.length];
    $('stage').scrollTop = 0;
    renderAll();
  }
});

/* =========================================================
   BOOT
   ========================================================= */
renderAll();
</script>
