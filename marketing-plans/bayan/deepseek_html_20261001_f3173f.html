<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayan · V1 Marketing Execution Plan</title>
<style>
  :root{
    --ink:#04070a;--ink2:#080c11;--panel:#0d1218;--panel2:#131a22;
    --line:#1a232e;--txt:#e9eef6;--mut:#78849a;--mut2:#4d5666;
    --gold:245,190,60;--cyan:34,211,238;--emerald:52,211,153;
    --violet:167,139,250;--amber:255,138,61;--rose:244,63,94;
    --accent:34,211,238;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--txt);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;line-height:1.5}

  /* ============ ambient ============ */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg::before{content:"";position:absolute;inset:-30%;
    background:
      radial-gradient(38% 32% at 10% 6%, rgba(var(--accent),.09), transparent 60%),
      radial-gradient(36% 32% at 92% 80%, rgba(245,190,60,.06), transparent 62%);
    transition:background 1.1s ease;filter:blur(30px)}
  .bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(78% 62% at 50% 38%,#000 20%,transparent 100%)}

  /* ============ grid ============ */
  .app{position:relative;z-index:1;display:grid;
    grid-template-columns:262px 1fr;height:100vh}

  /* ============ left rail ============ */
  .rail{border-right:1px solid var(--line);
    background:linear-gradient(180deg,rgba(13,18,24,.94),rgba(8,12,17,.94));
    backdrop-filter:blur(14px);display:flex;flex-direction:column;
    padding:18px 12px 14px;gap:14px;min-height:0}

  .brand{display:flex;align-items:center;gap:11px;
    padding:2px 6px 14px;border-bottom:1px solid var(--line)}
  .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
    font:700 11px/1 var(--mono);color:#06090d;letter-spacing:.02em;
    background:linear-gradient(140deg,rgb(var(--accent)),rgba(var(--accent),.5));
    box-shadow:0 0 24px -4px rgba(var(--accent),.75);
    transition:background .7s ease,box-shadow .7s ease}
  .brand-name{font-size:13px;font-weight:650;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{font:400 9px/1.35 var(--mono);color:var(--mut2);
    letter-spacing:.11em;text-transform:uppercase;margin-top:2px}

  .rail-label{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--mut2);padding:0 8px;margin-bottom:2px}

  .view-switch{display:flex;flex-direction:column;gap:3px}
  .view-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:9px 11px;border-radius:9px;color:var(--mut);transition:.2s;
    font:500 11.5px/1 var(--sans);letter-spacing:.01em}
  .view-btn:hover{background:rgba(255,255,255,.04);color:#c3ccdc}
  .view-btn.on{background:rgba(var(--accent),.1);color:var(--txt);
    box-shadow:inset 2px 0 0 rgb(var(--accent))}
  .view-btn .vi{width:20px;height:20px;border-radius:6px;flex:0 0 20px;
    display:grid;place-items:center;font:600 10px/1 var(--mono);
    background:rgba(255,255,255,.05);color:var(--mut2)}
  .view-btn.on .vi{background:rgba(var(--accent),.2);color:rgb(var(--accent))}

  .phase-list{display:flex;flex-direction:column;gap:3px;overflow-y:auto;
    flex:1;min-height:0;padding-right:2px}
  .phase-list::-webkit-scrollbar{width:4px}
  .phase-list::-webkit-scrollbar-thumb{background:#222a36;border-radius:9px}

  .phase-link{all:unset;cursor:pointer;position:relative;
    display:flex;align-items:center;gap:10px;
    padding:9px 10px 9px 12px;border-radius:9px;
    transition:background .18s,color .18s;color:var(--mut)}
  .phase-link:hover{background:rgba(255,255,255,.035);color:#c3ccdc}
  .phase-link.on{background:rgba(var(--pc),.1);color:var(--txt)}
  .phase-link.on::before{content:"";position:absolute;left:0;top:50%;
    translate:0 -50%;width:3px;height:18px;border-radius:9px;
    background:rgb(var(--pc));box-shadow:0 0 12px 0 rgba(var(--pc),.9)}
  .phase-link .pn{flex:0 0 24px;width:24px;height:24px;border-radius:7px;
    display:grid;place-items:center;font:700 10px/1 var(--mono);
    background:rgba(var(--pc),.14);color:rgb(var(--pc));
    border:1px solid rgba(var(--pc),.28);transition:.3s}
  .phase-link.done .pn{background:rgb(var(--pc));color:var(--ink);
    border-color:rgb(var(--pc))}
  .phase-link .pt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .phase-link .pt-name{font-size:11.5px;font-weight:560;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phase-link .pt-sub{font:400 9px/1.3 var(--mono);color:var(--mut2);
    letter-spacing:.04em}

  .rail-foot{border-top:1px solid var(--line);padding-top:12px;
    display:flex;flex-direction:column;gap:10px}
  .overall{display:flex;flex-direction:column;gap:7px;padding:0 8px}
  .overall-row{display:flex;justify-content:space-between;align-items:baseline}
  .overall-label{font:500 9.5px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--mut2)}
  .overall-val{font:700 15px/1 var(--mono);color:rgb(var(--accent));
    letter-spacing:-.02em}
  .overall-bar{height:4px;border-radius:99px;background:#171e28;overflow:hidden}
  .overall-fill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,rgba(var(--accent),.5),rgb(var(--accent)));
    box-shadow:0 0 12px -2px rgba(var(--accent),.9);
    transition:width .5s cubic-bezier(.22,.75,.3,1)}

  .btn-demo{all:unset;cursor:pointer;text-align:center;
    font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
    padding:10px 12px;border-radius:9px;color:rgb(var(--accent));
    background:rgba(var(--accent),.10);border:1px solid rgba(var(--accent),.3);
    transition:.2s}
  .btn-demo:hover{background:rgba(var(--accent),.18)}
  .btn-demo.playing{color:#0a0e13;background:rgb(var(--accent))}

  /* ============ main ============ */
  .canvas{display:flex;flex-direction:column;min-width:0;min-height:0}

  .topbar{display:flex;align-items:center;gap:14px;
    padding:14px 26px;border-bottom:1px solid var(--line);
    background:rgba(8,12,17,.55);backdrop-filter:blur(10px);flex-wrap:wrap}
  .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:11px;
    font:500 12px/1.3 var(--mono);color:var(--mut);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb b{color:#dfe7f4;font-weight:600}
  .crumb .sep{color:var(--mut2)}
  .crumb .pill{font:600 10px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;padding:5px 9px;border-radius:7px;
    background:rgba(var(--accent),.12);color:rgb(var(--accent));
    border:1px solid rgba(var(--accent),.28)}

  .top-badges{display:flex;gap:7px;flex-wrap:wrap}
  .tb{font:600 9.5px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;padding:6px 9px;border-radius:6px;
    border:1px solid var(--line);color:var(--mut);
    background:rgba(255,255,255,.025)}
  .tb.hot{color:rgb(var(--rose));border-color:rgba(var(--rose),.3);
    background:rgba(var(--rose),.08)}

  .stage{flex:1;min-height:0;overflow-y:auto;padding:26px 26px 40px;
    display:flex;flex-direction:column;gap:18px}
  .stage::-webkit-scrollbar{width:9px}
  .stage::-webkit-scrollbar-thumb{background:#1d2531;border-radius:9px}
  .stage::-webkit-scrollbar-thumb:hover{background:#28323f}

  /* ============ view: FLOW ============ */
  .plan-hero{border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:26px 28px;position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
  .plan-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--gold)),rgb(var(--cyan)),rgb(var(--emerald)),rgb(var(--violet)),rgb(var(--amber)))}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}}
  .plan-hero .ph-k{font:600 10px/1 var(--mono);letter-spacing:.15em;
    text-transform:uppercase;color:rgb(var(--accent));margin-bottom:12px}
  .plan-hero h1{font:700 28px/1.15 var(--sans);letter-spacing:-.03em;
    margin-bottom:10px}
  .plan-hero h1 small{font:500 13px/1.3 var(--mono);color:var(--mut2);
    letter-spacing:.03em;display:block;margin-top:10px;font-weight:400}
  .plan-hero p{font-size:13.5px;color:#a5b1c3;max-width:74ch;line-height:1.6}
  .plan-hero p b{color:#dfe7f4;font-weight:600}
  .plan-hero p em{font-style:normal;color:rgb(var(--accent));font-weight:600}

  .constraint{
    margin-top:18px;padding:14px 16px;border-radius:11px;
    border:1px solid rgba(var(--rose),.25);
    background:rgba(var(--rose),.05);
    display:flex;align-items:flex-start;gap:12px;
    font-size:12.5px;line-height:1.55;color:#d8c4c8}
  .constraint .ic{
    flex:0 0 22px;width:22px;height:22px;border-radius:7px;
    display:grid;place-items:center;font-size:11px;
    background:rgba(var(--rose),.14);color:#ff8a94}
  .constraint b{color:#fff;font-weight:600}

  /* phase stack */
  .phase-stack{display:flex;flex-direction:column;gap:0}
  .phase-block{
    display:grid;grid-template-columns:64px 1fr;gap:20px;
    align-items:flex-start;position:relative;
    padding-bottom:6px}

  .phase-rail{display:flex;flex-direction:column;align-items:center;height:100%}
  .phase-node{
    width:52px;height:52px;border-radius:15px;flex:0 0 52px;
    display:grid;place-items:center;position:relative;
    font:700 16px/1 var(--mono);
    background:rgba(var(--pc),.14);color:rgb(var(--pc));
    border:2px solid rgba(var(--pc),.35);
    box-shadow:0 0 30px -12px rgba(var(--pc),.9),inset 0 0 20px -12px rgba(var(--pc),.5);
    z-index:2;transition:all .3s}
  .phase-node::after{
    content:"";position:absolute;inset:-8px;border-radius:20px;
    border:1px solid rgba(var(--pc),.15);opacity:.6;
    animation:nodePulse 3s ease-in-out infinite}
  @keyframes nodePulse{
    0%,100%{transform:scale(1);opacity:.4}
    50%{transform:scale(1.06);opacity:.85}}
  .phase-block.completed .phase-node{background:rgb(var(--pc));color:var(--ink);
    border-color:rgb(var(--pc))}
  .phase-block.completed .phase-node::after{opacity:0}

  .phase-flow-line{
    flex:1;width:2px;position:relative;margin-top:6px;
    background:linear-gradient(180deg,rgba(var(--pc),.4),rgba(var(--pc),.05));
    min-height:44px;overflow:hidden}
  .phase-flow-line .dot{
    position:absolute;left:50%;translate:-50% 0;
    width:8px;height:8px;border-radius:50%;
    background:rgb(var(--pc));
    box-shadow:0 0 14px 2px rgba(var(--pc),.9);
    animation:drop 2.6s cubic-bezier(.45,.05,.55,.95) infinite}
  @keyframes drop{
    0%{top:-8px;opacity:0}
    15%{opacity:1}
    85%{opacity:1}
    100%{top:100%;opacity:0}}
  .phase-block:last-child .phase-flow-line{display:none}

  .phase-card{
    border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:18px 22px 20px;margin-bottom:14px;
    position:relative;overflow:hidden;
    transition:border-color .3s,transform .3s,box-shadow .3s;
    cursor:pointer}
  .phase-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,rgb(var(--pc)),rgba(var(--pc),.1))}
  .phase-card:hover{border-color:rgba(var(--pc),.4)}
  .phase-card.expanded{border-color:rgba(var(--pc),.5);
    box-shadow:0 22px 50px -30px rgba(var(--pc),.9)}

  .phase-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .phase-meta{flex:1;min-width:0}
  .phase-kicker{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:rgb(var(--pc));margin-bottom:6px}
  .phase-name{font:650 18px/1.25 var(--sans);letter-spacing:-.015em;
    color:#eef3fb;margin-bottom:6px}
  .phase-desc{font-size:13px;line-height:1.6;color:#a5b1c3;max-width:70ch}
  .phase-desc b{color:#cfd8e8;font-weight:600}
  .phase-desc code{font-family:var(--mono);font-size:11.5px;
    color:#cfd8e8;background:rgba(255,255,255,.05);
    padding:1.5px 6px;border-radius:5px}

  .phase-owner{display:flex;flex-direction:column;gap:5px;align-items:flex-end;
    flex:0 0 auto;min-width:140px}
  .owner-badge{font:600 9.5px/1 var(--mono);letter-spacing:.07em;
    text-transform:uppercase;padding:6px 9px;border-radius:6px;
    background:rgba(var(--pc),.12);color:rgb(var(--pc));
    border:1px solid rgba(var(--pc),.28);
    white-space:nowrap}
  .owner-sub{font:500 10px/1.3 var(--mono);color:var(--mut2);
    letter-spacing:.04em;text-align:right;text-transform:lowercase}

  .phase-tasks{
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .55s cubic-bezier(.2,.7,.3,1),
               opacity .35s .08s ease,margin .4s}
  .phase-card.expanded .phase-tasks{max-height:900px;opacity:1;
    margin-top:16px;padding-top:14px;border-top:1px dashed #232c39}

  .task{display:flex;gap:13px;padding:12px 0;
    border-top:1px solid rgba(255,255,255,.035);
    cursor:pointer;transition:.2s}
  .task:first-child{border-top:none;padding-top:0}
  .task:hover{background:rgba(255,255,255,.012)}
  .task .tk{
    flex:0 0 18px;width:18px;height:18px;border-radius:6px;
    border:1.5px solid rgba(var(--pc),.4);
    display:grid;place-items:center;margin-top:2px;
    transition:.25s}
  .task.done .tk{background:rgb(var(--pc));border-color:rgb(var(--pc))}
  .task.done .tk::after{content:"✓";font-size:10px;color:var(--ink);
    font-weight:800}
  .task .tb{flex:1;min-width:0}
  .task .tname{font-size:13px;line-height:1.5;color:#cfd8e8;transition:.2s}
  .task.done .tname{color:var(--mut2);
    text-decoration:line-through;
    text-decoration-color:rgba(var(--pc),.4)}
  .task .tmeta{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;
    font:400 10px/1.4 var(--mono);color:var(--mut2);letter-spacing:.03em}
  .task .tverify{font-size:11.5px;line-height:1.55;color:var(--mut);
    margin-top:7px;max-height:0;overflow:hidden;opacity:0;
    transition:max-height .35s,opacity .3s,margin .3s}
  .task.open .tverify{max-height:120px;opacity:1;margin-top:8px}
  .task .tverify .lbl{font:600 9px/1 var(--mono);letter-spacing:.1em;
    text-transform:uppercase;color:rgb(var(--pc));
    display:block;margin-bottom:4px}

  .phase-expand-hint{
    font:500 9.5px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--mut2);margin-top:14px;
    display:flex;align-items:center;gap:6px;transition:.2s}
  .phase-card.expanded .phase-expand-hint{color:rgb(var(--pc))}
  .phase-expand-hint .chev{transition:transform .3s;font-size:10px}
  .phase-card.expanded .phase-expand-hint .chev{transform:rotate(90deg)}

  /* ============ view: METRICS ============ */
  .metrics-hero{border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:24px 26px;position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
  .metrics-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--emerald)),rgb(var(--cyan)))}
  .metrics-hero .k{font:600 10px/1 var(--mono);letter-spacing:.15em;
    text-transform:uppercase;color:rgb(var(--emerald));margin-bottom:12px}
  .metrics-hero h2{font:700 26px/1.2 var(--sans);letter-spacing:-.025em;
    margin-bottom:10px}
  .metrics-hero p{font-size:13.5px;color:#a5b1c3;max-width:74ch;line-height:1.6}

  .metrics-grid{display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px;margin-top:6px}

  .metric-card{
    border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:22px 22px 20px;position:relative;overflow:hidden;
    transition:transform .3s,border-color .3s,box-shadow .3s;
    animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:var(--d,0ms)}
  .metric-card:hover{transform:translateY(-3px);
    border-color:rgba(var(--mc),.4);
    box-shadow:0 22px 50px -28px rgba(var(--mc),.8)}
  .metric-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,rgb(var(--mc)),rgba(var(--mc),.15))}

  .metric-kicker{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:rgb(var(--mc));margin-bottom:14px;
    display:flex;align-items:center;gap:8px}
  .metric-kicker::before{content:"";width:10px;height:2px;border-radius:2px;
    background:rgb(var(--mc))}

  .metric-title{font:650 14px/1.3 var(--sans);letter-spacing:-.005em;
    color:#e9eef6;margin-bottom:12px;min-height:38px}

  .metric-compare{display:flex;align-items:baseline;gap:12px;
    margin-bottom:14px;flex-wrap:wrap}
  .metric-from{font:700 22px/1 var(--sans);letter-spacing:-.03em;
    color:var(--mut);font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;gap:3px}
  .metric-from small{font-size:12px;font-weight:600}
  .metric-arrow{color:var(--mut2);font-size:14px}
  .metric-to{font:700 30px/1 var(--sans);letter-spacing:-.04em;
    color:rgb(var(--mc));font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;gap:3px}
  .metric-to small{font-size:14px;font-weight:600;color:var(--mut2)}

  .metric-bar{height:5px;border-radius:99px;background:#171e28;
    overflow:hidden;margin-bottom:14px;position:relative}
  .metric-bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,rgba(var(--mc),.4),rgb(var(--mc)));
    box-shadow:0 0 12px -2px rgba(var(--mc),.9);
    transition:width 1.2s cubic-bezier(.22,.75,.3,1)}

  .metric-proof{
    padding-top:12px;border-top:1px dashed #232c39;
    font:400 11px/1.55 var(--mono);color:var(--mut);
    letter-spacing:.02em;
    display:flex;align-items:flex-start;gap:9px}
  .metric-proof .pi{
    flex:0 0 20px;width:20px;height:20px;border-radius:6px;
    display:grid;place-items:center;font-size:10px;
    background:rgba(var(--mc),.14);color:rgb(var(--mc));
    margin-top:1px}
  .metric-proof b{color:#cfd8e8;font-weight:600}

  /* ============ view: ARTIFACTS ============ */
  .artifacts-hero{border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:24px 26px;position:relative;overflow:hidden;
    animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
  .artifacts-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--violet)),rgb(var(--amber)))}
  .artifacts-hero .k{font:600 10px/1 var(--mono);letter-spacing:.15em;
    text-transform:uppercase;color:rgb(var(--violet));margin-bottom:12px}
  .artifacts-hero h2{font:700 26px/1.2 var(--sans);letter-spacing:-.025em;
    margin-bottom:10px}
  .artifacts-hero p{font-size:13.5px;color:#a5b1c3;max-width:74ch;line-height:1.6}

  .artifacts-grid{display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:12px;margin-top:6px}

  .artifact-card{
    border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:18px 20px 16px;position:relative;overflow:hidden;
    transition:transform .3s,border-color .3s;
    animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:var(--d,0ms)}
  .artifact-card:hover{transform:translateY(-3px);
    border-color:rgba(var(--sc),.4)}

    desc:"No outcome guarantees, no fake scarcity, verified counts only. A botched public grandfathering message <b>is not reversible</b>." },
  { color:"167,139,250",
    title:"Assumption: 13-section plan is directionally approved.",
    desc:"This execution layer sequences it rather than re-litigating strategy." }
];

const CUTS = [
  { rank:"1", name:"§10 12-month outlook + §12 tactical idea bank",
    why:"Lowest leverage pre-traction." },
  { rank:"2", name:"Referral (§7)",
    why:"Needs a user base that doesn't exist yet." },
  { rank:"3", name:"Content Wave B (Days 31–60)",
    why:"Ship Prometric Wave A first; it targets the winnable keywords." },
  { rank:"4", name:"Mid-tier SKU (Phase 3.2)",
    why:"Reversible PayPal config, can follow first data." },
  { rank:"KEEP", name:"Phase 0 (measurement) and Phase 1 (GEO fixes + LCP)",
    why:"The whole ROI story depends on them.",
    keep:true }
];

/* =========================================================
   STATE
   ========================================================= */
const state = {
  view:"flow",
  expandedPhase:null,
  completedTasks:new Set(),
  demoPlaying:false,
  demoTimeout:null,
  demoQueue:[],
  demoIdx:0,
  activeNavPhase:null
};

/* =========================================================
   HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;');

function totalTasks(){ return PHASES.reduce((s,p) => s + p.tasks.length, 0); }
function completedCount(){ return state.completedTasks.size; }

/* =========================================================
   NAV
   ========================================================= */
function renderNav(){
  const html = PHASES.map(p => {
    const taskCount = p.tasks.length;
    const doneInPhase = p.tasks.filter((t,i) =>
      state.completedTasks.has(p.id + ':' + i)).length;
    const isDone = doneInPhase === taskCount;
    const isActive = state.view === 'flow' &&
      (state.activeNavPhase === p.id || state.expandedPhase === p.id);

    return `
      <button class="phase-link ${isActive?'on':''} ${isDone?'done':''}"
              data-phase="${p.id}" style="--pc:${p.color}">
        <span class="pn">${p.num}</span>
        <span class="pt">
          <span class="pt-name">${esc(p.name)}</span>
          <span class="pt-sub">${doneInPhase}/${taskCount} tasks</span>
        </span>
      </button>`;
  }).join('');
  $('phaseList').innerHTML = html;

  $('phaseList').querySelectorAll('.phase-link').forEach(btn => {
    btn.addEventListener('click', () => {
      stopDemo();
      state.view = 'flow';
      state.expandedPhase = btn.dataset.phase;
      state.activeNavPhase = btn.dataset.phase;
      document.querySelectorAll('.view-btn').forEach(b =>
        b.classList.toggle('on', b.dataset.view === 'flow'));
      renderAll();
      // scroll to phase
      setTimeout(() => {
        const el = document.querySelector(
          `[data-phase-wrap="${btn.dataset.phase}"]`);
        if (el){
          const y = el.getBoundingClientRect().top + window.scrollY - 120;
          const stage = $('stage');
          stage.scrollTo({top: el.offsetTop - 100, behavior:'smooth'});
        }
      }, 80);
    });
  });
}

/* =========================================================
   TOP BAR
   ========================================================= */
function renderChrome(){
  const crumb = $('crumb');
  const labels = {
    flow:"phase flow",
    metrics:"success metrics",
    artifacts:"artifact status",
    gates:"approval gates",
    risks:"risks & cuts"
  };
  crumb.innerHTML = `
    <span class="pill">V1</span>
    <span class="sep">·</span>
    <span>Marketing Execution</span>
    <span class="sep">·</span>
    <span style="color:var(--mut2)">${labels[state.view]}</span>`;

  const badges = $('topBadges');
  badges.innerHTML = `
    <span class="tb">90 days</span>
    <span class="tb">bayan.edu.om</span>
    <span class="tb">goal · revenue</span>
    <span class="tb hot">no live access</span>`;

  // overall progress
  const total = totalTasks();
  const done = completedCount();
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  $('overallPct').textContent = pct + '%';
  $('overallFill').style.width = pct + '%';

  // status bar
  const currentPhase = state.expandedPhase
    ? PHASES.find(p => p.id === state.expandedPhase)
    : PHASES[0];

  $('statusbar').innerHTML = `
    <span>plan <b>Bayan · V1 Marketing Execution</b></span>
    <span class="right">
      <span><b>${done}</b>/${total} tasks</span>
      <span class="chip">${PHASES.length} phases</span>
      <span class="chip hot">CEO-gated</span>
    </span>`;
}

/* =========================================================
   RENDER — dispatcher
   ========================================================= */
function renderAll(){
  renderNav();
  renderChrome();
  renderStage();
}

function renderStage(){
  const accents = {
    flow:"34,211,238",
    metrics:"52,211,153",
    artifacts:"167,139,250",
    gates:"255,138,61",
    risks:"244,63,94"
  };
  document.documentElement.style.setProperty('--accent', accents[state.view]);

  if (state.view === 'flow') renderFlow();
  else if (state.view === 'metrics') renderMetrics();
  else if (state.view === 'artifacts') renderArtifacts();
  else if (state.view === 'gates') renderGates();
  else if (state.view === 'risks') renderRisks();
}

/* =========================================================
   RENDER — FLOW
   ========================================================= */
function renderFlow(){
  const hero = `
    <div class="plan-hero">
      <div class="ph-k">Implementation plan · ${PLAN_META.prepared}</div>
      <h1>Bayan — V1 Marketing Execution Plan
        <small>Site: ${PLAN_META.site} · Horizon: ${PLAN_META.horizon} · Goal: ${PLAN_META.goal}</small>
      </h1>
      <p>The <b>execution layer</b> — how every drafted Bayan artifact goes from
        drafted → live → measured. Strategy already exists in
        <code>bayan-ceo-marketing-plan.md</code>; this plan does not re-argue it.</p>
      <div class="constraint">
        <span class="ic">⚠</span>
        <div>${PLAN_META.constraint}</div>
      </div>
    </div>`;

  const stack = PHASES.map((p, pi) => {
    const isExpanded = state.expandedPhase === p.id;
    const doneInPhase = p.tasks.filter((t,i) =>
      state.completedTasks.has(p.id + ':' + i)).length;
    const allDone = doneInPhase === p.tasks.length;

    const tasksHTML = p.tasks.map((t, ti) => {
      const key = p.id + ':' + ti;
      const isDone = state.completedTasks.has(key);
      const isOpen = false;
      return `
        <div class="task ${isDone?'done':''}" data-task="${key}"
             data-phase="${p.id}" data-idx="${ti}">
          <span class="tk"></span>
          <div class="tb">
            <div class="tname">${t.name}</div>
            <div class="tmeta">${t.meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>
            <div class="tverify">
              <span class="lbl">Verify</span>
              ${t.verify}
            </div>
          </div>
        </div>`;
    }).join('');

    const flowDot = `<div class="phase-flow-line">
        <span class="dot" style="animation-delay:${pi*0.5}s"></span>
      </div>`;

    return `
      <div class="phase-block ${allDone?'completed':''}"
           data-phase-wrap="${p.id}" style="--pc:${p.color}">
        <div class="phase-rail">
          <div class="phase-node">${p.num}</div>
          ${pi < PHASES.length - 1 ? flowDot : ''}
        </div>

        <div>
          <div class="phase-card ${isExpanded?'expanded':''}"
               data-phase-card="${p.id}" style="--pc:${p.color}">
            <div class="phase-head">
              <div class="phase-meta">
                <div class="phase-kicker">Phase ${p.num} · ${esc(p.sub)}</div>
                <div class="phase-name">${esc(p.name)}</div>
                <div class="phase-desc">${p.desc}</div>
              </div>
              <div class="phase-owner">
                <span class="owner-badge">owner · ${esc(p.owner)}</span>
                ${p.agent ? `<span class="owner-sub">agent · ${esc(p.agent)}</span>` : ''}
                ${p.ceo && p.ceo !== 'none'
                  ? `<span class="owner-sub" style="color:rgb(var(--rose))">ceo · ${esc(p.ceo)}</span>`
                  : ''}
              </div>
            </div>

            <div class="phase-tasks">${tasksHTML}</div>

            <div class="phase-expand-hint">
              <span class="chev">›</span>
              ${isExpanded ? 'collapse' : 'expand'} · ${doneInPhase}/${p.tasks.length} tasks
            </div>
          </div>
        </div>
      </div>`;
  }).join('');

  $('stage').innerHTML = hero + `<div class="phase-stack">${stack}</div>`;
  wireFlow();
}

function wireFlow(){
  // phase card expand
  document.querySelectorAll('[data-phase-card]').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.task')) return;
      stopDemo();
      const id = card.dataset.phaseCard;
      const wasOpen = state.expandedPhase === id;
      state.expandedPhase = wasOpen ? null : id;
      state.activeNavPhase = state.expandedPhase;
      renderAll();
      // restore scroll
      if (!wasOpen){
        setTimeout(() => {
          const el = document.querySelector(`[data-phase-wrap="${id}"]`);
          if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
        }, 100);
      }
    });
  });

  // task toggle done / open verify
  document.querySelectorAll('.task').forEach(task => {
    task.addEventListener('click', e => {
      stopDemo();
      const key = task.dataset.task;
      // if user clicks on a hidden verify area (open state), just toggle
      const isDone = state.completedTasks.has(key);
      if (isDone){
        state.completedTasks.delete(key);
      } else {
        state.completedTasks.add(key);
      }
      renderNav();
      renderChrome();

      // update task visuals in place for snappiness
      task.classList.toggle('done', !isDone);

      // update phase card hint text
      const phaseId = task.dataset.phase;
      const phase = PHASES.find(p => p.id === phaseId);
      if (phase){
        const doneInPhase = phase.tasks.filter((t,i) =>
          state.completedTasks.has(phaseId + ':' + i)).length;
        const hint = document.querySelector(
          `[data-phase-card="${phaseId}"] .phase-expand-hint`);
        if (hint){
          hint.innerHTML = `<span class="chev">›</span> ${
            state.expandedPhase === phaseId ? 'collapse' : 'expand'
          } · ${doneInPhase}/${phase.tasks.length} tasks`;
        }
      }
    });

    // separate open-verify on hover of the tverify area is not needed — clicking
    // anywhere toggles. Long-press open verify: use right-click? no.
    // Better: click on the meta row (not tname) opens verify. Actually simpler:
    // clicking a task toggles done. Double-click opens verify. Let's add a
    // dedicated approach: click on task title area when task is not done → done.
  });

  // Open verify on second click? Let's add: shift-click opens verify
  document.querySelectorAll('.task').forEach(task => {
    task.addEventListener('contextmenu', e => {
      e.preventDefault();
      task.classList.toggle('open');
    });
  });
}

/* =========================================================
   RENDER — METRICS
   ========================================================= */
function renderMetrics(){
  const cards = METRICS.map((m, i) => `
    <div class="metric-card" style="--mc:${m.color};--d:${i*60}ms">
      <div class="metric-kicker">${esc(m.kicker)}</div>
      <div class="metric-title">Moving this lever</div>
      <div class="metric-compare">
        <span class="metric-from">${esc(m.from)}<small>${m.unit ? esc(m.unit) : ''}</small></span>
        <span class="metric-arrow">→</span>
        <span class="metric-to">${esc(m.to)}${m.unit && !m.to.includes('<') ? `<small>${esc(m.unit)}</small>` : ''}</span>
      </div>
      <div class="metric-bar"><i data-w="${metricFill(m)}"></i></div>
      <div class="metric-proof">
        <span class="pi">✓</span>
        <span>${m.proof}</span>
      </div>
    </div>`).join('');

  $('stage').innerHTML = `
    <div class="metrics-hero">
      <div class="k">Success criteria</div>
      <h2>The numbers we move.</h2>
      <p>Six levers, each with a baseline, a target, and the proof that will
        confirm it. Every number is either pulled by Phase 0 or measured by
        an audit re-run.</p>
    </div>
    <div class="metrics-grid">${cards}</div>`;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.metric-bar i').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  }));
}

function metricFill(m){
  // crude visual fill based on how far the target is from baseline
  // maps to 40-95% range
  const num = parseFloat(String(m.to).replace(/[^\d.]/g, ''));
  if (isNaN(num)) return 70;
  if (m.kicker.includes('LCP')) return 88;
  if (m.kicker.includes('Marketing health')) return 54;
  if (m.kicker.includes('GEO')) return 90;
  if (m.kicker.includes('visibility')) return 82;
  if (m.kicker.includes('Commercial')) return 65;
  if (m.kicker.includes('Funnel')) return 78;
  return 75;
}

   RENDER — ARTIFACTS

/* =========================================================
   VIEW SWITCH
   ========================================================= */
$('viewSwitch').addEventListener('click', e => {
  const btn = e.target.closest('.view-btn');
  if (!btn) return;
  stopDemo();
  state.view = btn.dataset.view;
  state.expandedPhase = null;
  state.activeNavPhase = null;
  $('stage').scrollTop = 0;
  renderAll();
});

/* =========================================================
   DEMO
   ========================================================= */
function startDemo(){
  stopDemo();
  state.demoPlaying = true;
  $('demoBtn').classList.add('playing');
  $('demoBtn').textContent = '■ stop demo';

  state.view = 'flow';
  state.expandedPhase = null;
  state.activeNavPhase = null;
  state.completedTasks = new Set();
  $('stage').scrollTop = 0;
  document.querySelectorAll('.view-btn').forEach(b =>
    b.classList.toggle('on', b.dataset.view === 'flow'));

  // build queue of all tasks
  state.demoQueue = [];
  PHASES.forEach(p => p.tasks.forEach((t,i) => {
    state.demoQueue.push({phaseId:p.id, idx:i});
  }));
  state.demoIdx = 0;

  renderAll();
  setTimeout(() => demoStep(), 400);
}

function stopDemo(){
  state.demoPlaying = false;
  if (state.demoTimeout) clearTimeout(state.demoTimeout);
  state.demoTimeout = null;
  const btn = $('demoBtn');
  if (btn){
    btn.classList.remove('playing');
    btn.textContent = '▶ run demo';
  }
}

function demoStep(){
  if (!state.demoPlaying) return;
  if (state.demoIdx >= state.demoQueue.length){
    stopDemo();
    return;
  }

  const {phaseId, idx} = state.demoQueue[state.demoIdx];
  const key = phaseId + ':' + idx;

  // expand the phase
  if (state.expandedPhase !== phaseId){
    state.expandedPhase = phaseId;
    state.activeNavPhase = phaseId;
    renderAll();
    setTimeout(() => {
      const el = document.querySelector(`[data-phase-wrap="${phaseId}"]`);
      if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 100);
    // wait, then complete the task
    state.demoTimeout = setTimeout(() => {
      if (!state.demoPlaying) return;
      state.completedTasks.add(key);
      renderNav();
      renderChrome();
      // update task visual
      const task = document.querySelector(`[data-task="${key}"]`);
      if (task) task.classList.add('done');
      state.demoIdx++;
      demoStep();
    }, 900);
  } else {
    state.completedTasks.add(key);
    renderNav();
    renderChrome();
    const task = document.querySelector(`[data-task="${key}"]`);
    if (task) task.classList.add('done');
    state.demoIdx++;
    state.demoTimeout = setTimeout(() => {
      if (!state.demoPlaying) return;
      demoStep();
    }, 500);
  }
}

$('demoBtn').addEventListener('click', () => {
  if (state.demoPlaying) stopDemo();
  else startDemo();
});

/* =========================================================
   KEYBOARD
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  const views = ['flow','metrics','artifacts','gates','risks'];
  const i = views.indexOf(state.view);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){
    e.preventDefault();
    const next = views[(i+1) % views.length];
    state.view = next;
    state.expandedPhase = null;
    document.querySelectorAll('.view-btn').forEach(b =>
      b.classList.toggle('on', b.dataset.view === next));
    renderAll();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
    e.preventDefault();
    const prev = views[(i-1+views.length) % views.length];
    state.view = prev;
    state.expandedPhase = null;
    document.querySelectorAll('.view-btn').forEach(b =>
      b.classList.toggle('on', b.dataset.view === prev));
    renderAll();
  }
});

/* =========================================================
   BOOT
   ========================================================= */
// initially expand phase 0
state.expandedPhase = 'p0';
state.activeNavPhase = 'p0';
renderAll();
</script>
