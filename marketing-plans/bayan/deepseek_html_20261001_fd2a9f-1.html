<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Diagnostic · Session Console</title>
<style>
  :root{
    --ink:#05070b;--ink2:#0a0e14;--panel:#0f141c;--panel2:#141b25;
    --line:#1b2430;--txt:#e9eef6;--mut:#7b8798;--mut2:#4d5666;
    --gold:245,190,60;--cyan:34,211,238;--violet:167,139,250;
    --orange:255,138,61;--emerald:52,211,153;--rose:244,63,94;
    --accent:245,190,60;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--txt);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;line-height:1.5}

  /* ambient */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg::before{content:"";position:absolute;inset:-30%;
    background:
      radial-gradient(40% 35% at 12% 8%, rgba(var(--accent),.10), transparent 60%),
      radial-gradient(38% 38% at 90% 80%, rgba(var(--violet),.07), transparent 65%);
    transition:background 1.2s ease;filter:blur(24px)}
  .bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(75% 60% at 50% 35%,#000 25%,transparent 100%)}

  /* ---------- app grid ---------- */
  .app{position:relative;z-index:1;display:grid;
    grid-template-columns:236px 1fr 300px;height:100vh;
    transition:grid-template-columns .3s ease}
  .app.hide-amend{grid-template-columns:236px 1fr 0}
  .app.hide-amend .amend{transform:translateX(100%);opacity:0;pointer-events:none}

  /* ---------- left rail ---------- */
  .rail{border-right:1px solid var(--line);
    background:linear-gradient(180deg,rgba(14,18,24,.92),rgba(9,12,16,.92));
    backdrop-filter:blur(14px);display:flex;flex-direction:column;
    padding:18px 12px 14px;gap:14px;min-height:0}

  .brand{display:flex;align-items:center;gap:11px;padding:2px 6px 14px;
    border-bottom:1px solid var(--line)}
  .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
    font:700 16px/1 var(--mono);color:#06090d;
    background:linear-gradient(140deg,rgb(var(--accent)),rgba(var(--accent),.55));
    box-shadow:0 0 22px -4px rgba(var(--accent),.7);
    transition:background .6s ease,box-shadow .6s ease}
  .brand-name{font-size:13.5px;font-weight:650;letter-spacing:.02em}
  .brand-sub{font:400 9.5px/1.4 var(--mono);color:var(--mut2);
    letter-spacing:.1em;text-transform:uppercase}

  .rail-label{font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--mut2);padding:0 8px;margin-bottom:2px}

  .phase-list{display:flex;flex-direction:column;gap:3px;overflow-y:auto;
    flex:1;min-height:0;padding-right:2px}
  .phase-list::-webkit-scrollbar{width:4px}
  .phase-list::-webkit-scrollbar-thumb{background:#222a36;border-radius:9px}

  .phase{all:unset;cursor:pointer;position:relative;
    display:flex;align-items:center;gap:11px;
    padding:10px 11px 10px 12px;border-radius:10px;
    transition:background .18s,color .18s;color:var(--mut)}
  .phase:hover{background:rgba(255,255,255,.035);color:#c3ccdc}
  .phase.active{background:rgba(var(--pc),.10);color:var(--txt)}
  .phase.active::before{content:"";position:absolute;left:0;top:50%;
    translate:0 -50%;width:3px;height:20px;border-radius:9px;
    background:rgb(var(--pc));box-shadow:0 0 12px 0 rgba(var(--pc),.9)}
  .phase.done .phase-num{background:rgb(var(--pc));color:var(--ink);border-color:rgb(var(--pc))}
  .phase-num{flex:0 0 24px;width:24px;height:24px;border-radius:7px;
    display:grid;place-items:center;font:700 11px/1 var(--mono);
    background:rgba(255,255,255,.05);color:var(--mut2);
    border:1px solid transparent;transition:.3s}
  .phase.active .phase-num{background:rgba(var(--pc),.2);color:rgb(var(--pc));
    border-color:rgba(var(--pc),.4)}
  .phase-txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .phase-name{font-size:12px;font-weight:560;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phase-count{font:400 9.5px/1.3 var(--mono);color:var(--mut2);
    letter-spacing:.04em}
  .phase.active .phase-count{color:rgb(var(--pc))}

  .rail-foot{border-top:1px solid var(--line);padding-top:12px;
    display:flex;flex-direction:column;gap:10px}
  .overall{display:flex;flex-direction:column;gap:7px;padding:0 8px}
  .overall-row{display:flex;justify-content:space-between;align-items:baseline}
  .overall-label{font:500 9.5px/1 var(--mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--mut2)}
  .overall-val{font:700 15px/1 var(--mono);color:rgb(var(--accent));letter-spacing:-.02em}
  .overall-bar{height:4px;border-radius:99px;background:#171e28;overflow:hidden}
  .overall-fill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,rgba(var(--accent),.5),rgb(var(--accent)));
    box-shadow:0 0 12px -2px rgba(var(--accent),.9);
    transition:width .5s cubic-bezier(.22,.75,.3,1)}

  .btn-demo{all:unset;cursor:pointer;text-align:center;
    font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
    padding:10px 12px;border-radius:9px;color:rgb(var(--accent));
    background:rgba(var(--accent),.10);border:1px solid rgba(var(--accent),.3);
    transition:.2s}
  .btn-demo:hover{background:rgba(var(--accent),.18)}
  .btn-demo.playing{color:#0a0e13;background:rgb(var(--accent))}

  /* ---------- main canvas ---------- */
  .canvas{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}

  .topbar{display:flex;align-items:center;gap:14px;
    padding:14px 26px;border-bottom:1px solid var(--line);
    background:rgba(9,12,16,.55);backdrop-filter:blur(10px)}
  .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:11px;
    font:500 12px/1.3 var(--mono);color:var(--mut);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb b{color:#dfe7f4;font-weight:600}
  .crumb .sep{color:var(--mut2)}
  .crumb .pill{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
    padding:5px 9px;border-radius:7px;background:rgba(var(--accent),.12);
    color:rgb(var(--accent));border:1px solid rgba(var(--accent),.28)}

  .icon-btn{all:unset;cursor:pointer;width:34px;height:34px;border-radius:9px;
    display:grid;place-items:center;color:var(--mut);
    border:1px solid var(--line);background:rgba(255,255,255,.02);transition:.2s}
  .icon-btn:hover{color:#c3ccdc;border-color:#2b3543}
  .icon-btn.on{color:rgb(var(--accent));border-color:rgba(var(--accent),.4);
    background:rgba(var(--accent),.1)}

  .stage{flex:1;min-height:0;overflow-y:auto;padding:26px 26px 30px;
    display:flex;flex-direction:column;gap:16px}
  .stage::-webkit-scrollbar{width:8px}
  .stage::-webkit-scrollbar-thumb{background:#1d2531;border-radius:9px}
  .stage::-webkit-scrollbar-thumb:hover{background:#28323f}

  /* ---------- question card ---------- */
  .q-card{border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:22px 24px 22px;position:relative;overflow:hidden;
    animation:qIn .55s cubic-bezier(.2,.7,.3,1) both}
  @keyframes qIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .q-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,rgb(var(--accent)),rgba(var(--accent),.15))}

  .q-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .q-num{flex:0 0 auto;font:700 11px/1 var(--mono);letter-spacing:.09em;
    padding:6px 9px;border-radius:7px;
    background:rgba(var(--accent),.14);color:rgb(var(--accent));
    border:1px solid rgba(var(--accent),.3)}
  .q-title{font:650 21px/1.25 var(--sans);letter-spacing:-.02em;flex:1;min-width:0}
  .q-title small{display:block;font:400 11.5px/1.5 var(--mono);
    color:var(--mut2);letter-spacing:.03em;margin-top:6px}

  /* ---------- 5-step loop ---------- */
  .loop{display:flex;align-items:stretch;gap:0;margin-bottom:20px;
    padding:12px 14px;border-radius:13px;
    background:rgba(255,255,255,.025);border:1px solid var(--line);overflow-x:auto}
  .loop::-webkit-scrollbar{height:0}
  .step-chip{flex:1;min-width:132px;position:relative;
    display:flex;align-items:center;gap:10px;padding:8px 12px 8px 10px;
    border-radius:9px;transition:.3s}
  .step-chip + .step-chip{margin-left:6px}
  .step-chip .dot{width:22px;height:22px;flex:0 0 22px;border-radius:7px;
    display:grid;place-items:center;font:700 10px/1 var(--mono);
    background:rgba(255,255,255,.05);color:var(--mut2);
    border:1px solid transparent;transition:.35s}
  .step-chip .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .step-chip .st{font:600 10.5px/1 var(--mono);letter-spacing:.04em;
    color:var(--mut);transition:.3s;text-transform:lowercase}
  .step-chip .st-sub{font:400 9px/1.3 var(--mono);color:var(--mut2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .step-chip.active{background:rgba(var(--accent),.08)}
  .step-chip.active .dot{background:rgba(var(--accent),.2);color:rgb(var(--accent));
    border-color:rgba(var(--accent),.45);
    box-shadow:0 0 0 0 rgba(var(--accent),.5);
    animation:stepPulse 1.8s ease-in-out infinite}
  @keyframes stepPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(var(--accent),.45)}
    60%{box-shadow:0 0 0 8px rgba(var(--accent),0)}}
  .step-chip.active .st{color:rgb(var(--accent))}
  .step-chip.done .dot{background:rgba(52,211,153,.15);color:#34d399;
    border-color:rgba(52,211,153,.4)}
  .step-chip.done .st{color:#7fdcb6}
  .step-chip .arrow{position:absolute;right:-3px;top:50%;translate:0 -50%;
    color:var(--mut2);font-size:11px;z-index:2;pointer-events:none;
    background:var(--panel);padding:0 2px}
  .step-chip:last-child .arrow{display:none}

  /* ---------- answer / insight panels ---------- */
  .panel{border-radius:13px;padding:16px 18px;
    animation:slideIn .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .panel.draft{background:linear-gradient(180deg,rgba(var(--accent),.07),rgba(var(--accent),.02));
    border:1px solid rgba(var(--accent),.25)}
  .panel.insight{background:linear-gradient(180deg,rgba(52,211,153,.06),rgba(52,211,153,.01));
    border:1px solid rgba(52,211,153,.28)}
  .panel.await{background:rgba(255,255,255,.02);border:1px dashed var(--line)}

  .panel-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .panel-ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
    font-size:12px;flex:0 0 24px}
  .panel.draft .panel-ico{background:rgba(var(--accent),.16);color:rgb(var(--accent))}
  .panel.insight .panel-ico{background:rgba(52,211,153,.16);color:#34d399}
  .panel.await .panel-ico{background:rgba(255,255,255,.05);color:var(--mut)}
  .panel-ttl{font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase}
  .panel.draft .panel-ttl{color:rgb(var(--accent))}
  .panel.insight .panel-ttl{color:#4fdfa9}
  .panel.await .panel-ttl{color:var(--mut)}
  .panel-tag{margin-left:auto;font:500 9.5px/1 var(--mono);letter-spacing:.06em;
    text-transform:lowercase;color:var(--mut2);
    padding:4px 7px;border-radius:5px;background:rgba(255,255,255,.04)}
  .panel-body{font-size:13.5px;line-height:1.65;color:#cfd8e8}
  .panel-body b{color:#fff;font-weight:600}
  .panel-body em{font-style:normal;color:rgb(var(--accent))}
  .panel.insight .panel-body em{color:#4fdfa9}
  .panel-body code{font-family:var(--mono);font-size:12px;color:#cfd8e8;
    background:rgba(255,255,255,.05);padding:1.5px 6px;border-radius:5px}
  .panel-body .bench{display:inline-block;font:600 9.5px/1 var(--mono);
    letter-spacing:.08em;text-transform:uppercase;color:#4fdfa9;
    background:rgba(52,211,153,.12);padding:4px 7px;border-radius:5px;
    margin-right:8px;border:1px solid rgba(52,211,153,.22)}

  /* ---------- actions ---------- */
  .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;
    animation:slideIn .5s cubic-bezier(.2,.7,.3,1) both}
  .btn{all:unset;cursor:pointer;font:600 11px/1 var(--mono);
    letter-spacing:.07em;text-transform:uppercase;
    padding:10px 14px;border-radius:9px;transition:.2s;white-space:nowrap;
    display:inline-flex;align-items:center;gap:8px}
  .btn .bico{font-size:12px}
  .btn-primary{color:#0a0e13;background:rgb(var(--accent));
    box-shadow:0 0 24px -8px rgba(var(--accent),.9)}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-primary.pulse{animation:btnPulse 1.6s ease-in-out infinite}
  @keyframes btnPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(var(--accent),.55)}
    60%{box-shadow:0 0 0 10px rgba(var(--accent),0)}}
  .btn-ghost{color:var(--mut);border:1px solid var(--line);
    background:rgba(255,255,255,.02)}
  .btn-ghost:hover{color:#c3ccdc;border-color:#2b3543}
  .btn-confirm{color:#0a0e13;background:#34d399}
  .btn-confirm:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.35;cursor:not-allowed}

  /* ---------- right rail ---------- */
  .amend{border-left:1px solid var(--line);
    background:linear-gradient(180deg,rgba(14,18,24,.92),rgba(9,12,16,.92));
    backdrop-filter:blur(14px);display:flex;flex-direction:column;
    min-height:0;transition:transform .35s ease,opacity .35s ease;
    overflow:hidden}
  .amend-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  .amend-head .ttl{font:600 10.5px/1 var(--mono);
    letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
  .amend-head .cnt{margin-left:auto;font:700 12px/1 var(--mono);
    color:rgb(var(--accent));background:rgba(var(--accent),.12);
    padding:5px 9px;border-radius:7px;border:1px solid rgba(var(--accent),.3)}

  .amend-list{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px;
    display:flex;flex-direction:column;gap:9px}
  .amend-list::-webkit-scrollbar{width:6px}
  .amend-list::-webkit-scrollbar-thumb{background:#1d2531;border-radius:9px}

  .amend-item{padding:12px 13px;border-radius:11px;
    border:1px solid var(--line);background:rgba(255,255,255,.02);
    animation:amendIn .55s cubic-bezier(.2,.7,.3,1) both}
  @keyframes amendIn{
    from{opacity:0;transform:translateX(14px) scale(.96)}
    to{opacity:1;transform:none}}
  .amend-item .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .amend-item .n{font:700 9.5px/1 var(--mono);color:rgb(var(--accent));
    background:rgba(var(--accent),.13);padding:3px 6px;border-radius:5px;
    letter-spacing:.06em}
  .amend-item .src{font:500 9.5px/1 var(--mono);color:var(--mut2);
    letter-spacing:.05em;text-transform:lowercase}
  .amend-item .txt{font-size:12px;line-height:1.5;color:#b9c4d6}

  .amend-empty{padding:26px 18px;text-align:center;font-size:12px;
    color:var(--mut2);line-height:1.7;font-family:var(--mono);letter-spacing:.03em}
  .amend-empty .big{font-size:22px;display:block;margin-bottom:10px;opacity:.3}

  /* ---------- scoring (phase 5) ---------- */
  .score-hero{border-radius:18px;border:1px solid var(--line);
    padding:22px 24px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    animation:qIn .55s cubic-bezier(.2,.7,.3,1) both}
  .score-hero h3{font:650 22px/1.25 var(--sans);letter-spacing:-.02em;margin-bottom:8px}
  .score-hero p{font-size:13px;color:var(--mut);max-width:62ch;line-height:1.6}

  .score-dials{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .dial{padding:20px;border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;
    animation:qIn .55s cubic-bezier(.2,.7,.3,1) both}
  .dial::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--dc);opacity:.85}
  .dial-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .dial-ttl{font:600 11px/1 var(--mono);letter-spacing:.09em;
    text-transform:uppercase;color:var(--mut)}
  .dial-rank{font:600 10px/1 var(--mono);letter-spacing:.07em;
    padding:5px 8px;border-radius:6px;text-transform:lowercase}
  .dial-num{display:flex;align-items:baseline;gap:4px;
    font:700 34px/1 var(--sans);letter-spacing:-.04em;color:#fff;
    font-variant-numeric:tabular-nums}
  .dial-num small{font:600 14px/1 var(--mono);color:var(--mut2);letter-spacing:0}
  .dial-bar{height:6px;border-radius:99px;background:#171e28;overflow:hidden}
  .dial-bar i{display:block;height:100%;width:0;border-radius:99px;
    background:var(--dc);box-shadow:0 0 14px -2px var(--dc);
    transition:width 1.1s cubic-bezier(.22,.75,.3,1)}

  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:11px;margin-top:6px}
  .cat{padding:14px 15px 15px;border-radius:13px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    display:flex;flex-direction:column;gap:11px;
    animation:qIn .5s cubic-bezier(.2,.7,.3,1) both}
  .cat-top{display:flex;align-items:center;gap:9px}
  .cat-name{font:600 12.5px/1.35 var(--sans);color:#dfe7f4;flex:1;min-width:0}
  .cat-val{font:700 14px/1 var(--mono);color:rgb(var(--accent));
    letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .cat-val small{font-size:10px;color:var(--mut2);margin-left:2px}
  .cat-bar{height:5px;border-radius:99px;background:#171e28;overflow:hidden}
  .cat-bar i{display:block;height:100%;width:0;border-radius:99px;
    background:rgb(var(--accent));box-shadow:0 0 10px -2px rgba(var(--accent),.9);
    transition:width .55s cubic-bezier(.22,.75,.3,1)}
  .cat-btns{display:flex;gap:5px;flex-wrap:wrap}
  .cat-btns button{all:unset;cursor:pointer;flex:1;text-align:center;
    font:600 10.5px/1 var(--mono);letter-spacing:.03em;
    padding:7px 5px;border-radius:7px;color:var(--mut);
    background:rgba(255,255,255,.03);border:1px solid var(--line);
    transition:.18s;min-width:36px}
  .cat-btns button:hover{color:#c3ccdc;border-color:#2b3543}
  .cat-btns button.on{color:#0a0e13;background:rgb(var(--accent));
    border-color:rgb(var(--accent));box-shadow:0 0 16px -6px rgba(var(--accent),.9)}

  .sub-head{font:600 10.5px/1 var(--mono);letter-spacing:.12em;
    text-transform:uppercase;color:var(--mut);margin:26px 0 12px;
    display:flex;align-items:center;gap:10px}
  .sub-head::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- artifacts (phase 6) ---------- */
  .artifact{border-radius:18px;border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    overflow:hidden;cursor:pointer;
    animation:qIn .55s cubic-bezier(.2,.7,.3,1) both;transition:.3s}
  .artifact:hover{border-color:rgba(var(--accent),.4);
    box-shadow:0 20px 60px -30px rgba(var(--accent),.4)}
  .artifact-head{padding:20px 22px;display:flex;align-items:center;gap:14px}
  .artifact-ico{width:44px;height:44px;flex:0 0 44px;border-radius:13px;
    display:grid;place-items:center;font-size:20px;
    background:rgba(var(--accent),.14);color:rgb(var(--accent));
    border:1px solid rgba(var(--accent),.3);
    box-shadow:0 0 26px -10px rgba(var(--accent),.9)}
  .artifact-meta{flex:1;min-width:0}
  .artifact-name{font:650 16px/1.3 var(--sans);letter-spacing:-.01em;margin-bottom:4px}
  .artifact-sub{font:400 11px/1.4 var(--mono);color:var(--mut2);
    letter-spacing:.03em}

const state = {
  phaseIdx: 0,
  qIdx: 0,
  qStep: {},        // questionId -> { step:0..4 }
  answered: new Set(),
  amendments: [],
  discovered: {},   // questionId -> bool
  demoPlaying: false,
  demoTimeout: null
};

/* =========================================================
   HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function currentPhase(){ return PHASES[state.phaseIdx]; }

function currentQuestion(){
  const p = currentPhase();
  if (p.type !== 'questions') return null;
  return p.questions[state.qIdx];
}

function getStep(qid){
  if (!state.qStep[qid]) state.qStep[qid] = { step: 0 };
  return state.qStep[qid].step;
}

function setStep(qid, n){
  if (!state.qStep[qid]) state.qStep[qid] = { step: 0 };
  state.qStep[qid].step = n;
}

/* =========================================================
   RENDER — phase nav
   ========================================================= */
function renderNav(){
  const html = PHASES.map((p, i) => {
    const active = i === state.phaseIdx;
    const total = p.questions ? p.questions.length
                : p.categories ? p.categories.length
                : p.artifacts ? p.artifacts.length
                : 0;
    const doneCount = countDoneInPhase(p, i);
    const isDone = doneCount === total && total > 0;
    return `
      <button class="phase ${active?'active':''} ${isDone?'done':''}"
              data-i="${i}" style="--pc:${p.accent}">
        <span class="phase-num">${p.id}</span>
        <span class="phase-txt">
          <span class="phase-name">${p.name}</span>
          <span class="phase-count">${doneCount}/${total} ${p.type==='questions'?'q':''}</span>
        </span>
      </button>`;
  }).join('');
  $('phaseList').innerHTML = html;

  $('phaseList').querySelectorAll('.phase').forEach(btn => {
    btn.addEventListener('click', () => {
      stopDemo();
      const i = parseInt(btn.dataset.i);
      goPhase(i);
    });
  });
}

function countDoneInPhase(p, i){
  if (p.type === 'questions'){
    return p.questions.filter(q => state.answered.has(q.id)).length;
  }
  if (p.type === 'scoring'){
    const cDone = p.categories.filter(c => c.chosen != null).length;
    const oDone = p.owner.filter(o => o.chosen != null).length;
    return cDone + oDone;
  }
  if (p.type === 'artifacts'){
    return 0;
  }
  return 0;
}

  }

  // overall progress
  const total = PHASES.reduce((s,p) => {
    if (p.type === 'questions') return s + p.questions.length;
    if (p.type === 'scoring') return s + p.categories.length + p.owner.length;
    if (p.type === 'artifacts') return s + 2;
    return s;
  }, 0);
  let done = 0;
  PHASES.forEach((p,i) => { done += countDoneInPhase(p, i); });
  const pct = Math.round((done / total) * 100);
  $('overallPct').textContent = pct + '%';
  $('overallFill').style.width = pct + '%';

  // status
  const answered = state.answered.size;
  const totalQ = PHASES[1] && PHASES[1].questions
    ? PHASES.slice(0,4).reduce((s,p)=>s+p.questions.length, 0) : 0;
  $('statusbar').innerHTML = `
    <span>consultant <b>gemini-pro</b></span>
    <span class="right">
      <span><b>${answered}</b>/23 questions</span>
      <span class="chip">${state.amendments.length} discoveries</span>
    </span>`;
}

/* =========================================================

   ========================================================= */
function renderStage(){
  const p = currentPhase();
  if (p.type === 'questions') renderQuestion();
  else if (p.type === 'scoring') renderScoring();
  else if (p.type === 'artifacts') renderArtifacts();
  else renderQuestion();
}

/* =========================================================
   RENDER — question
   ========================================================= */
function renderQuestion(){
  const p = currentPhase();
  const q = currentQuestion();
  if (!q) return;

  document.documentElement.style.setProperty('--accent', p.accent);
  const step = getStep(q.id);

  // loop chips
  const STEPS = [
    { t:"answer", s:"from Master Prompt" },
    { t:"confirm", s:"you confirm or edit" },
    { t:"insight", s:"benchmark reveal" },
    { t:"await", s:"wait for you" },
    { t:"log", s:"log to amendment" }
  ];
  const chipHTML = STEPS.map((st, i) => {
    const cls = i < step ? 'done' : i === step ? 'active' : '';
    const num = i < step ? '✓' : i + 1;
    return `
      <div class="step-chip ${cls}">
        <span class="dot">${num}</span>
        <span class="txt">
          <span class="st">${st.t}</span>
          <span class="st-sub">${st.s}</span>
        </span>
        <span class="arrow">→</span>
      </div>`;
  }).join('');

  let body = '';

  if (step === 0){
    body = `
      <div class="panel await" style="animation-delay:180ms">
        <div class="panel-head">
          <span class="panel-ico">?</span>
          <span class="panel-ttl">ready</span>
          <span class="panel-tag">step 1 of 5</span>
        </div>
        <div class="panel-body">
          I already know your business from your Master Prompt. Press <b>Run</b>
          and I'll answer this question from that context — then you confirm, edit, or replace.
        </div>
      </div>
      <div class="actions" style="animation-delay:260ms">
        <button class="btn btn-primary pulse" id="qRun">
          <span class="bico">🤖</span> answer from master prompt
        </button>
      </div>`;
  } else {
    // draft always shown once step >= 1
    body += `
      <div class="panel draft" style="animation-delay:60ms">
        <div class="panel-head">
          <span class="panel-ico">🤖</span>
          <span class="panel-ttl">AI draft</span>
          <span class="panel-tag">from your master prompt</span>
        </div>
        <div class="panel-body">${q.draft}</div>
      </div>`;

    if (step === 1){
      body += `
        <div class="actions" style="animation-delay:180ms">
          <button class="btn btn-confirm" id="qConfirm"><span class="bico">✓</span> confirm</button>
          <button class="btn btn-ghost" id="qEdit"><span class="bico">✎</span> edit</button>
          <button class="btn btn-ghost" id="qReplace"><span class="bico">↻</span> replace</button>
        </div>`;
    }

    if (step >= 2){
      body += `
        <div class="panel insight" style="animation-delay:100ms">
          <div class="panel-head">
            <span class="panel-ico">💡</span>
            <span class="panel-ttl">insight</span>
            <span class="panel-tag">benchmark comparison</span>
          </div>
          <div class="panel-body">
            <span class="bench">${esc(q.bench)}</span>${q.insight}
          </div>
        </div>`;

      if (q.discovery){
        body += `
          <div class="panel await" style="animation-delay:220ms">
            <div class="panel-head">
              <span class="panel-ico">📝</span>
              <span class="panel-ttl">new discovery</span>
              <span class="panel-tag">→ logged for phase 6</span>
            </div>
            <div class="panel-body">${esc(q.discovery)}</div>
          </div>`;
      }

      const isLast = state.qIdx === p.questions.length - 1;
      const lastQOverall = state.phaseIdx === 3 && isLast;
      body += `
        <div class="actions" style="animation-delay:300ms">
          <button class="btn btn-primary ${!state.answered.has(q.id)?'pulse':''}" id="qNext">
            <span class="bico">→</span> ${lastQOverall ? 'go to scoring' : 'continue'}
          </button>
        </div>`;
    }
  }

  $('stage').innerHTML = `
    <div class="q-card">
      <div class="q-head">
        <span class="q-num">${q.id}</span>
        <h2 class="q-title">${q.title}
          <small>Phase ${p.id} · ${p.name}</small>
        </h2>
      </div>
      <div class="loop">${chipHTML}</div>
      ${body}
    </div>`;

  wireQuestion();
}

function wireQuestion(){
  const q = currentQuestion();
  if (!q) return;

  const run = $('qRun');
  if (run) run.addEventListener('click', () => {
    stopDemo();
    setStep(q.id, 1);
    renderQuestion();
    renderNav(); renderChrome();
  });

  const confirm = $('qConfirm');
  if (confirm) confirm.addEventListener('click', () => {
    stopDemo();
    setStep(q.id, 2);
    if (!state.answered.has(q.id)){
      state.answered.add(q.id);
      if (q.discovery) addAmendment(q);
    }
    renderQuestion();
    renderNav(); renderChrome(); renderAmendments();
  });

  const edit = $('qEdit');
  if (edit) edit.addEventListener('click', () => {
    stopDemo();
    setStep(q.id, 2);
    if (!state.answered.has(q.id)){
      state.answered.add(q.id);
      if (q.discovery) addAmendment(q);
    }
    renderQuestion();
    renderNav(); renderChrome(); renderAmendments();
  });

  const replace = $('qReplace');
  if (replace) replace.addEventListener('click', () => {
    stopDemo();
    setStep(q.id, 2);
    if (!state.answered.has(q.id)){
      state.answered.add(q.id);
      if (q.discovery) addAmendment(q);
    }
    renderQuestion();
    renderNav(); renderChrome(); renderAmendments();
  });

  const next = $('qNext');
  if (next) next.addEventListener('click', () => {
    stopDemo();
    advance();
  });
}

function advance(){
  const p = currentPhase();
  if (p.type === 'questions' && state.qIdx < p.questions.length - 1){
    state.qIdx++;
    renderStage();
    renderChrome();
    renderNav();
    return;
  }
  // end of phase
  if (state.phaseIdx < PHASES.length - 1){
    goPhase(state.phaseIdx + 1);
  }
}

/* =========================================================
   RENDER — scoring
   ========================================================= */
function renderScoring(){
  const p = currentPhase();
  document.documentElement.style.setProperty('--accent', p.accent);

  const totalScore = p.categories.reduce((s,c) => s + (c.chosen ?? 0), 0);
  const totalMax = p.categories.reduce((s,c) => s + c.max, 0);
  const pct = Math.round((totalScore / totalMax) * 100);

  const totalOwner = p.owner.reduce((s,o) => s + (o.chosen ?? 0), 0);
  const ownerMax = p.owner.length * 5;
  const ownerPct = Math.round((totalOwner / ownerMax) * 100);

  const rank = (pct, type) => {
    if (type === 'process'){
      if (pct >= 85) return { l:'excellent', c:'52,211,153' };
      if (pct >= 70) return { l:'good', c:'34,211,238' };
      if (pct >= 50) return { l:'developing', c:'245,190,60' };
      if (pct >= 25) return { l:'basic', c:'255,138,61' };
      return { l:'critical', c:'244,63,94' };
    } else {
      if (pct >= 80) return { l:'excellent', c:'52,211,153' };
      if (pct >= 60) return { l:'good', c:'34,211,238' };
      if (pct >= 40) return { l:'developing', c:'245,190,60' };
      if (pct >= 20) return { l:'concerning', c:'255,138,61' };
      return { l:'critical', c:'244,63,94' };
    }
  };
  const rP = rank(pct, 'process');
  const rO = rank(ownerPct, 'owner');

  const catHTML = p.categories.map((c, i) => {
    const btns = [0,1,3,5,7].map(v =>
      `<button data-cat="${c.id}" data-val="${v}"
        class="${c.chosen===v?'on':''}">${v}</button>`).join('');
    const w = (c.chosen / c.max) * 100;
    return `
      <div class="cat" style="animation-delay:${i*40}ms">
        <div class="cat-top">
          <span class="cat-name">${c.name}</span>
          <span class="cat-val">${c.chosen ?? 0}<small>/${c.max}</small></span>

        <div class="cat-bar"><i data-w="${w}"></i></div>

  }).join('');

  const ownerBtns = [0,1,3,5];
  const ownerHTML = p.owner.map((o, i) => {
    const btns = ownerBtns.map(v =>
      `<button data-owner="${o.id}" data-val="${v}"
        class="${o.chosen===v?'on':''}">${v}</button>`).join('');
    const w = (o.chosen / 5) * 100;
    return `
      <div class="cat" style="animation-delay:${i*40}ms">

          <span class="cat-name">${o.name}</span>
          <span class="cat-val">${o.chosen ?? 0}<small>/5</small></span>
        </div>
        <div class="cat-bar"><i data-w="${w}"></i></div>
        <div class="cat-btns">${btns}</div>
      </div>`;
  }).join('');

  $('stage').innerHTML = `
    <div class="score-hero">
      <h3>Process maturity assessment.</h3>
      <p>Score each category 0–7. Adjust any value and totals recalculate live.
        Owner independence is scored 0–5 across the same operating areas.</p>
    </div>

    <div class="score-dials">

        </div>
        <div class="dial-num">${totalScore}<small>/ ${totalMax}</small></div>
        <div class="dial-bar"><i data-w="${pct}"></i></div>
        <div style="font:500 10.5px/1 var(--mono);color:var(--mut2);letter-spacing:.05em">${pct}% of maximum</div>
      </div>

      <div class="dial" style="--dc:rgb(${rO.c})">
        <div class="dial-head">
          <span class="dial-ttl">Owner Independence</span>
          <span class="dial-rank" style="color:rgb(${rO.c});background:rgba(${rO.c},.12);border:1px solid rgba(${rO.c},.3)">${rO.l}</span>
        </div>
        <div class="dial-num">${totalOwner}<small>/ ${ownerMax}</small></div>
        <div class="dial-bar"><i data-w="${ownerPct}"></i></div>
        <div style="font:500 10.5px/1 var(--mono);color:var(--mut2);letter-spacing:.05em">${ownerPct}% · higher = more independence</div>
      </div>
    </div>

    <div class="sub-head">Process maturity · 10 categories</div>
    <div class="cat-grid">${catHTML}</div>

    <div class="cat-grid">${ownerHTML}</div>

        <span class="bico">→</span> generate artifacts

  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.cat-bar i[data-w]').forEach(el => {

    });

    btn.addEventListener('click', () => {

      const cat = p.categories.find(c => c.id === btn.dataset.cat);
      cat.chosen = parseInt(btn.dataset.val);

  $('stage').querySelectorAll('button[data-owner]').forEach(btn => {

      const o = p.owner.find(x => x.id === btn.dataset.owner);
      o.chosen = parseInt(btn.dataset.val);

  });

  $('scoringNext').addEventListener('click', () => {
    stopDemo();
    goPhase(5);

}

/* =========================================================
   AMENDMENTS (right rail)
   ========================================================= */
function addAmendment(q){
  if (state.discovered[q.id]) return;
  state.discovered[q.id] = true;
  state.amendments.push({
    id: q.id,
    text: q.discovery,
    src: q.id
  });
}

function renderAmendments(){
  const list = $('amendList');
  $('amendCount').textContent = state.amendments.length;
  $('discoveryCount').textContent = state.amendments.length + ' discoveries';

  if (state.amendments.length === 0){
    list.innerHTML = `<div class="amend-empty">
      <span class="big">◇</span>
      New discoveries will<br>appear here as you confirm<br>each question.
    </div>`;
    return;
  }

  list.innerHTML = state.amendments.map((a, i) => `
    <div class="amend-item" style="animation-delay:${Math.min(i*40,400)}ms">
      <div class="row">
        <span class="n">${String(i+1).padStart(2,'0')}</span>
        <span class="src">from Q${a.src}</span>
      </div>
      <div class="txt">${esc(a.text)}</div>
    </div>`).join('');
}

/* =========================================================
   NAVIGATION
   ========================================================= */
function goPhase(i){
  state.phaseIdx = i;
  state.qIdx = 0;
  renderAll();
}

function renderAll(){
  renderNav();
  renderChrome();
  renderStage();
  renderAmendments();
}

/* =========================================================
   DEMO MODE
   ========================================================= */
function startDemo(){
  stopDemo();
  state.demoPlaying = true;
  $('demoBtn').classList.add('playing');
  $('demoBtn').textContent = '■ stop demo';

  // If we're at artifacts or scoring, restart from beginning
  if (currentPhase().type === 'artifacts' ||
      currentPhase().type === 'scoring'){
    state.phaseIdx = 0; state.qIdx = 0;
    state.qStep = {}; state.answered = new Set();
    state.amendments = []; state.discovered = {};
    renderAll();
  }

  demoStep();
}

function stopDemo(){
  state.demoPlaying = false;
  if (state.demoTimeout) clearTimeout(state.demoTimeout);
  state.demoTimeout = null;
  const btn = $('demoBtn');
  if (btn){
    btn.classList.remove('playing');
    btn.textContent = '▶ run demo';
  }
}

function demoStep(){
  if (!state.demoPlaying) return;
  const p = currentPhase();

  if (p.type === 'questions'){
    const q = currentQuestion();
    const step = getStep(q.id);

    if (step === 0){
      state.demoTimeout = setTimeout(() => {
        if (!state.demoPlaying) return;
        setStep(q.id, 1);
        renderQuestion(); renderNav(); renderChrome();
        demoStep();
      }, 700);
    } else if (step === 1){
      state.demoTimeout = setTimeout(() => {
        if (!state.demoPlaying) return;
        setStep(q.id, 2);
        if (!state.answered.has(q.id)){
          state.answered.add(q.id);
          if (q.discovery) addAmendment(q);
        }
        renderQuestion(); renderNav(); renderChrome(); renderAmendments();
        demoStep();
      }, 1300);
    } else {
      state.demoTimeout = setTimeout(() => {
        if (!state.demoPlaying) return;
        advance();
        demoStep();
      }, 1300);
    }
  } else if (p.type === 'scoring'){
    state.demoTimeout = setTimeout(() => {
      if (!state.demoPlaying) return;
      goPhase(5);
      demoStep();
    }, 1400);
  } else if (p.type === 'artifacts'){
    // open both artifacts sequentially
    state.demoTimeout = setTimeout(() => {
      const a1 = $('art1'); if (a1) a1.classList.add('open');
    }, 400);
    state.demoTimeout = setTimeout(() => {
      const a2 = $('art2'); if (a2) a2.classList.add('open');
      stopDemo();
    }, 1400);
  }
}

/* =========================================================
   CONTROLS
   ========================================================= */
$('demoBtn').addEventListener('click', () => {
  if (state.demoPlaying) stopDemo();
  else startDemo();
});

$('amendToggle').addEventListener('click', () => {
  const app = $('app');
  if (window.innerWidth <= 1180){
    app.classList.toggle('show-amend');
  } else {
    app.classList.toggle('hide-amend');
  }
});

// keyboard: arrows navigate
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  const p = currentPhase();
  if (p.type !== 'questions') return;
  if (e.key === 'ArrowRight' && state.qIdx < p.questions.length - 1){
    stopDemo(); state.qIdx++; renderStage(); renderChrome(); renderNav();
  } else if (e.key === 'ArrowLeft' && state.qIdx > 0){
    stopDemo(); state.qIdx--; renderStage(); renderChrome(); renderNav();
  }
});

/* =========================================================
   BOOT
   ========================================================= */
renderAll();
</script>
</body>
</html>
