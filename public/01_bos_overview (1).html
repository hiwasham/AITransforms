<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Augmented Business Operating System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --color-background-primary:#ffffff;--color-background-secondary:#f7f7f6;
      --color-background-success:#e8f7f2;--color-background-info:#e8f2fb;
      --color-border-tertiary:rgba(0,0,0,0.12);--color-border-secondary:rgba(0,0,0,0.22);
      --color-border-success:#0F6E56;--color-border-info:#185FA5;
      --color-text-primary:#141414;--color-text-secondary:#555;--color-text-tertiary:#999;
      --border-radius-md:8px;--border-radius-lg:12px;--border-radius-xl:16px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f0f0ef;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
    .page{background:#fff;border-radius:var(--border-radius-xl);padding:2rem;width:100%;max-width:900px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
    .page-title{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:.4rem}
    .page-heading{font-size:22px;font-weight:500;color:var(--color-text-primary);margin-bottom:1.5rem}
    .bos-status-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:1.25rem;background:var(--color-background-secondary)}
    .bos-status-left{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-text-secondary)}
    .bos-dot{width:8px;height:8px;border-radius:50%;background:#1D9E75;flex-shrink:0}
    .bos-dot.pulse{animation:dotpulse 1.4s ease-in-out infinite}
    @keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.3}}
    .bos-activate-btn{font-size:12px;font-weight:500;padding:6px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:#fff;color:var(--color-text-primary);cursor:pointer;transition:background .15s}
    .bos-activate-btn:hover{background:var(--color-background-secondary)}
    .bos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .bos-card{background:#fff;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:12px}
    .bos-card-head{display:flex;align-items:flex-start;justify-content:space-between}
    .bos-icon-wrap{width:34px;height:34px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--color-background-secondary)}
    .bos-num{font-size:22px;font-weight:500;color:var(--color-text-tertiary);line-height:1}
    .bos-card-title{font-size:15px;font-weight:500;color:var(--color-text-primary);margin:0 0 2px}
    .bos-card-sub{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary);margin:0}
    .bos-divider{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:0}
    .bos-modules-label{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary)}
    .bos-module{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);cursor:pointer;transition:border-color .15s,background .15s;background:var(--color-background-secondary)}
    .bos-module:hover{border-color:var(--color-border-secondary)}
    .bos-module.running{border-color:#1D9E75;background:var(--color-background-success)}
    .bos-module.done{border-color:#1D9E75;background:var(--color-background-success)}
    .bos-module-icon{font-size:14px;color:var(--color-text-secondary);flex-shrink:0}
    .bos-module-icon.running{color:#1D9E75;animation:spin 1.2s linear infinite}
    .bos-module-icon.done{color:#1D9E75}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bos-module-text{flex:1;font-size:12.5px;color:var(--color-text-primary)}
    .bos-module-status{font-size:11px;color:var(--color-text-tertiary)}
    .bos-module-status.running{color:#1D9E75}
    .bos-module-status.done{color:#1D9E75}
    .bos-footer{display:flex;align-items:center;justify-content:space-between;padding-top:4px}
    .bos-progress-bar{height:3px;border-radius:2px;background:var(--color-border-tertiary);flex:1;margin-right:10px;overflow:hidden}
    .bos-progress-fill{height:100%;border-radius:2px;background:#1D9E75;transition:width .4s ease}
    .bos-progress-label{font-size:11px;color:var(--color-text-secondary);white-space:nowrap}
    @media(max-width:600px){.bos-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="page">
  <p class="page-title">AI-Augmented Business Operating System</p>
  <h1 class="page-heading">System Overview — Three Pillars</h1>
  <div class="bos-status-bar">
    <div class="bos-status-left">
      <div class="bos-dot" id="global-dot"></div>
      <span id="global-status-text">System idle — click any module or activate all</span>
    </div>
    <button class="bos-activate-btn" onclick="activateAll()">
      <i class="ti ti-player-play"></i> Activate all systems
    </button>
  </div>
  <div class="bos-grid" id="bos-grid"></div>
</div>
<script>
const pillars=[
  {num:"01",title:"Growth Engine",sub:"Revenue & Market Expansion",icon:"ti-rocket",modules:[
    {icon:"ti-target",label:"Lead scoring",},{icon:"ti-send",label:"Automated outreach"},{icon:"ti-database",label:"CRM enrichment"},{icon:"ti-file-text",label:"Proposal generation"}
  ]},
  {num:"02",title:"Operations Core",sub:"Efficiency & Governance",icon:"ti-adjustments-horizontal",modules:[
    {icon:"ti-list-check",label:"SOP execution"},{icon:"ti-contract",label:"Contract analysis"},{icon:"ti-topology-ring",label:"Workflow integration"},{icon:"ti-shield-check",label:"Quality management"}
  ]},
  {num:"03",title:"People OS",sub:"Talent & Culture",icon:"ti-users",modules:[
    {icon:"ti-user-search",label:"Recruiting"},{icon:"ti-arrow-bar-right",label:"Onboarding"},{icon:"ti-chart-line",label:"Performance reviews"},{icon:"ti-school",label:"L&D pathways"}
  ]}
];
const states={};
function getCardState(pi){
  const mods=pillars[pi].modules;
  const done=mods.filter((_,i)=>states[`${pi}-${i}`]==='done').length;
  const running=mods.filter((_,i)=>states[`${pi}-${i}`]==='running').length;
  return{done,running,total:mods.length};
}
function render(){
  document.getElementById('bos-grid').innerHTML=pillars.map((p,pi)=>{
    const{done,running,total}=getCardState(pi);
    const pct=Math.round((done/total)*100);
    return`<div class="bos-card">
      <div class="bos-card-head">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="bos-icon-wrap"><i class="ti ${p.icon}"></i></div>
          <div><p class="bos-card-title">${p.title}</p><p class="bos-card-sub">${p.sub}</p></div>
        </div>
        <span class="bos-num">${p.num}</span>
      </div>
      <hr class="bos-divider">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="bos-modules-label">Installed modules</span>
        ${p.modules.map((m,mi)=>{const s=states[`${pi}-${mi}`]||'idle';return`<div class="bos-module ${s}" onclick="triggerModule(${pi},${mi})">
          <i class="ti ${s==='running'?'ti-loader-2':s==='done'?'ti-circle-check':m.icon} bos-module-icon ${s}"></i>
          <span class="bos-module-text">${m.label}</span>
          <span class="bos-module-status ${s}">${s==='idle'?'idle':s==='running'?'running…':'done'}</span>
        </div>`;}).join('')}
      </div>
      <div class="bos-footer">
        <div class="bos-progress-bar"><div class="bos-progress-fill" style="width:${pct}%"></div></div>
        <span class="bos-progress-label">${done}/${total} active</span>
      </div>
    </div>`;
  }).join('');
}
function triggerModule(pi,mi){
  const key=`${pi}-${mi}`;if(states[key]==='running')return;
  states[key]='running';updateGlobal();render();
  setTimeout(()=>{states[key]='done';updateGlobal();render();},1600+Math.random()*800);
}
function activateAll(){
  pillars.forEach((_,pi)=>_.modules.forEach((__,mi)=>{
    const key=`${pi}-${mi}`;if(states[key]==='done')return;
    states[key]='running';
    setTimeout(()=>{states[key]='done';updateGlobal();render();},(pi*4+mi)*220+Math.random()*300+1600);
  }));
  updateGlobal();render();
}
function updateGlobal(){
  const allKeys=pillars.flatMap((_,pi)=>_.modules.map((__,mi)=>`${pi}-${mi}`));
  const running=allKeys.filter(k=>states[k]==='running').length;
  const done=allKeys.filter(k=>states[k]==='done').length;
  const dot=document.getElementById('global-dot');
  const txt=document.getElementById('global-status-text');
  if(running>0){dot.classList.add('pulse');txt.textContent=`${running} AI agent${running>1?'s':''} running…`;}
  else if(done===allKeys.length){dot.classList.remove('pulse');txt.textContent=`All ${allKeys.length} modules active — system fully operational`;}
  else if(done>0){dot.classList.remove('pulse');txt.textContent=`${done} of ${allKeys.length} modules active`;}
  else{dot.classList.remove('pulse');txt.textContent='System idle — click any module or activate all';}
}
render();
</script>
</body>
</html>
