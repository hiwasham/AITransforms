<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growth Engine — Revenue & Market Expansion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root{--bg:#fff;--bg2:#f7f7f6;--bg-success:#e8f7f2;--bd:rgba(0,0,0,0.12);--bd2:rgba(0,0,0,0.22);--bd-success:#0F6E56;--t1:#141414;--t2:#555;--t3:#999;--acc:#1D9E75;--rmd:8px;--rlg:12px;--rxl:16px;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f0f0ef;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
    .page{background:var(--bg);border-radius:var(--rxl);padding:2rem;width:100%;max-width:860px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
    .page-tag{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:.3rem}
    .page-heading{font-size:22px;font-weight:500;color:var(--t1);margin-bottom:1.5rem}
    .ge-header{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;padding:12px 14px;border:0.5px solid var(--bd);border-radius:var(--rlg);background:var(--bg2)}
    .ge-icon{width:38px;height:38px;border-radius:var(--rmd);border:0.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--acc);background:var(--bg)}
    .ge-htitle{font-size:16px;font-weight:500;color:var(--t1);margin:0}
    .ge-hsub{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:0}
    .ge-hnum{font-size:26px;font-weight:500;color:var(--t3);margin-left:auto}
    .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1rem}
    .tab{padding:9px 6px;border:0.5px solid var(--bd);border-radius:var(--rmd);cursor:pointer;text-align:center;background:var(--bg2);transition:border-color .15s,background .15s}
    .tab:hover{border-color:var(--bd2)}
    .tab.active{border-color:var(--acc);background:var(--bg-success)}
    .tab-icon{font-size:18px;color:var(--t2);display:block;margin-bottom:4px}
    .tab.active .tab-icon{color:var(--acc)}
    .tab-num{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
    .tab.active .tab-num{color:var(--acc)}
    .tab-label{font-size:12px;font-weight:500;color:var(--t1);display:block;line-height:1.3;margin-top:2px}
    .panel{border:0.5px solid var(--bd);border-radius:var(--rlg);overflow:hidden;background:var(--bg)}
    .panel-top{padding:1rem 1.25rem;border-bottom:0.5px solid var(--bd)}
    .panel-title{font-size:15px;font-weight:500;color:var(--t1);margin:0 0 4px;display:flex;align-items:center;gap:8px}
    .panel-desc{font-size:13px;color:var(--t2);margin:0;line-height:1.6}
    .panel-body{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:12px}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .metric{background:var(--bg2);border-radius:var(--rmd);padding:10px 12px;text-align:center}
    .metric-val{font-size:20px;font-weight:500;color:var(--acc);display:block}
    .metric-label{font-size:11px;color:var(--t2);display:block;margin-top:2px;line-height:1.3}
    .sec{display:flex;flex-direction:column;gap:6px}
    .sec-label{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:6px}
    .sec-label i{font-size:13px;color:var(--acc)}
    .sec-text{font-size:13px;color:var(--t2);line-height:1.6;margin:0;padding:10px 12px;background:var(--bg2);border-radius:var(--rmd);border:0.5px solid var(--bd)}
    .hitl{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--bg2);border-radius:var(--rmd);border:0.5px solid var(--bd)}
    .hitl i{font-size:15px;color:var(--acc);margin-top:1px;flex-shrink:0}
    .hitl span{font-size:12.5px;color:var(--t2);line-height:1.5}
    .flow{display:flex;align-items:center;overflow-x:auto;padding-bottom:2px;gap:0}
    .flow-step{display:flex;align-items:center;flex-shrink:0}
    .flow-node{padding:5px 10px;border-radius:var(--rmd);border:0.5px solid var(--bd2);font-size:11.5px;color:var(--t1);background:var(--bg2);white-space:nowrap}
    .flow-arrow{font-size:12px;color:var(--t3);padding:0 4px;flex-shrink:0}
    .panel-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 1.25rem;border-top:0.5px solid var(--bd);background:var(--bg2)}
    .status-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--acc)}
    .status-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
    .nav{display:flex;gap:6px}
    .nav-btn{font-size:12px;padding:5px 12px;border-radius:var(--rmd);border:0.5px solid var(--bd2);background:var(--bg);color:var(--t2);cursor:pointer;transition:background .15s}
    .nav-btn:hover{background:var(--bg2)}
    .nav-btn:disabled{opacity:.35;cursor:default}
  </style>
</head>
<body>
<div class="page">
  <p class="page-tag">AI-Augmented Business Operating System — Pillar 01</p>
  <h1 class="page-heading">Growth Engine Modules</h1>
  <div class="ge-header">
    <div class="ge-icon"><i class="ti ti-rocket"></i></div>
    <div><p class="ge-htitle">Growth Engine</p><p class="ge-hsub">Revenue &amp; Market Expansion</p></div>
    <span class="ge-hnum">01</span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>
<script>
const M=[
  {num:"01",icon:"ti-target",label:"Lead Scoring",sub:"Qualification criteria",
  desc:"AI automatically evaluates every prospect against your ICP and documented qualification rules — before a salesperson ever speaks to them.",
  how:"AI agents analyze data from web forms, call transcripts, or scraped sources to score each lead on budget, urgency, authority, and need. A 30-minute Zoom transcript is processed and returned as a binary yes/no qualification status.",
  impact:"Eliminates time wasted on unqualified leads and no-shows. Salespeople focus exclusively on high-value conversations — every call is worth showing up for.",
  metrics:[{v:"0",l:"Unqualified calls\npassed through"},{v:"100%",l:"Reps time on\nhigh-value leads"},{v:"<2 min",l:"Transcript to\nscore time"}],
  flow:["Web form / Call transcript","AI analysis","ICP scoring","Yes / No status","CRM record updated"],hitl:null},
  {num:"02",icon:"ti-file-text",label:"Proposal Generation",sub:"Service offerings",
  desc:"Transforms proposal creation from a manual, hours-long task into a sub-20-minute process — without losing personalization or quality.",
  how:"AI is given your documented service offerings plus the specific context from a discovery call transcript. It drafts a hyper-personalized proposal scoped to the prospect's exact pain points and budget signals.",
  impact:"Eliminates the proposal bottleneck — the gap between 'great call' and 'signed contract' that kills deals. One documented case compressed an 8–10 hour process to under 20 minutes.",
  metrics:[{v:"20 min",l:"Draft time\n(was 8–10 hrs)"},{v:"80%",l:"AI-generated\ncontent"},{v:"20%",l:"Human refinement\n(pricing & scope)"}],
  flow:["Discovery transcript","Service docs","AI drafts proposal","Human review (20%)","Sent to prospect"],
  hitl:"The final 20% — high-stakes pricing, scope edge cases, and relationship nuance — is always completed by a human before the proposal leaves the building."},
  {num:"03",icon:"ti-database",label:"CRM Enrichment",sub:"Sales process",
  desc:"Automates the administrative drag of keeping sales data accurate and current — recovering roughly 20% of every salesperson's working day.",
  how:"AI scrapes and enriches lead lists with missing contact data (emails, phone numbers, LinkedIn URLs) from web sources. After every call, it auto-updates CRM records with notes, action items, and updated lead scores — zero manual entry.",
  impact:"Moves reporting cadence from weekly to daily, sharpening decision speed. No more stale pipelines or missing follow-up context. Every record reflects the last interaction accurately.",
  metrics:[{v:"20%",l:"Salesperson day\nrecovered"},{v:"Daily",l:"Reporting cadence\n(was weekly)"},{v:"0",l:"Manual CRM\nentries required"}],
  flow:["Post-call AI analysis","Notes + action items","Lead score update","CRM auto-updated","Pipeline view refreshed"],hitl:null},
  {num:"04",icon:"ti-send",label:"Automated Outreach",sub:"Brand voice",
  desc:"Scales outreach from thousands to hundreds of thousands of touches per month — while keeping every message sounding unmistakably like you.",
  how:"Your Business DNA and Master Prompt train the AI on your brand voice. It then drafts personalized emails, texts, or video scripts tailored to individual prospects at volume — 2,000 to 100,000 per month with no degradation in quality.",
  impact:"Replaces expensive paid ad spend with a predictable, AI-driven flow of qualified introductions. Reply rates hold because messages are hyper-personalized — not broadcast blasts.",
  metrics:[{v:"100K",l:"Outreach per month\nat capacity"},{v:"0%",l:"Drop in reply rate\nwith scale"},{v:"$0",l:"Paid ad dependency\nreplaced"}],
  flow:["Business DNA / Master Prompt","Prospect list","AI drafts messages","Multi-channel send","Qualified replies to CRM"],hitl:null}
];
let a=0;
function renderTabs(){document.getElementById('tabs').innerHTML=M.map((m,i)=>`<div class="tab${i===a?' active':''}" onclick="go(${i})"><i class="ti ${m.icon} tab-icon"></i><span class="tab-num">${m.num}</span><span class="tab-label">${m.label}</span></div>`).join('');}
function renderPanel(){
  const m=M[a];
  const flow=m.flow.map((s,i)=>`<div class="flow-step"><div class="flow-node">${s}</div>${i<m.flow.length-1?'<span class="flow-arrow"><i class="ti ti-arrow-right"></i></span>':''}</div>`).join('');
  document.getElementById('panel').innerHTML=`
    <div class="panel-top"><p class="panel-title"><i class="ti ${m.icon}" style="font-size:16px;color:#1D9E75"></i>${m.label}</p><p class="panel-desc">${m.desc}</p></div>
    <div class="panel-body">
      <div class="metrics">${m.metrics.map(mt=>`<div class="metric"><span class="metric-val">${mt.v}</span><span class="metric-label">${mt.l.replace(/\n/g,'<br>')}</span></div>`).join('')}</div>
      <div class="sec"><span class="sec-label"><i class="ti ti-cpu"></i>How it works</span><p class="sec-text">${m.how}</p></div>
      <div class="sec"><span class="sec-label"><i class="ti ti-trending-up"></i>Operational impact</span><p class="sec-text">${m.impact}</p></div>
      <div class="sec"><span class="sec-label"><i class="ti ti-arrow-right"></i>Workflow</span><div class="flow">${flow}</div></div>
      ${m.hitl?`<div class="hitl"><i class="ti ti-user-check"></i><span><strong style="font-weight:500;color:#141414">Human in the loop:</strong> ${m.hitl}</span></div>`:''}
    </div>
    <div class="panel-footer">
      <div class="status-badge"><div class="dot"></div>Module active</div>
      <div class="nav">
        <button class="nav-btn" onclick="go(a-1)" ${a===0?'disabled':''}><i class="ti ti-arrow-left"></i> Prev</button>
        <button class="nav-btn" onclick="go(a+1)" ${a===M.length-1?'disabled':''}>Next <i class="ti ti-arrow-right"></i></button>
      </div>
    </div>`;
}
function go(i){if(i<0||i>=M.length)return;a=i;renderTabs();renderPanel();}
renderTabs();renderPanel();
</script>
</body>
</html>
