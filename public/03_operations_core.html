<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Core — Efficiency & Governance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root{--bg:#fff;--bg2:#f7f7f6;--bg-info:#e8f2fb;--bd:rgba(0,0,0,0.12);--bd2:rgba(0,0,0,0.22);--bd-info:#185FA5;--t1:#141414;--t2:#555;--t3:#999;--acc:#185FA5;--rmd:8px;--rlg:12px;--rxl:16px;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f0f0ef;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
    .page{background:var(--bg);border-radius:var(--rxl);padding:2rem;width:100%;max-width:860px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
    .page-tag{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:.3rem}
    .page-heading{font-size:22px;font-weight:500;color:var(--t1);margin-bottom:1.5rem}
    .oc-header{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;padding:12px 14px;border:0.5px solid var(--bd);border-radius:var(--rlg);background:var(--bg2)}
    .oc-icon{width:38px;height:38px;border-radius:var(--rmd);border:0.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--acc);background:var(--bg)}
    .oc-htitle{font-size:16px;font-weight:500;color:var(--t1);margin:0}
    .oc-hsub{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:0}
    .oc-hnum{font-size:26px;font-weight:500;color:var(--t3);margin-left:auto}
    .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1rem}
    .tab{padding:9px 6px;border:0.5px solid var(--bd);border-radius:var(--rmd);cursor:pointer;text-align:center;background:var(--bg2);transition:border-color .15s,background .15s}
    .tab:hover{border-color:var(--bd2)}
    .tab.active{border-color:var(--acc);background:var(--bg-info)}
    .tab-icon{font-size:18px;color:var(--t2);display:block;margin-bottom:4px}
    .tab.active .tab-icon{color:var(--acc)}
    .tab-num{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
    .tab.active .tab-num{color:var(--acc)}
    .tab-label{font-size:12px;font-weight:500;color:var(--t1);display:block;line-height:1.3;margin-top:2px}
    .panel{border:0.5px solid var(--bd);border-radius:var(--rlg);overflow:hidden;background:var(--bg)}
    .panel-top{padding:1rem 1.25rem;border-bottom:0.5px solid var(--bd)}
    .panel-title{font-size:15px;font-weight:500;color:var(--t1);margin:0 0 4px;display:flex;align-items:center;gap:8px}
    .panel-desc{font-size:13px;color:var(--t2);margin:0;line-height:1.6}
    .panel-body{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:12px}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .metric{background:var(--bg2);border-radius:var(--rmd);padding:10px 12px;text-align:center}
    .metric-val{font-size:20px;font-weight:500;color:var(--acc);display:block}
    .metric-label{font-size:11px;color:var(--t2);display:block;margin-top:2px;line-height:1.3}
    .sec{display:flex;flex-direction:column;gap:6px}
    .sec-label{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:6px}
    .sec-label i{font-size:13px;color:var(--acc)}
    .sec-text{font-size:13px;color:var(--t2);line-height:1.6;margin:0;padding:10px 12px;background:var(--bg2);border-radius:var(--rmd);border:0.5px solid var(--bd)}
    .example{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--bg-info);border-radius:var(--rmd);border:0.5px solid #b5d4f4}
    .example i{font-size:15px;color:var(--acc);margin-top:1px;flex-shrink:0}
    .example span{font-size:12.5px;color:var(--t2);line-height:1.5}
    .flow{display:flex;align-items:center;overflow-x:auto;padding-bottom:2px;gap:0}
    .flow-step{display:flex;align-items:center;flex-shrink:0}
    .flow-node{padding:5px 10px;border-radius:var(--rmd);border:0.5px solid var(--bd2);font-size:11.5px;color:var(--t1);background:var(--bg2);white-space:nowrap}
    .flow-arrow{font-size:12px;color:var(--t3);padding:0 4px;flex-shrink:0}
    .panel-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 1.25rem;border-top:0.5px solid var(--bd);background:var(--bg2)}
    .status-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--acc)}
    .status-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
    .nav{display:flex;gap:6px}
    .nav-btn{font-size:12px;padding:5px 12px;border-radius:var(--rmd);border:0.5px solid var(--bd2);background:var(--bg);color:var(--t2);cursor:pointer;transition:background .15s}
    .nav-btn:hover{background:var(--bg2)}
    .nav-btn:disabled{opacity:.35;cursor:default}
  </style>
</head>
<body>
<div class="page">
  <p class="page-tag">AI-Augmented Business Operating System — Pillar 02</p>
  <h1 class="page-heading">Operations Core Modules</h1>
  <div class="oc-header">
    <div class="oc-icon"><i class="ti ti-adjustments-horizontal"></i></div>
    <div><p class="oc-htitle">Operations Core</p><p class="oc-hsub">Efficiency &amp; Governance</p></div>
    <span class="oc-hnum">02</span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>
<script>
const M=[
  {letter:"A",icon:"ti-list-check",label:"SOP Execution",sub:"Following documented procedures",
  desc:"Automates the shift from 'knowing what to do' to 'it happens automatically.' Events trigger work — not managers asking the next question.",
  how:"An AI workflow monitors live business events (contract signatures, form submissions, status changes). When a trigger fires, it automatically populates the correct subtasks in the task manager — no human handoff required.",
  impact:"Eliminates the 'permanent co-pilot' problem. The operations manager no longer shadows the founder step-by-step; instead they manage a pre-built execution engine that runs itself.",
  example:"When a new school signs a contract in Hamkelasi's Sale to Delivery process, a Zapier workflow detects the signature and automatically populates the required subtasks in Mizito — the team's task manager.",
  metrics:[{v:"0",l:"Manual task\nassignments needed"},{v:"Instant",l:"Subtask creation\nafter trigger event"},{v:"100%",l:"SOP steps\ncovered"}],
  flow:["Contract signed","Zapier detects event","SOP template loaded","Subtasks auto-created in Mizito","Team notified"]},
  {letter:"B",icon:"ti-shield-check",label:"Quality Management",sub:"Based on documented requirements",
  desc:"Deploys AI as a 24/7 auditor across every customer interaction — so standards are enforced at scale without anyone manually reviewing calls.",
  how:"AI analyzes support call transcripts against documented quality criteria: brand voice adherence, correct escalation routing, resolution accuracy. Each interaction receives a score. Only scores below threshold trigger a human alert.",
  impact:"Enables leadership by exception. The founder only receives a Slack notification when something falls below a 7/10 — everything above runs silently. Scales quality oversight from 10 calls to 10,000 without adding headcount.",
  example:"At Hamkelasi (700+ schools), AI scores support calls on whether the agent used the 'Hamkelasi Voice' and routed customers to a Level 3 Guide (FAQ) before escalating to a human. Omid only sees interactions that score below 7.",
  metrics:[{v:"700+",l:"Schools audited\nautomatically"},{v:"7/10",l:"Score threshold\nfor human alert"},{v:"0",l:"Manual call reviews\nby founder"}],
  flow:["Support call ends","Transcript generated","AI scores vs. criteria","Score ≥7: silent pass","Score <7: Slack alert"]},
  {letter:"C",icon:"ti-contract",label:"Contract Analysis",sub:"Against documented standards",
  desc:"AI compares every incoming request against your documented rules of engagement — externalizing founder judgment so the team can say yes or no without waiting for approval.",
  how:"When a client submits a non-standard request or a new contract arrives, AI scans it against your documented service scope and pricing rules. It returns a verdict: standard package, custom exception needed, or flag for review.",
  impact:"Solves scope creep at the source. The team can respond to a 'can you also do X?' request immediately — with a documented standard behind them, not a personal judgment call.",
  example:"When a Hamkelasi school complex requests a non-standard LMS integration, AI scans the request against documented service offerings and flags whether it falls under the standard package or requires a custom pricing exception.",
  metrics:[{v:"<5 min",l:"Scope verdict\nturnaround"},{v:"0",l:"Scope creep incidents\npassing undetected"},{v:"100%",l:"Decisions backed\nby documented standard"}],
  flow:["Incoming request / contract","AI scans vs. service docs","Standard scope?","Yes: auto-approve","No: flag + pricing exception"]},
  {letter:"D",icon:"ti-topology-ring",label:"Workflow Integration",sub:"Between documented systems",
  desc:"Builds the digital backbone that connects fragmented tools into a single source of truth — eliminating duplicate data entry across every platform.",
  how:"Data entered in one system (e.g. CRM during discovery) is automatically pushed to downstream systems (task manager for onboarding, success dashboard for reporting). AI enforces field hygiene and naming conventions across all integrations.",
  impact:"No staff member enters the same school name, student count, or contact detail twice. Solves the 'CRM chaos' problem where every user defines their own fields — AI enforces a single data standard across all connected platforms.",
  example:"At Hamkelasi, data entered in Vtiger during a discovery call is auto-pushed to Mizito for onboarding and then to a Customer Success dashboard. The same school name and student count flows through every system untouched.",
  metrics:[{v:"0",l:"Duplicate data\nentries per record"},{v:"3+",l:"Systems connected\nin single backbone"},{v:"Daily",l:"Reporting cadence\n(was manual/weekly)"}],
  flow:["Data entered in Vtiger CRM","Auto-push to Mizito","Onboarding tasks created","Customer Success dashboard updated","Single source of truth"]}
];
let a=0;
function renderTabs(){document.getElementById('tabs').innerHTML=M.map((m,i)=>`<div class="tab${i===a?' active':''}" onclick="go(${i})"><i class="ti ${m.icon} tab-icon"></i><span class="tab-num">Module ${m.letter}</span><span class="tab-label">${m.label}</span></div>`).join('');}
function renderPanel(){
  const m=M[a];
  const flow=m.flow.map((s,i)=>`<div class="flow-step"><div class="flow-node">${s}</div>${i<m.flow.length-1?'<span class="flow-arrow"><i class="ti ti-arrow-right"></i></span>':''}</div>`).join('');
  document.getElementById('panel').innerHTML=`
    <div class="panel-top"><p class="panel-title"><i class="ti ${m.icon}" style="font-size:16px;color:#185FA5"></i>${m.label}</p><p class="panel-desc">${m.desc}</p></div>
    <div class="panel-body">
      <div class="metrics">${m.metrics.map(mt=>`<div class="metric"><span class="metric-val">${mt.v}</span><span class="metric-label">${mt.l.replace(/\n/g,'<br>')}</span></div>`).join('')}</div>
      <div class="sec"><span class="sec-label"><i class="ti ti-cpu"></i>How it works</span><p class="sec-text">${m.how}</p></div>
      <div class="sec"><span class="sec-label"><i class="ti ti-trending-up"></i>Operational impact</span><p class="sec-text">${m.impact}</p></div>
      <div class="sec"><span class="sec-label"><i class="ti ti-building"></i>Real example</span><div class="example"><i class="ti ti-bulb"></i><span>${m.example}</span></div></div>
      <div class="sec"><span class="sec-label"><i class="ti ti-arrow-right"></i>Workflow</span><div class="flow">${flow}</div></div>
    </div>
    <div class="panel-footer">
      <div class="status-badge"><div class="dot"></div>Module active</div>
      <div class="nav">
        <button class="nav-btn" onclick="go(a-1)" ${a===0?'disabled':''}><i class="ti ti-arrow-left"></i> Prev</button>
        <button class="nav-btn" onclick="go(a+1)" ${a===M.length-1?'disabled':''}>Next <i class="ti ti-arrow-right"></i></button>
      </div>
    </div>`;
}
function go(i){if(i<0||i>=M.length)return;a=i;renderTabs();renderPanel();}
renderTabs();renderPanel();
</script>
</body>
</html>
