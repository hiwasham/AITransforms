
<h2 class="sr-only">Growth Engine — four AI modules: Lead Scoring, Proposal Generation, CRM Enrichment, Automated Outreach</h2>
<style>
.ge-wrap{padding:1rem 0;font-family:var(--font-sans)}
.ge-header{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;padding:12px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);background:var(--color-background-secondary)}
.ge-header-icon{width:38px;height:38px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:18px;color:#1D9E75;background:var(--color-background-primary)}
.ge-header-title{font-size:16px;font-weight:500;color:var(--color-text-primary);margin:0}
.ge-header-sub{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#1D9E75;margin:0}
.ge-header-num{font-size:26px;font-weight:500;color:var(--color-text-tertiary);margin-left:auto}
.ge-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1rem}
.ge-tab{padding:9px 6px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;text-align:center;background:var(--color-background-secondary);transition:border-color .15s,background .15s}
.ge-tab:hover{border-color:var(--color-border-secondary)}
.ge-tab.active{border-color:#1D9E75;background:var(--color-background-success)}
.ge-tab-icon{font-size:18px;color:var(--color-text-secondary);display:block;margin-bottom:4px}
.ge-tab.active .ge-tab-icon{color:#1D9E75}
.ge-tab-num{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary)}
.ge-tab.active .ge-tab-num{color:#1D9E75}
.ge-tab-label{font-size:12px;font-weight:500;color:var(--color-text-primary);display:block;line-height:1.3;margin-top:2px}
.ge-panel{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
.ge-panel-top{padding:1rem 1.25rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.ge-panel-title{font-size:15px;font-weight:500;color:var(--color-text-primary);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.ge-panel-desc{font-size:13px;color:var(--color-text-secondary);margin:0;line-height:1.6}
.ge-panel-body{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:12px}
.ge-section{display:flex;flex-direction:column;gap:6px}
.ge-section-label{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-tertiary);display:flex;align-items:center;gap:6px}
.ge-section-label i{font-size:13px;color:#1D9E75}
.ge-section-text{font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin:0;padding:10px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary)}
.ge-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ge-metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;text-align:center}
.ge-metric-val{font-size:20px;font-weight:500;color:#1D9E75;display:block}
.ge-metric-label{font-size:11px;color:var(--color-text-secondary);display:block;margin-top:2px;line-height:1.3}
.ge-hitl{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary)}
.ge-hitl i{font-size:15px;color:#1D9E75;margin-top:1px;flex-shrink:0}
.ge-hitl span{font-size:12.5px;color:var(--color-text-secondary);line-height:1.5}
.ge-flow{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:2px}
.ge-flow-step{display:flex;align-items:center;gap:0;flex-shrink:0}
.ge-flow-node{padding:5px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);font-size:11.5px;color:var(--color-text-primary);background:var(--color-background-secondary);white-space:nowrap}
.ge-flow-arrow{font-size:12px;color:var(--color-text-tertiary);padding:0 4px;flex-shrink:0}
.ge-panel-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 1.25rem;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.ge-status-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#1D9E75}
.ge-status-badge .dot{width:6px;height:6px;border-radius:50%;background:#1D9E75}
.ge-nav{display:flex;gap:6px}
.ge-nav-btn{font-size:12px;padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:background .15s}
.ge-nav-btn:hover{background:var(--color-background-secondary)}
.ge-nav-btn:disabled{opacity:.35;cursor:default}
</style>

<div class="ge-wrap">
  <div class="ge-header">
    <div class="ge-header-icon"><i class="ti ti-rocket" aria-hidden="true"></i></div>
    <div>
      <p class="ge-header-title">Growth Engine</p>
      <p class="ge-header-sub">Revenue &amp; Market Expansion</p>
    </div>
    <span class="ge-header-num">01</span>
  </div>

  <div class="ge-tabs" id="ge-tabs"></div>
  <div class="ge-panel" id="ge-panel"></div>
</div>

<script>
const modules = [
  {
    num:"01", icon:"ti-target", label:"Lead Scoring",
    sub:"Qualification criteria",
    desc:"AI automatically evaluates every prospect against your ICP and documented qualification rules — before a salesperson ever speaks to them.",
    how:"AI agents analyze data from web forms, call transcripts, or scraped sources to score each lead on budget, urgency, authority, and need. A 30-minute Zoom transcript is processed and returned as a binary yes/no qualification status.",
    impact:"Eliminates time wasted on unqualified leads and no-shows. Salespeople focus exclusively on high-value conversations — every call is worth showing up for.",
    metrics:[{val:"0",label:"Unqualified calls\npassed through"},{val:"100%",label:"Reps time on\nhigh-value leads"},{val:"<2 min",label:"Transcript to\nscore time"}],
    flow:["Web form / Call transcript","AI analysis","ICP scoring","Yes / No status","CRM record updated"],
    hitl:null
  },
  {
    num:"02", icon:"ti-file-text", label:"Proposal Generation",
    sub:"Service offerings",
    desc:"Transforms proposal creation from a manual, hours-long task into a sub-20-minute process — without losing personalization or quality.",
    how:"AI is given your documented service offerings plus the specific context from a discovery call transcript. It drafts a hyper-personalized proposal scoped to the prospect's exact pain points and budget signals.",
    impact:"Eliminates the proposal bottleneck — the gap between 'great call' and 'signed contract' that kills deals. One documented case compressed an 8–10 hour process to under 20 minutes.",
    metrics:[{val:"20 min",label:"Draft time\n(was 8–10 hrs)"},{val:"80%",label:"AI-generated\ncontent"},{val:"20%",label:"Human refinement\n(pricing & scope)"}],
    flow:["Discovery transcript","Service docs","AI drafts proposal","Human review (20%)","Sent to prospect"],
    hitl:"The final 20% — high-stakes pricing, scope edge cases, and relationship nuance — is always completed by a human before the proposal leaves the building."
  },
  {
    num:"03", icon:"ti-database", label:"CRM Enrichment",
    sub:"Sales process",
    desc:"Automates the administrative drag of keeping sales data accurate and current — recovering roughly 20% of every salesperson's working day.",
    how:"AI scrapes and enriches lead lists with missing contact data (emails, phone numbers, LinkedIn URLs) from web sources. After every call, it auto-updates CRM records with notes, action items, and updated lead scores — zero manual entry.",
    impact:"Moves reporting cadence from weekly to daily, sharpening decision speed. No more stale pipelines or missing follow-up context. Every record reflects the last interaction accurately.",
    metrics:[{val:"20%",label:"Salesperson day\nrecovered"},{val:"Daily",label:"Reporting cadence\n(was weekly)"},{val:"0",label:"Manual CRM\nentries required"}],
    flow:["Post-call AI analysis","Notes + action items","Lead score update","CRM auto-updated","Pipeline view refreshed"],
    hitl:null
  },
  {
    num:"04", icon:"ti-send", label:"Automated Outreach",
    sub:"Brand voice",
    desc:"Scales outreach from thousands to hundreds of thousands of touches per month — while keeping every message sounding unmistakably like you.",
    how:"Your Business DNA and Master Prompt train the AI on your brand voice. It then drafts personalized emails, texts, or Loom-style video scripts tailored to individual prospects at volume — 2,000 to 100,000 per month with no degradation in quality.",
    impact:"Replaces expensive paid ad spend with a predictable, AI-driven flow of qualified introductions. Reply rates hold because messages are hyper-personalized — not broadcast blasts.",
    metrics:[{val:"100K",label:"Outreach per month\nat capacity"},{val:"0%",label:"Drop in reply rate\nwith scale"},{val:"$0",label:"Paid ad dependency\nreplaced"}],
    flow:["Business DNA / Master Prompt","Prospect list","AI drafts messages","Multi-channel send","Qualified replies to CRM"],
    hitl:null
  }
];

let active = 0;

function renderTabs(){
  document.getElementById('ge-tabs').innerHTML = modules.map((m,i)=>`
    <div class="ge-tab${i===active?' active':''}" onclick="setActive(${i})">
      <i class="ti ${m.icon} ge-tab-icon" aria-hidden="true"></i>
      <span class="ge-tab-num">${m.num}</span>
      <span class="ge-tab-label">${m.label}</span>
    </div>`).join('');
}

function renderPanel(){
  const m = modules[active];
  const flowHtml = m.flow.map((s,i)=>`
    <div class="ge-flow-step">
      <div class="ge-flow-node">${s}</div>
      ${i<m.flow.length-1?'<span class="ge-flow-arrow"><i class="ti ti-arrow-right" aria-hidden="true"></i></span>':''}
    </div>`).join('');
  document.getElementById('ge-panel').innerHTML = `
    <div class="ge-panel-top">
      <p class="ge-panel-title"><i class="ti ${m.icon}" style="font-size:16px;color:#1D9E75" aria-hidden="true"></i>${m.label}</p>
      <p class="ge-panel-desc">${m.desc}</p>
    </div>
    <div class="ge-panel-body">
      <div class="ge-metrics">${m.metrics.map(mt=>`
        <div class="ge-metric">
          <span class="ge-metric-val">${mt.val}</span>
          <span class="ge-metric-label">${mt.label.replace(/\n/g,'<br>')}</span>
        </div>`).join('')}
      </div>
      <div class="ge-section">
        <span class="ge-section-label"><i class="ti ti-cpu" aria-hidden="true"></i>How it works</span>
        <p class="ge-section-text">${m.how}</p>
      </div>
      <div class="ge-section">
        <span class="ge-section-label"><i class="ti ti-trending-up" aria-hidden="true"></i>Operational impact</span>
        <p class="ge-section-text">${m.impact}</p>
      </div>
      <div class="ge-section">
        <span class="ge-section-label"><i class="ti ti-arrow-right" aria-hidden="true"></i>Workflow</span>
        <div class="ge-flow">${flowHtml}</div>
      </div>
      ${m.hitl?`<div class="ge-hitl"><i class="ti ti-user-check" aria-hidden="true"></i><span><strong style="font-weight:500;color:var(--color-text-primary)">Human in the loop:</strong> ${m.hitl}</span></div>`:''}
    </div>
    <div class="ge-panel-footer">
      <div class="ge-status-badge"><div class="dot"></div>Module active</div>
      <div class="ge-nav">
        <button class="ge-nav-btn" onclick="setActive(active-1)" ${active===0?'disabled':''}>
          <i class="ti ti-arrow-left" aria-hidden="true"></i> Prev
        </button>
        <button class="ge-nav-btn" onclick="setActive(active+1)" ${active===modules.length-1?'disabled':''}>
          Next <i class="ti ti-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>`;
}

function setActive(i){
  if(i<0||i>=modules.length) return;
  active=i;
  renderTabs();
  renderPanel();
}

renderTabs();
renderPanel();
</script>
