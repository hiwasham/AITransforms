
<h2 class="sr-only">People OS — four AI modules: Recruiting, Onboarding, Performance Reviews, L&D Pathways</h2>
<style>
.po-wrap{padding:1rem 0;font-family:var(--font-sans)}
.po-header{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;padding:12px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);background:var(--color-background-secondary)}
.po-header-icon{width:38px;height:38px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:18px;color:#534AB7;background:var(--color-background-primary)}
.po-header-title{font-size:16px;font-weight:500;color:var(--color-text-primary);margin:0}
.po-header-sub{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#534AB7;margin:0}
.po-header-num{font-size:26px;font-weight:500;color:var(--color-text-tertiary);margin-left:auto}
.po-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1rem}
.po-tab{padding:9px 6px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;text-align:center;background:var(--color-background-secondary);transition:border-color .15s,background .15s}
.po-tab:hover{border-color:var(--color-border-secondary)}
.po-tab.active{border-color:#534AB7;background:#EEEDFE}
.po-tab-icon{font-size:18px;color:var(--color-text-secondary);display:block;margin-bottom:4px}
.po-tab.active .po-tab-icon{color:#534AB7}
.po-tab-num{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary)}
.po-tab.active .po-tab-num{color:#534AB7}
.po-tab-label{font-size:12px;font-weight:500;color:var(--color-text-primary);display:block;line-height:1.3;margin-top:2px}
.po-panel{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
.po-panel-top{padding:1rem 1.25rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.po-panel-title{font-size:15px;font-weight:500;color:var(--color-text-primary);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.po-panel-desc{font-size:13px;color:var(--color-text-secondary);margin:0;line-height:1.6}
.po-panel-body{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:12px}
.po-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.po-metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;text-align:center}
.po-metric-val{font-size:20px;font-weight:500;color:#534AB7;display:block}
.po-metric-label{font-size:11px;color:var(--color-text-secondary);display:block;margin-top:2px;line-height:1.3}
.po-section{display:flex;flex-direction:column;gap:6px}
.po-section-label{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-tertiary);display:flex;align-items:center;gap:6px}
.po-section-label i{font-size:13px;color:#534AB7}
.po-section-text{font-size:13px;color:var(--color-text-secondary);line-height:1.6;margin:0;padding:10px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary)}
.po-example{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:#EEEDFE;border-radius:var(--border-radius-md);border:0.5px solid #AFA9EC}
.po-example i{font-size:15px;color:#534AB7;margin-top:1px;flex-shrink:0}
.po-example span{font-size:12.5px;color:var(--color-text-secondary);line-height:1.5}
.po-flow{display:flex;align-items:center;overflow-x:auto;padding-bottom:2px}
.po-flow-step{display:flex;align-items:center;flex-shrink:0}
.po-flow-node{padding:5px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);font-size:11.5px;color:var(--color-text-primary);background:var(--color-background-secondary);white-space:nowrap}
.po-flow-arrow{font-size:12px;color:var(--color-text-tertiary);padding:0 4px;flex-shrink:0}
.po-panel-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 1.25rem;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.po-status-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#534AB7}
.po-status-badge .dot{width:6px;height:6px;border-radius:50%;background:#534AB7}
.po-nav{display:flex;gap:6px}
.po-nav-btn{font-size:12px;padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:background .15s}
.po-nav-btn:hover{background:var(--color-background-secondary)}
.po-nav-btn:disabled{opacity:.35;cursor:default}
</style>

<div class="po-wrap">
  <div class="po-header">
    <div class="po-header-icon"><i class="ti ti-users" aria-hidden="true"></i></div>
    <div>
      <p class="po-header-title">People OS</p>
      <p class="po-header-sub">Talent &amp; Culture</p>
    </div>
    <span class="po-header-num">03</span>
  </div>

  <div class="po-tabs" id="po-tabs"></div>
  <div class="po-panel" id="po-panel"></div>
</div>

<script>
const modules = [
  {
    letter:"A", icon:"ti-user-search", label:"Recruiting",
    sub:"Aligned to documented role requirements",
    desc:"AI screens every applicant against your documented role scorecard before a human spends a single minute reviewing a CV — so only qualified candidates reach the interview stage.",
    how:"Job requirements are documented into a structured scorecard (skills, experience, culture signals). AI screens applications, scores each candidate against criteria, and ranks them. Hiring managers only see the top tier — every rejection below threshold is handled automatically.",
    impact:"Removes the founder or manager from first-pass screening entirely. Cuts time-to-shortlist from days to minutes. Ensures every hiring decision is anchored to a documented standard rather than gut feel or whoever happened to apply first.",
    example:"A model agency posting for a content coordinator receives 80 applications. AI scores each against documented criteria (English fluency, content tools, availability) and surfaces the top 8 with a scorecard breakdown — the founder reviews for 20 minutes, not 8 hours.",
    metrics:[{val:"<10 min",label:"Time to\nshortlist"},{val:"Top 10%",label:"Only scored\ncandidates reviewed"},{val:"100%",label:"Decisions against\ndocumented criteria"}],
    flow:["Application received","AI scores vs. role scorecard","Below threshold: auto-decline","Above threshold: ranked shortlist","Hiring manager reviews top tier"]
  },
  {
    letter:"B", icon:"ti-arrow-bar-right", label:"Onboarding",
    sub:"Following documented workflows",
    desc:"Converts onboarding from a founder-dependent hand-holding exercise into a self-executing workflow — new hires get consistent, complete, and trackable ramp-up every time.",
    how:"When a new team member is confirmed, an AI workflow triggers their full onboarding sequence: account provisioning, task assignments, training module scheduling, and checkpoint reminders. Progress is tracked against a documented timeline automatically.",
    impact:"Eliminates tribal knowledge dependency — the onboarding experience no longer lives in one person's head. A new hire on day one gets the same quality experience as the tenth hire. Managers are only pinged when a step is overdue or blocked.",
    example:"When Evea onboards a new model, a workflow triggers: Instagram warm-up SOP assigned, persona document shared, ManyChat training scheduled, and a 7-day check-in reminder set — all without Hiwa manually sending a single message.",
    metrics:[{val:"Day 1",label:"Full task sequence\nlaunched automatically"},{val:"0",label:"Onboarding steps\nmissed per hire"},{val:"7 days",label:"Time to first\nindependent output"}],
    flow:["Hire confirmed","AI triggers onboarding sequence","Accounts provisioned","Tasks + training assigned","Progress tracked vs. timeline"]
  },
  {
    letter:"C", icon:"ti-chart-line", label:"Performance Reviews",
    sub:"Using documented frameworks",
    desc:"Replaces memory-based, recency-biased reviews with data-driven assessments pulled directly from documented KPIs and observed work — giving every team member a fair, consistent evaluation.",
    how:"AI aggregates performance data from connected tools (task completion rates, response times, output counts, quality scores) and maps them against each role's documented KPI framework. It drafts the review, flags gaps, and surfaces talking points — the manager adds context and delivers.",
    impact:"Managers stop dreading review season. Reviews take 20 minutes instead of 2 hours. Every team member is evaluated against the same documented standard — not whoever made the most impression in the last two weeks.",
    example:"For Evea's Audience Relationship Manager, AI pulls DM response time, conversion rate from free to paid, and fan retention rate — then drafts a review against the documented KPIs, flagging that response time improved but upsell conversion dropped 12% this month.",
    metrics:[{val:"20 min",label:"Review draft\ntime (was 2 hrs)"},{val:"100%",label:"KPIs pulled\nfrom live data"},{val:"0",label:"Recency bias\nin scoring"}],
    flow:["Review cycle opens","AI pulls data from connected tools","Maps to role KPI framework","Review draft generated","Manager adds context + delivers"]
  },
  {
    letter:"D", icon:"ti-school", label:"L&D Pathways",
    sub:"Supporting documented skills",
    desc:"Transforms learning from a generic, one-size-fits-all training library into a personalized skill-gap map — each team member gets a pathway built specifically around what their role requires and what they currently lack.",
    how:"AI compares each person's current skill profile (from reviews, outputs, and self-assessments) against their role's documented skill requirements. It generates a prioritized learning pathway: which skills to develop first, in what sequence, and via which resources.",
    impact:"Training budget stops being wasted on courses nobody needs. Every development hour is directed at the specific gap between where a person is and what their role demands. Skill progression becomes measurable, not assumed.",
    example:"An Evea content model scores low on 'AI video scripting' against the documented content creator skill framework. AI generates a 3-week pathway: two ComfyUI tutorials, one prompt engineering module, and a peer review session with the photographer — with weekly output milestones.",
    metrics:[{val:"100%",label:"Training tied to\ndocumented skill gaps"},{val:"3 weeks",label:"Avg pathway\nto close a gap"},{val:"0",label:"Generic training\nassigned by default"}],
    flow:["Skill profile assessed","AI maps vs. role requirements","Gap identified","Personalized pathway generated","Weekly milestones tracked"]
  }
];

let active = 0;

function renderTabs(){
  document.getElementById('po-tabs').innerHTML = modules.map((m,i)=>`
    <div class="po-tab${i===active?' active':''}" onclick="setActive(${i})">
      <i class="ti ${m.icon} po-tab-icon" aria-hidden="true"></i>
      <span class="po-tab-num">Module ${m.letter}</span>
      <span class="po-tab-label">${m.label}</span>
    </div>`).join('');
}

function renderPanel(){
  const m = modules[active];
  const flowHtml = m.flow.map((s,i)=>`
    <div class="po-flow-step">
      <div class="po-flow-node">${s}</div>
      ${i<m.flow.length-1?'<span class="po-flow-arrow"><i class="ti ti-arrow-right" aria-hidden="true"></i></span>':''}
    </div>`).join('');
  document.getElementById('po-panel').innerHTML = `
    <div class="po-panel-top">
      <p class="po-panel-title"><i class="ti ${m.icon}" style="font-size:16px;color:#534AB7" aria-hidden="true"></i>${m.label}</p>
      <p class="po-panel-desc">${m.desc}</p>
    </div>
    <div class="po-panel-body">
      <div class="po-metrics">${m.metrics.map(mt=>`
        <div class="po-metric">
          <span class="po-metric-val">${mt.val}</span>
          <span class="po-metric-label">${mt.label.replace(/\n/g,'<br>')}</span>
        </div>`).join('')}
      </div>
      <div class="po-section">
        <span class="po-section-label"><i class="ti ti-cpu" aria-hidden="true"></i>How it works</span>
        <p class="po-section-text">${m.how}</p>
      </div>
      <div class="po-section">
        <span class="po-section-label"><i class="ti ti-trending-up" aria-hidden="true"></i>Operational impact</span>
        <p class="po-section-text">${m.impact}</p>
      </div>
      <div class="po-section">
        <span class="po-section-label"><i class="ti ti-bulb" aria-hidden="true"></i>Real example</span>
        <div class="po-example"><i class="ti ti-building" aria-hidden="true"></i><span>${m.example}</span></div>
      </div>
      <div class="po-section">
        <span class="po-section-label"><i class="ti ti-arrow-right" aria-hidden="true"></i>Workflow</span>
        <div class="po-flow">${flowHtml}</div>
      </div>
    </div>
    <div class="po-panel-footer">
      <div class="po-status-badge"><div class="dot"></div>Module active</div>
      <div class="po-nav">
        <button class="po-nav-btn" onclick="setActive(active-1)" ${active===0?'disabled':''}>
          <i class="ti ti-arrow-left" aria-hidden="true"></i> Prev
        </button>
        <button class="po-nav-btn" onclick="setActive(active+1)" ${active===modules.length-1?'disabled':''}>
          Next <i class="ti ti-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>`;
}

function setActive(i){
  if(i<0||i>=modules.length) return;
  active=i;
  renderTabs();
  renderPanel();
}

renderTabs();
renderPanel();
</script>
