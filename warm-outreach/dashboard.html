<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warm Outreach — Today</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #fff; --ink: #1a1a1a; --muted: #6b6b6b;
    --line: #e4e2dd; --accent: #2f6f4f; --accent-soft: #e8f1ec;
    --done: #9aa0a6; --warn: #b5651d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.45;
  }
  header {
    padding: 24px 20px 8px; max-width: 1100px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  .goal {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-top: 8px;
  }
  main {
    max-width: 1100px; margin: 0 auto; padding: 16px 20px 60px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .col h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 10px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 10px;
  }
  .card.done { opacity: .55; }
  .card.done .name, .card.done .task-text { text-decoration: line-through; }
  .name { font-weight: 600; font-size: 15px; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 3px; word-break: break-word; }
  .meta a { color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row > .grow { flex: 1; }
  .status {
    font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: #fafafa; cursor: pointer; white-space: nowrap;
  }
  .status.s-todo { color: var(--warn); border-color: #eaded0; background: #faf3ec; }
  .status.s-making { color: var(--accent); border-color: #d6e8dd; background: var(--accent-soft); }
  .status.s-sent { color: #fff; background: var(--accent); border-color: var(--accent); }
  form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input, select, textarea {
    font: inherit; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; width: 100%;
  }
  textarea { resize: vertical; min-height: 38px; }
  button.add {
    background: var(--accent); color: #fff; border: none; padding: 9px 14px;
    border-radius: 8px; font-weight: 600; cursor: pointer;
  }
  button.add:hover { filter: brightness(1.05); }
  .del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 2px 4px;
  }
  .del:hover { color: #c0392b; }
  .empty { color: var(--muted); font-size: 14px; font-style: italic; padding: 8px 2px; }
  .count { font-weight: 400; color: var(--muted); }
  .tools { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  .tools button {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; color: var(--muted); cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>Warm Outreach — Today</h1>
  <p class="sub">Gift-first. Take their current thing → improve it with nano banana → send it as a real favor.</p>
  <span class="goal" id="goal">Goal: 5 gifts made · at least 1 sent today</span>
</header>

<main>
  <section class="col">
    <h2>People <span class="count" id="peopleCount"></span></h2>
    <form id="personForm">
      <input id="pName" placeholder="Name" required>
      <div class="form-grid">
        <input id="pEmail" type="email" placeholder="Email">
        <input id="pLink" placeholder="Link to their current thing">
      </div>
      <button class="add" type="submit">+ Add person</button>
    </form>
    <div id="peopleList"></div>
  </section>

  <section class="col">
    <h2>Tasks <span class="count" id="taskCount"></span></h2>
    <form id="taskForm">
      <textarea id="tText" placeholder="What gift / fix for them? e.g. 'Redesign hero image of their landing page'" required></textarea>
      <div class="form-grid">
        <select id="tPerson"><option value="">— link to person (optional) —</option></select>
        <button class="add" type="submit">+ Add task</button>
      </div>
    </form>
    <div id="taskList"></div>
  </section>
</main>

<div class="tools">
  <button id="exportBtn">Export JSON (backup)</button>
</div>

<script>
const KEY = "warm-outreach-v1";
const PERSON_STATES = ["todo", "making", "sent"];
const STATE_LABEL = { todo: "To do", making: "Making gift", sent: "Sent ✓" };

let data = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { people: [], tasks: [] }; }
  catch { return { people: [], tasks: [] }; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(data)); render(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

document.getElementById("personForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = pName.value.trim(); if (!name) return;
  data.people.push({ id: uid(), name, email: pEmail.value.trim(), link: pLink.value.trim(), status: "todo" });
  e.target.reset(); save();
});

document.getElementById("taskForm").addEventListener("submit", e => {
  e.preventDefault();
  const text = tText.value.trim(); if (!text) return;
  data.tasks.push({ id: uid(), text, personId: tPerson.value, done: false });
  e.target.reset(); save();
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "warm-outreach-backup.json";
  a.click();
});

function cyclePersonStatus(id) {
  const p = data.people.find(x => x.id === id);
  p.status = PERSON_STATES[(PERSON_STATES.indexOf(p.status) + 1) % PERSON_STATES.length];
  save();
}
function delPerson(id) {
  data.people = data.people.filter(x => x.id !== id);
  data.tasks.forEach(t => { if (t.personId === id) t.personId = ""; });
  save();
}
function toggleTask(id) { const t = data.tasks.find(x => x.id === id); t.done = !t.done; save(); }
function delTask(id) { data.tasks = data.tasks.filter(x => x.id !== id); save(); }

function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function linkHtml(url) {
  if (!url) return "";
  const href = /^https?:\/\//.test(url) ? url : "https://" + url;
  return ` · <a href="${esc(href)}" target="_blank" rel="noopener">current ↗</a>`;
}

function render() {
  const sent = data.people.filter(p => p.status === "sent").length;
  goal.textContent = `Goal: 5 gifts · ${sent} sent today` + (sent >= 1 ? " 🎉" : "");
  peopleCount.textContent = data.people.length ? `(${data.people.length})` : "";
  taskCount.textContent = data.tasks.length ? `(${data.tasks.filter(t=>!t.done).length} open)` : "";

  peopleList.innerHTML = data.people.length ? "" : '<p class="empty">No one yet. Add the first person above.</p>';
  data.people.forEach(p => {
    const el = document.createElement("div");
    el.className = "card" + (p.status === "sent" ? " done" : "");
    el.innerHTML = `
      <div class="row">
        <div class="grow">
          <span class="name">${esc(p.name)}</span>
          <div class="meta">${esc(p.email) || "no email"}${linkHtml(p.link)}</div>
        </div>
        <button class="status s-${p.status}" title="click to advance">${STATE_LABEL[p.status]}</button>
        <button class="del" title="delete">×</button>
      </div>`;
    el.querySelector(".status").onclick = () => cyclePersonStatus(p.id);
    el.querySelector(".del").onclick = () => delPerson(p.id);
    peopleList.appendChild(el);
  });

  tPerson.innerHTML = '<option value="">— link to person (optional) —</option>' +
    data.people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");

  taskList.innerHTML = data.tasks.length ? "" : '<p class="empty">No tasks yet. What are you making for them?</p>';
  data.tasks.forEach(t => {
    const person = data.people.find(p => p.id === t.personId);
    const el = document.createElement("div");
    el.className = "card" + (t.done ? " done" : "");
    el.innerHTML = `
      <div class="row">
        <input type="checkbox" ${t.done ? "checked" : ""} style="width:auto;margin-top:3px">
        <div class="grow">
          <span class="task-text">${esc(t.text)}</span>
          ${person ? `<div class="meta">for ${esc(person.name)}</div>` : ""}
        </div>
        <button class="del" title="delete">×</button>
      </div>`;
    el.querySelector("input").onchange = () => toggleTask(t.id);
    el.querySelector(".del").onclick = () => delTask(t.id);
    taskList.appendChild(el);
  });
}

render();
</script>
</body>
</html>
