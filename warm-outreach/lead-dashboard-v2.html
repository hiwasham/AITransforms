<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warm Outreach — Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10141B; --panel:#171C25; --panel-raised:#1D2330; --hairline:#2A3140;
    --text:#E7EAEF; --muted:#8891A3; --faint:#565F72;

    /* funnel — sequential green, light→dark, dataviz-validated */
    --f-built:#7ED6A0; --f-written:#49BC7C; --f-sent:#2C9E5C;
    --f-replied:#197C43; --f-booked:#0E5B30;

    /* warmth — reserved status, never a series color */
    --warm:#2E8F46; --warm-dim:rgba(46,143,70,0.14);
    --cold:#8A857B; --cold-dim:rgba(138,133,123,0.14);

    --good:#5FC46A; --danger:#E86A5D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased;
    position:relative;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 720px 520px at 6% 8%, rgba(46,143,70,0.06), transparent 60%),
      radial-gradient(ellipse 680px 480px at 94% 24%, rgba(73,188,124,0.05), transparent 60%);
  }
  .wrap{max-width:1220px;margin:0 auto;padding:36px 28px 80px;padding:max(36px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) max(80px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left));position:relative;z-index:1;}

  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--f-built),var(--f-booked));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;color:#0B120D;font-size:16px;
  }
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;margin:0;letter-spacing:0.2px;text-wrap:balance;}
  .brand-sub{font-size:12.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .scan-status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(95,196,106,0.15);animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(95,196,106,0.5);}50%{box-shadow:0 0 0 5px rgba(95,196,106,0);}}
  .btn-ghost{
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;background:none;
    border:1px solid var(--hairline);color:var(--muted);border-radius:8px;padding:11px 14px;min-height:44px;cursor:pointer;
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--faint);}
  .btn-ghost:active{transform:scale(0.98);}
  .btn-ghost:focus-visible{outline:2px solid var(--f-built);outline-offset:2px;}

  /* progress bar */
  .progress-line{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .progress-track{flex:1;height:6px;background:var(--panel);border:1px solid var(--hairline);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--f-sent),var(--f-booked));width:0;transition:width .3s ease;}

  /* funnel tiles (also filters) */
  .funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px;}
  .ftile{
    background:var(--panel);border:1px solid var(--hairline);border-radius:12px;
    padding:15px 16px;cursor:pointer;position:relative;overflow:hidden;
    transition:border-color .15s ease, transform .15s ease;
  }
  .ftile:hover{border-color:var(--faint);transform:translateY(-1px);}
  .ftile:active{transform:translateY(0) scale(0.99);}
  .ftile.active{border-color:var(--text);}
  .ftile::before{content:'';position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;}
  .ftile.built::before{background:var(--f-built);}
  .ftile.written::before{background:var(--f-written);}
  .ftile.sent::before{background:var(--f-sent);}
  .ftile.replied::before{background:var(--f-replied);}
  .ftile.booked::before{background:var(--f-booked);}
  .ftile .num{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;}
  .ftile.built .num{color:var(--f-built);}
  .ftile.written .num{color:var(--f-written);}
  .ftile.sent .num{color:var(--f-sent);}
  .ftile.replied .num{color:var(--f-replied);}
  .ftile.booked .num{color:var(--f-booked);}
  .ftile .label{font-size:11px;color:var(--muted);margin-top:3px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;}

  .controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .search-box{position:relative;}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint);pointer-events:none;}
  .search-box input{
    background:var(--panel);border:1px solid var(--hairline);border-radius:8px;color:var(--text);
    padding:12px 12px 12px 36px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;width:240px;outline:none;min-height:44px;
  }
  .search-box input:focus{border-color:var(--faint);}
  .search-box input:focus-visible{outline:2px solid var(--f-built);outline-offset:2px;border-color:var(--faint);}
  .search-box .kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);border:1px solid var(--hairline);border-radius:4px;padding:1px 5px;}
  .status-filter select{
    background:var(--panel);border:1px solid var(--hairline);border-radius:8px;color:var(--muted);
    padding:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;cursor:pointer;min-height:44px;
  }
  .status-filter select:focus-visible{outline:2px solid var(--f-built);outline-offset:2px;}
  .right-controls{display:flex;gap:10px;align-items:center;}
  /* table */
  .board{border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:var(--panel);}
  .row-head,.lead-row{display:grid;grid-template-columns:1.7fr 1.7fr 0.9fr 1.15fr 0.7fr 32px;gap:14px;align-items:center;padding:14px 20px;}
  .row-head{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--hairline);}
  .lead-row{border-bottom:1px solid var(--hairline);transition:background .12s ease;cursor:pointer;}
  .lead-row:last-child{border-bottom:none;}
  .lead-row:hover{background:var(--panel-raised);}
  .who .name{font-weight:600;font-size:14.5px;}
  .who .org{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .gift-cell{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);line-height:1.5;word-break:break-word;}
  .gift-cell .more{color:var(--faint);}

  .badge{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;padding:5px 9px;border-radius:7px;white-space:nowrap;}
  .badge svg{width:12px;height:12px;flex-shrink:0;}
  .badge.warm{background:var(--warm-dim);color:var(--warm);}
  .badge.cold{background:var(--cold-dim);color:var(--cold);}

  select.stage{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--ink);color:var(--text);
    border:1px solid var(--hairline);border-radius:6px;padding:8px 10px;cursor:pointer;outline:none;width:100%;min-height:44px;
  }
  select.stage:focus-visible{outline:2px solid var(--f-built);outline-offset:2px;}
  .email-link{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--f-written);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;min-width:44px;min-height:44px;}
  .email-link:hover{text-decoration:underline;}
  .email-link:focus-visible{outline:2px solid var(--f-built);outline-offset:2px;}
  .del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:14px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
  .del:hover{color:var(--danger);}
  .del:focus-visible{outline:2px solid var(--f-built);outline-offset:2px;}
  .empty{padding:60px 20px;text-align:center;color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* detail slide-out */
  .detail-overlay{position:fixed;inset:0;background:rgba(8,10,14,0.55);z-index:15;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .detail-overlay.open{opacity:1;pointer-events:auto;}
  .detail-panel{
    position:fixed;top:0;right:-460px;bottom:0;width:440px;max-width:88vw;
    background:var(--panel-raised);border-left:1px solid var(--hairline);
    z-index:16;padding:30px 26px;overflow-y:auto;transition:right .25s cubic-bezier(.4,0,.2,1);
  }
  .detail-panel.open{right:0;}
  .detail-panel .close-btn{position:absolute;top:20px;right:22px;background:none;border:none;color:var(--faint);font-size:18px;cursor:pointer;padding:13px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
  .detail-panel .close-btn:hover{color:var(--text);}
  .detail-panel .close-btn:focus-visible{outline:2px solid var(--f-built);outline-offset:2px;}
  .detail-panel h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 4px;padding-right:24px;}
  .detail-org{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .detail-section{margin-bottom:18px;}
  .detail-section label{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:0.06em;font-family:'IBM Plex Mono',monospace;margin-bottom:7px;}
  .detail-section .value{font-size:13.5px;line-height:1.55;color:var(--text);}
  .gift-list{list-style:none;padding:0;margin:0;}
  .gift-list li{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--hairline);}
  .gift-list li:last-child{border-bottom:none;}
  .subject-box{background:var(--panel);border-left:3px solid var(--f-written);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--text);line-height:1.5;}
  .stage-rail{display:flex;gap:4px;margin-bottom:10px;}
  .stage-rail .seg{flex:1;height:6px;border-radius:3px;background:var(--hairline);}
  .stage-rail .seg.on{background:var(--f-sent);}
  .stage-controls{display:flex;gap:8px;}
  .stage-controls button{flex:1;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--ink);border:1px solid var(--hairline);color:var(--muted);border-radius:7px;padding:8px;cursor:pointer;}
  .stage-controls button:hover:not(:disabled){color:var(--text);border-color:var(--faint);}
  .stage-controls button:active:not(:disabled){transform:scale(0.97);}
  .stage-controls button:disabled{opacity:0.35;cursor:not-allowed;}
  .detail-section textarea{width:100%;background:var(--ink);border:1px solid var(--hairline);border-radius:7px;color:var(--text);padding:9px 11px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;resize:vertical;min-height:60px;outline:none;}
  .detail-section textarea:focus-visible{outline:2px solid var(--f-built);outline-offset:2px;}
  .btn-primary{width:100%;margin-top:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;background:var(--f-sent);color:#0B120D;border:none;border-radius:8px;padding:11px;cursor:pointer;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;filter:none;}
  .sent-stamp{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--f-sent);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-raised);border:1px solid var(--hairline);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--text);opacity:0;pointer-events:none;transition:all .2s ease;z-index:30;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  :focus-visible{outline:2px solid var(--f-built);outline-offset:2px;}

  @media (max-width:900px){.funnel{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:760px){
    .funnel{grid-template-columns:repeat(2,1fr);}
    .row-head{display:none;}
    .lead-row{grid-template-columns:1fr;gap:8px;padding:16px 18px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">W</div>
      <div>
        <h1>Warm Outreach</h1>
        <div class="brand-sub" id="brandSub">gift-first pipeline · 5 leads</div>
      </div>
    </div>
    <div class="header-right">
      <div class="scan-status"><span class="dot"></span> <span id="scanText">0 sent today</span></div>
      <button class="btn-ghost" id="exportBtn">Export JSON</button>
    </div>
  </header>

  <div class="progress-line">
    <span id="progressLabel">0 sent / 5</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="funnel" id="funnel"></div>

  <div class="controls">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Search leads...">
        <span class="kbd">⌘K</span>
      </div>
      <div class="status-filter">
        <select id="warmthFilter">
          <option value="all">All warmth</option>
          <option value="warm">Warm</option>
          <option value="cold">Cold</option>
        </select>
      </div>
    </div>
  </div>

  <div class="board">
    <div class="row-head">
      <div>Lead</div><div>Gift</div><div>Warmth</div><div>Stage</div><div>Email</div><div></div>
    </div>
    <div id="rows"></div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay"></div>
<div class="detail-panel" id="detailPanel">
  <button class="close-btn" id="closeDetail" aria-label="Close details">&times;</button>
  <div id="detailContent"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY = "warm-outreach-v2";
const STAGES = ["built","written","sent","replied","booked"];
const STAGE_LABEL = {built:"Built",written:"Written",sent:"Sent",replied:"Replied",booked:"Booked"};

const WARM_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c1.5 3-1.5 4 0 7 3-1 4 2 4 4a4 4 0 1 1-8 0c0-3 2-4 4-11z"/></svg>`;
const COLD_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 7l14 10M19 7L5 17"/></svg>`;

// Seed = the real five, verified 2026-07-20. All at `written`: gift built, email written, nothing sent.
const SEED = [
  { id:1, name:"Dr Chris Burris", org:"England Healing Circles", warmth:"warm",
    gifts:["burris-healing-circles-redesign.html","AI enso art riff"],
    email:"emails/01-chris-burris.md",
    subject:"made you a couple things for the England Healing Circles page",
    notes:"Warm — met in Hayden's webinar. Other Healing Circles training is FULL; offered a waitlist page if useful.",
    stage:"written", sentDate:"" },
  { id:2, name:"Walter", org:"Nature's Edge Farm (Microgreens)", warmth:"warm",
    gifts:["microgreensecrets-homepage-redesign.html","microgreensecrets-shop-redesign.html","microgreensecrets-contact.html","logo + upscaled photos"],
    email:"emails/02-walter-microgreens.md",
    subject:"made you a few things for Nature's Edge Farm",
    notes:"Warm — webinar. Flagged the Lovable branding logo showing on the live site.",
    stage:"written", sentDate:"" },
  { id:3, name:"Holland & Barrett", org:"H&B email marketing", warmth:"cold",
    gifts:["Summer-Sale banner redesign (PNG)"],
    email:"emails/03-holland-barrett.md",
    subject:"I rebuilt your Summer Sale email banner — free case study attached",
    notes:"COLD — subscriber, no personal tie. Send path: reply to newsletter, or LinkedIn to an email-marketing manager. Not a warm personal note.",
    stage:"written", sentDate:"" },
  { id:4, name:"Fumiko", org:"Face Yoga Method", warmth:"warm",
    gifts:["face-yoga-improved-page.html"],
    email:"emails/04-fumiko-faceyoga.md",
    subject:"made you something for the Nasolabial Fold Smoother page",
    notes:"Warm — webinar. 20+ yrs, 785k women. Rebuilt the 15-Day sales page as a structured protocol.",
    stage:"written", sentDate:"" },
  { id:5, name:"Jennifer LeSar", org:"LeSar Holdings", warmth:"warm",
    gifts:["lesar-redesign.html","headshot e123709a… (light)","headshot b169db6f… (heavy)"],
    email:"emails/05-jennifer-lesar.md",
    subject:"made you something for the LeSar Holdings homepage",
    notes:"Warm — webinar. Redesign has a bracketed [ ] stat placeholder. NOTE: 'three decades' (Jennifer) vs '30+ combined' (team) mismatch to reconcile before sending.",
    stage:"written", sentDate:"" }
];

let data = load();
let activeStage = "all";
let warmthFilter = "all";
let searchTerm = "";

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.leads)) return d; }
  catch{}
  return { leads: SEED.map(l => ({...l, gifts:[...l.gifts]})) };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(data)); render(); }

function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function safeId(id){ const n = Number(id); return Number.isFinite(n) ? n : 0; }
function safeHref(url){
  const s = String(url||"");
  if(/^(https?:|mailto:|\/|\.\/|[\w-]+\/)/i.test(s)) return s;
  return "#";
}

function warmthBadge(w){
  const icon = w==="warm"?WARM_ICON:COLD_ICON;
  return `<span class="badge ${w}">${icon}${w==="warm"?"Warm":"Cold"}</span>`;
}

const els = {
  funnel:document.getElementById('funnel'), rows:document.getElementById('rows'),
  search:document.getElementById('search'), warmthFilter:document.getElementById('warmthFilter'),
  detailOverlay:document.getElementById('detailOverlay'), detailPanel:document.getElementById('detailPanel'),
  detailContent:document.getElementById('detailContent'), toast:document.getElementById('toast'),
  progressFill:document.getElementById('progressFill'), progressLabel:document.getElementById('progressLabel'),
  scanText:document.getElementById('scanText'), brandSub:document.getElementById('brandSub'),
};

function counts(){
  const c = {built:0,written:0,sent:0,replied:0,booked:0};
  data.leads.forEach(l => { if(c[l.stage]!==undefined) c[l.stage]++; });
  return c;
}
// A lead that reached stage N has passed every stage before it — funnel reads cumulatively.
function funnelCount(stage, c){
  const i = STAGES.indexOf(stage);
  return STAGES.slice(i).reduce((sum,s)=>sum+c[s],0);
}

function renderFunnel(){
  const c = counts();
  els.funnel.innerHTML = STAGES.map(s => `
    <div class="ftile ${s} ${activeStage===s?'active':''}" data-stage="${s}">
      <div class="num">${funnelCount(s,c)}</div>
      <div class="label">${STAGE_LABEL[s]}</div>
    </div>`).join('');
  els.funnel.querySelectorAll('.ftile').forEach(t => t.addEventListener('click', () => {
    activeStage = activeStage===t.dataset.stage ? "all" : t.dataset.stage;
    render();
  }));
  const sent = funnelCount("sent",c);
  const total = data.leads.length;
  els.progressFill.style.width = (total ? (sent/total*100) : 0)+"%";
  els.progressLabel.textContent = `${sent} sent / ${total}`;
  els.scanText.textContent = `${sent} sent · ${funnelCount("replied",c)} replied`;
  els.brandSub.textContent = `gift-first pipeline · ${total} lead${total===1?"":"s"}`;
}

function visibleLeads(){
  const term = searchTerm.toLowerCase();
  return data.leads.filter(l => {
    const mStage = activeStage==="all" || (STAGES.indexOf(l.stage) >= STAGES.indexOf(activeStage));
    const mWarm = warmthFilter==="all" || l.warmth===warmthFilter;
    const mSearch = !term || [l.name,l.org,l.gifts.join(' '),l.notes].join(' ').toLowerCase().includes(term);
    return mStage && mWarm && mSearch;
  });
}

function stageSelect(l){
  const id = safeId(l.id);
  return `<select class="stage" data-id="${id}">${STAGES.map(s=>`<option value="${s}" ${s===l.stage?'selected':''}>${STAGE_LABEL[s]}</option>`).join('')}</select>`;
}

function renderRows(){
  const list = visibleLeads();
  if(!list.length){ els.rows.innerHTML = `<div class="empty">No leads match this view.</div>`; return; }
  els.rows.innerHTML = list.map(l => {
    const giftMore = l.gifts.length>1 ? ` <span class="more">+${l.gifts.length-1} more</span>` : '';
    const id = safeId(l.id);
    return `<div class="lead-row" data-id="${id}">
      <div class="who"><div class="name">${esc(l.name)}</div><div class="org">${esc(l.org)}</div></div>
      <div class="gift-cell">${esc(l.gifts[0])}${giftMore}</div>
      <div>${warmthBadge(l.warmth)}</div>
      <div>${stageSelect(l)}</div>
      <div><a class="email-link" href="${esc(safeHref(l.email))}" target="_blank" rel="noopener">open ↗</a></div>
      <button class="del" data-id="${id}" aria-label="Remove ${esc(l.name)}" title="Remove">&times;</button>
    </div>`;
  }).join('');

  els.rows.querySelectorAll('.lead-row').forEach(row => row.addEventListener('click', e => {
    if(e.target.closest('.del') || e.target.closest('.stage') || e.target.closest('.email-link')) return;
    openDetail(Number(row.dataset.id));
  }));
  els.rows.querySelectorAll('.stage').forEach(sel => sel.addEventListener('change', e => {
    e.stopPropagation(); setStage(Number(e.target.dataset.id), e.target.value);
  }));
  els.rows.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const id = Number(e.currentTarget.dataset.id);
    data.leads = data.leads.filter(l => l.id !== id);
    save(); showToast('Lead removed');
  }));
}

function setStage(id, stage){
  data.leads = data.leads.map(l => {
    if(l.id!==id) return l;
    const next = {...l, stage};
    if(stage==="sent" && !l.sentDate) next.sentDate = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    if(stage!=="sent") next.sentDate = "";
    return next;
  });
  save();
}
function openDetail(id){
  const l = data.leads.find(x => x.id===id); if(!l) return;
  const idx = STAGES.indexOf(l.stage);
  els.detailContent.innerHTML = `
    <h3>${esc(l.name)}</h3>
    <p class="detail-org">${esc(l.org)}</p>

    <div class="detail-section"><label>Warmth</label>${warmthBadge(l.warmth)}</div>

    <div class="detail-section">
      <label>Stage — ${esc(STAGE_LABEL[l.stage])}${l.sentDate?` · sent ${esc(l.sentDate)}`:''}</label>
      <div class="stage-rail">${STAGES.map((s,i)=>`<div class="seg ${i<=idx?'on':''}"></div>`).join('')}</div>
      <div class="stage-controls">
        <button id="stageBack" ${idx<=0?'disabled':''}>← ${idx>0?STAGE_LABEL[STAGES[idx-1]]:''}</button>
        <button id="stageFwd" ${idx>=STAGES.length-1?'disabled':''}>${idx<STAGES.length-1?STAGE_LABEL[STAGES[idx+1]]:''} →</button>
      </div>
    </div>

    <div class="detail-section"><label>Gift delivered</label>
      <ul class="gift-list">${l.gifts.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>
    </div>

    <div class="detail-section"><label>Email — ${esc(l.email)}</label>
      <div class="subject-box">${esc(l.subject)}</div>
    </div>

    <div class="detail-section"><label>Notes</label>
      <textarea id="detailNotes">${esc(l.notes)}</textarea>
    </div>

    <button class="btn-primary" id="markSent" ${idx>=STAGES.indexOf('sent')?'disabled':''}>
      ${idx>=STAGES.indexOf('sent')?'Already sent':'Mark as sent'}
    </button>`;

  document.getElementById('stageBack').addEventListener('click', () => { if(idx>0){ setStage(id,STAGES[idx-1]); openDetail(id); }});
  document.getElementById('stageFwd').addEventListener('click', () => { if(idx<STAGES.length-1){ setStage(id,STAGES[idx+1]); openDetail(id); }});
  document.getElementById('markSent').addEventListener('click', () => { setStage(id,'sent'); openDetail(id); showToast(`Marked ${l.name} as sent`); });
  document.getElementById('detailNotes').addEventListener('change', e => {
    data.leads = data.leads.map(x => x.id===id ? {...x, notes:e.target.value} : x);
    save();
  });

  els.detailOverlay.classList.add('open');
  els.detailPanel.classList.add('open');
}

function closeDetail(){ els.detailOverlay.classList.remove('open'); els.detailPanel.classList.remove('open'); }

function showToast(msg){
  els.toast.textContent = msg; els.toast.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(()=>els.toast.classList.remove('show'), 2200);
}

function render(){ renderFunnel(); renderRows(); }

els.search.addEventListener('input', e => { searchTerm = e.target.value; renderRows(); });
els.warmthFilter.addEventListener('change', e => { warmthFilter = e.target.value; renderRows(); });
els.detailOverlay.addEventListener('click', closeDetail);
document.getElementById('closeDetail').addEventListener('click', closeDetail);
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'warm-outreach-v2-backup.json'; a.click();
  showToast('Backup exported');
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeDetail();
  if((e.ctrlKey||e.metaKey) && e.key==='k'){ e.preventDefault(); els.search.focus(); }
});

render();
</script>
</body>
</html>
