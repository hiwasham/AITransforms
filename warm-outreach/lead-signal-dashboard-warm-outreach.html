<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — Lead Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #10141B;
    --panel: #171C25;
    --panel-raised: #1D2330;
    --hairline: #2A3140;
    --text: #E7EAEF;
    --muted: #8891A3;
    --faint: #565F72;

    --martyr: #E8A33D;
    --martyr-dim: rgba(232,163,61,0.12);
    --leak: #4FB8A8;
    --leak-dim: rgba(79,184,168,0.12);
    --burnout: #9B7EDE;
    --burnout-dim: rgba(155,126,222,0.12);

    --good: #5FC46A;
    --warm: #E8A33D;
    --cool: #6B7284;
    --danger: #E86A5D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  /* ambient scan zones — three signals being watched */
  body::before{
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 700px 500px at 8% 10%, rgba(232,163,61,0.05), transparent 60%),
      radial-gradient(ellipse 700px 500px at 92% 30%, rgba(79,184,168,0.05), transparent 60%),
      radial-gradient(ellipse 700px 500px at 30% 95%, rgba(155,126,222,0.045), transparent 60%);
  }
  .wrap{max-width:1220px;margin:0 auto;padding:36px 28px 80px;position:relative;z-index:1;}

  /* header */
  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg, var(--martyr), var(--burnout));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;color:#10141B;font-size:15px;
  }
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;margin:0;letter-spacing:0.2px;}
  .brand-sub{font-size:12.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .header-right{display:flex;align-items:center;gap:16px;}
  .scan-status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(95,196,106,0.15);animation:pulse 2.2s infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(95,196,106,0.5);}
    50%{box-shadow:0 0 0 5px rgba(95,196,106,0);}
  }
  .btn-add{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
    background:var(--text);color:var(--ink);border:none;border-radius:8px;
    padding:10px 16px;cursor:pointer;
  }
  .btn-add:hover{opacity:0.88;}

  /* summary cards — also act as filters */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .stat{
    background:var(--panel);border:1px solid var(--hairline);border-radius:12px;
    padding:16px 18px;cursor:pointer;position:relative;overflow:hidden;
    transition:border-color .15s ease, transform .15s ease;
  }
  .stat:hover{border-color:var(--faint);transform:translateY(-1px);}
  .stat.active{border-color:var(--text);}
  .stat::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:transparent;}
  .stat.m::before{background:var(--martyr);}
  .stat.l::before{background:var(--leak);}
  .stat.b::before{background:var(--burnout);}
  .stat .num{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;}
  .stat .label{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;}
  .stat.m .num{color:var(--martyr);}
  .stat.l .num{color:var(--leak);}
  .stat.b .num{color:var(--burnout);}

  /* toolbar */
  .controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:16px;}
  .search-box{position:relative;}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint);pointer-events:none;}
  .search-box input{
    background:var(--panel);border:1px solid var(--hairline);border-radius:8px;
    color:var(--text);padding:9px 12px 9px 32px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;
    width:240px; outline:none;
  }
  .search-box input:focus{border-color:var(--faint);}
  .search-box .kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);border:1px solid var(--hairline);border-radius:4px;padding:1px 5px;}
  .status-filter select{
    background:var(--panel);border:1px solid var(--hairline);border-radius:8px;color:var(--muted);
    padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;cursor:pointer;
  }
  .right-controls{display:flex;gap:10px;align-items:center;}

  /* table */
  .board{border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:var(--panel);}
  .row-head, .lead-row{display:grid;grid-template-columns:1.9fr 1.5fr 1.15fr 1fr 0.85fr 32px;gap:14px;align-items:center;padding:14px 20px;}
  .row-head{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);
    text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--hairline);
  }
  .lead-row{border-bottom:1px solid var(--hairline);transition:background .12s ease;cursor:pointer;}
  .lead-row:last-child{border-bottom:none;}
  .lead-row:hover{background:var(--panel-raised);}

  .who .name{font-weight:600;font-size:14.5px;}
  .who .role{font-size:12.5px;color:var(--muted);margin-top:2px;}

  .signal-cell{font-size:12.5px;color:var(--muted);}
  .strength{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .strength .bars{display:flex;gap:2px;align-items:flex-end;}
  .strength .bars span{width:3px;border-radius:1px;background:var(--hairline);}
  .strength .bars span:nth-child(1){height:5px;}
  .strength .bars span:nth-child(2){height:8px;}
  .strength .bars span:nth-child(3){height:11px;}
  .strength.high .bars span{background:var(--good);}
  .strength.high{color:var(--good);}
  .strength.medium .bars span:nth-child(1),
  .strength.medium .bars span:nth-child(2){background:var(--warm);}
  .strength.medium{color:var(--warm);}
  .strength.low .bars span:nth-child(1){background:var(--cool);}
  .strength.low{color:var(--cool);}

  .badge{
    display:inline-flex;align-items:center;gap:7px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;
    padding:6px 10px;border-radius:7px;white-space:nowrap;
  }
  .badge svg{width:13px;height:13px;flex-shrink:0;}
  .badge.martyr{background:var(--martyr-dim);color:var(--martyr);}
  .badge.leak{background:var(--leak-dim);color:var(--leak);}
  .badge.burnout{background:var(--burnout-dim);color:var(--burnout);}

  select.status{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    background:var(--ink);color:var(--muted);border:1px solid var(--hairline);
    border-radius:6px;padding:6px 8px;cursor:pointer;outline:none;
  }
  .date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--faint);}
  .del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:4px;}
  .del:hover{color:var(--danger);}

  .empty{padding:60px 20px;text-align:center;color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* add-lead modal */
  .overlay{position:fixed;inset:0;background:rgba(8,10,14,0.6);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(2px);}
  .overlay.show{display:flex;}
  .modal{background:var(--panel-raised);border:1px solid var(--hairline);border-radius:14px;padding:26px;width:440px;max-width:90vw;max-height:86vh;overflow-y:auto;}
  .modal h2{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--ink);border:1px solid var(--hairline);border-radius:7px;
    color:var(--text);padding:9px 11px;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;outline:none;
  }
  .field textarea{resize:vertical;min-height:52px;font-family:'IBM Plex Sans',sans-serif;}
  .field select{cursor:pointer;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .btn-ghost{background:none;border:1px solid var(--hairline);color:var(--muted);border-radius:8px;padding:9px 15px;cursor:pointer;font-size:13px;font-family:'IBM Plex Sans',sans-serif;}
  .btn-ghost:hover{color:var(--text);}

  /* detail slide-out panel */
  .detail-overlay{position:fixed;inset:0;background:rgba(8,10,14,0.55);z-index:15;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .detail-overlay.open{opacity:1;pointer-events:auto;}
  .detail-panel{
    position:fixed;top:0;right:-440px;bottom:0;width:420px;max-width:88vw;
    background:var(--panel-raised);border-left:1px solid var(--hairline);
    z-index:16;padding:30px 26px;overflow-y:auto;transition:right .25s cubic-bezier(.4,0,.2,1);
  }
  .detail-panel.open{right:0;}
  .detail-panel .close-btn{position:absolute;top:20px;right:22px;background:none;border:none;color:var(--faint);font-size:18px;cursor:pointer;}
  .detail-panel .close-btn:hover{color:var(--text);}
  .detail-panel h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 4px;padding-right:24px;}
  .detail-company{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .detail-section{margin-bottom:18px;}
  .detail-section label{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:0.06em;font-family:'IBM Plex Mono',monospace;margin-bottom:7px;}
  .detail-section .value{font-size:13.5px;line-height:1.55;color:var(--text);}
  .snippet-box{
    background:var(--panel);border-left:3px solid var(--martyr);border-radius:6px;
    padding:12px 14px;font-style:italic;font-size:13px;color:var(--muted);line-height:1.5;
  }
  .detail-panel .status-row{display:flex;align-items:center;gap:10px;}
  .btn-outreach{
    width:100%;margin-top:6px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;
    background:var(--text);color:var(--ink);border:none;border-radius:8px;padding:11px;cursor:pointer;
  }
  .btn-outreach:hover{opacity:0.88;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-raised);border:1px solid var(--hairline);border-radius:10px;
    padding:12px 18px;font-size:13px;color:var(--text);opacity:0;pointer-events:none;
    transition:all .2s ease;z-index:30;font-family:'IBM Plex Sans',sans-serif;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width: 900px){
    .stats{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width: 760px){
    .row-head{display:none;}
    .lead-row{grid-template-columns:1fr;gap:8px;padding:16px 18px;}
    .lead-row .date{order:5;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark">S</div>
      <div>
        <h1>Signal</h1>
        <div class="brand-sub">lead intelligence · pain-signal tracker</div>
      </div>
    </div>
    <div class="header-right">
      <div class="scan-status"><span class="dot"></span> watching 3 signal types</div>
      <button class="btn-add" id="openAdd">+ Add lead</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Search leads...">
        <span class="kbd">⌘K</span>
      </div>
      <div class="status-filter">
        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="New">New</option>
          <option value="Contacted">Contacted</option>
          <option value="Qualified">Qualified</option>
          <option value="Closed">Closed</option>
        </select>
      </div>
    </div>
  </div>

  <div class="board">
    <div class="row-head">
      <div>Lead</div>
      <div>Signal</div>
      <div>Strength</div>
      <div>Status</div>
      <div>Spotted</div>
      <div></div>
    </div>
    <div id="rows"></div>
  </div>

</div>

<!-- Add lead modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Add a lead</h2>
    <div class="field-row">
      <div class="field">
        <label>Name</label>
        <input type="text" id="f-name" placeholder="Jordan Reyes">
      </div>
      <div class="field">
        <label>Company</label>
        <input type="text" id="f-company" placeholder="Fieldstone Co.">
      </div>
    </div>
    <div class="field">
      <label>Role / title</label>
      <input type="text" id="f-role" placeholder="Founder">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Problem type</label>
        <select id="f-type">
          <option value="martyr">The Meeting Martyr</option>
          <option value="leak">The Talent Leak</option>
          <option value="burnout">The AI Burnout</option>
        </select>
      </div>
      <div class="field">
        <label>Signal strength</label>
        <select id="f-strength">
          <option value="high">Hot</option>
          <option value="medium" selected>Warm</option>
          <option value="low">Cool</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Signal (what you observed)</label>
      <textarea id="f-signal" placeholder="Posted about being buried in back-to-back calls all week"></textarea>
    </div>
    <div class="field">
      <label>Key snippet (optional quote)</label>
      <textarea id="f-snippet" placeholder="e.g. no time to think, just reacting all day"></textarea>
    </div>
    <div class="field">
      <label>Source</label>
      <input type="text" id="f-source" placeholder="LinkedIn post">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelAdd">Cancel</button>
      <button class="btn-add" id="saveAdd">Save lead</button>
    </div>
  </div>
</div>

<!-- Detail slide-out -->
<div class="detail-overlay" id="detailOverlay"></div>
<div class="detail-panel" id="detailPanel">
  <button class="close-btn" id="closeDetail">&times;</button>
  <div id="detailContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const TYPE_META = {
  martyr:  { label: "Meeting Martyr",  color: "martyr",  icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>` },
  leak:    { label: "Talent Leak",     color: "leak",    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v6"/><circle cx="12" cy="11" r="2"/><path d="M12 13c0 4-3 5-3 7M12 13c0 4 3 5 3 7" stroke-dasharray="2 2"/></svg>` },
  burnout: { label: "AI Burnout",      color: "burnout", icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h10M4 14h16M4 18h7"/></svg>` }
};
const STRENGTH_META = { high: "Hot", medium: "Warm", low: "Cool" };

let leads = [
  { id: 1, name: "Priya Nathan", role: "CEO", company: "Loomwork Studio", type: "martyr", strength: "high",
    signal: "Hasn't had a single unscheduled hour in three weeks and is basically forwarding decisions all day.",
    snippet: "No time to think. I'm just routing messages between teams at this point.",
    notes: "Founder is the connective tissue for three departments. Strong fit for a chief-of-staff style engagement.",
    source: "LinkedIn post · 2d ago", status: "New", date: "Jul 18" },
  { id: 2, name: "Marcus Deveaux", role: "COO", company: "Alder Freight", type: "leak", strength: "high",
    signal: "Ops lead of 6 years left last month; team has been re-deriving pricing logic from old spreadsheets ever since.",
    snippet: "We're guessing at rules that used to live entirely in his head.",
    notes: "Urgent knowledge-recovery need. Good candidate for a rapid documentation sprint.",
    source: "Referral · warm intro", status: "Contacted", date: "Jul 15" },
  { id: 3, name: "Elena Choi", role: "Founder", company: "Northbound Analytics", type: "burnout", strength: "medium",
    signal: "Commented that her team's AI subscriptions mostly produce generic, textbook-style answers.",
    snippet: "It's like paying for a search engine with extra steps.",
    notes: "Spending on tools already; the gap is workflow/context, not appetite. Easy conversation to start.",
    source: "Twitter/X reply", status: "New", date: "Jul 19" },
  { id: 4, name: "Sam Whitfield", role: "VP Engineering", company: "Cobalt Robotics", type: "martyr", strength: "high",
    signal: "Shared a calendar screenshot captioned 'not sustainable' — nine back-to-back syncs before lunch.",
    snippet: "I haven't written a line of code in eight months, only attended meetings about code.",
    notes: "High visibility post, lots of engagement. Reach out while the frustration is fresh.",
    source: "LinkedIn post · 5d ago", status: "Qualified", date: "Jul 12" },
  { id: 5, name: "Renata Alves", role: "CEO", company: "Palisade Health", type: "leak", strength: "high",
    signal: "Head of Clinical Ops departed; onboarding doc for the new hire is three years out of date.",
    snippet: "Half our internal process only existed in her memory.",
    notes: "Healthcare compliance angle raises urgency. Documentation gap is a real operating risk.",
    source: "Podcast interview mention", status: "New", date: "Jul 17" },
  { id: 6, name: "Tobias Lund", role: "Founder", company: "Fenwick & Rae", type: "burnout", strength: "medium",
    signal: "Posted about paying for three separate AI subscriptions and still writing strategy memos from scratch.",
    snippet: "Every tool converges on the same safe, generic answer.",
    notes: "Already believes in the category — needs a solution that's actually tuned to his business context.",
    source: "LinkedIn post · 1d ago", status: "New", date: "Jul 19" },
  { id: 7, name: "Aisha Rahman", role: "Managing Partner", company: "Cordage Ventures", type: "martyr", strength: "low",
    signal: "Assistant mentioned she's triaging 40+ meeting requests a week and hasn't had deep work time this quarter.",
    snippet: "My calendar owns me, I don't own it.",
    notes: "Signal came secondhand via her assistant — worth a light-touch outreach to confirm interest.",
    source: "Referral", status: "Contacted", date: "Jul 10" },
  { id: 8, name: "Devon Kruger", role: "CTO", company: "Ironwood Systems", type: "leak", strength: "medium",
    signal: "Principal engineer who owned the deploy pipeline left; team spent two weeks reverse-engineering runbooks.",
    snippet: "Nobody fully understood the deploy process until it broke.",
    notes: "Painful but resolved short-term; may be more receptive to a preventative retainer than an emergency one.",
    source: "Slack community post", status: "New", date: "Jul 16" },
  { id: 9, name: "Amara Osei", role: "Head of Product", company: "Verdigris Studio", type: "burnout", strength: "high",
    signal: "Wrote a long post about the 'AI plateau' — every wrapper tool she tries converges to the same mediocrity.",
    snippet: "We've tried everything. It all sounds like the same careful, average answer.",
    notes: "Articulate about the problem already, which makes for an easy first call — she's basically pre-sold on the diagnosis.",
    source: "Hacker News comment", status: "New", date: "Jul 20" },
  { id: 10, name: "Callum Ferris", role: "Creative Director", company: "Artisan Made Co.", type: "leak", strength: "medium",
    signal: "Brand lead left abruptly; freelancers are struggling to work without documented guidelines.",
    snippet: "The whole brand voice lived in one person's head, and now it's gone.",
    notes: "Good candidate for a structured knowledge-capture project rather than ongoing retainer.",
    source: "Twitter/X", status: "New", date: "Jul 13" }
];
let nextId = 11;

const els = {
  stats: document.getElementById('stats'),
  rows: document.getElementById('rows'),
  search: document.getElementById('search'),
  statusFilter: document.getElementById('statusFilter'),
  overlay: document.getElementById('overlay'),
  detailOverlay: document.getElementById('detailOverlay'),
  detailPanel: document.getElementById('detailPanel'),
  detailContent: document.getElementById('detailContent'),
  toast: document.getElementById('toast'),
};

let activeType = 'all';
let searchTerm = '';
let activeStatus = 'all';

function esc(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function badge(type){
  const m = TYPE_META[type];
  return `<span class="badge ${m.color}">${m.icon}${m.label}</span>`;
}

function strengthPill(strength){
  return `<span class="strength ${strength}"><span class="bars"><span></span><span></span><span></span></span>${STRENGTH_META[strength]}</span>`;
}

function renderStats(){
  const counts = { martyr:0, leak:0, burnout:0 };
  leads.forEach(l => counts[l.type]++);
  const cards = [
    { key:'all', cls:'', num: leads.length, label:'Total leads' },
    { key:'martyr', cls:'m', num: counts.martyr, label:'Meeting Martyr' },
    { key:'leak', cls:'l', num: counts.leak, label:'Talent Leak' },
    { key:'burnout', cls:'b', num: counts.burnout, label:'AI Burnout' },
  ];
  els.stats.innerHTML = cards.map(c => `
    <div class="stat ${c.cls} ${activeType===c.key?'active':''}" data-type="${c.key}">
      <div class="num">${c.num}</div>
      <div class="label">${c.label}</div>
    </div>
  `).join('');
  els.stats.querySelectorAll('.stat').forEach(card => {
    card.addEventListener('click', () => {
      activeType = card.dataset.type;
      renderStats();
      renderRows();
    });
  });
}

function renderRows(){
  const term = searchTerm.toLowerCase();
  const filtered = leads.filter(l => {
    const matchesType = activeType === 'all' || l.type === activeType;
    const matchesStatus = activeStatus === 'all' || l.status === activeStatus;
    const matchesSearch = !term || [l.name, l.role, l.company, l.signal, l.source].join(' ').toLowerCase().includes(term);
    return matchesType && matchesStatus && matchesSearch;
  });

  if (filtered.length === 0){
    els.rows.innerHTML = `<div class="empty">No leads match this view. Try a different filter or search term.</div>`;
    return;
  }

  els.rows.innerHTML = filtered.map(l => `
    <div class="lead-row" data-id="${l.id}">
      <div class="who">
        <div class="name">${esc(l.name)}</div>
        <div class="role">${esc(l.role)}${l.role && l.company ? ', ' : ''}${esc(l.company)}</div>
      </div>
      <div class="signal-cell">${esc(l.signal)}</div>
      <div>${badge(l.type)}</div>
      <div>${strengthPill(l.strength)}</div>
      <div class="date">${esc(l.date)}</div>
      <button class="del" data-id="${l.id}" title="Remove lead">&times;</button>
    </div>
  `).join('');

  els.rows.querySelectorAll('.lead-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.del')) return;
      openDetail(Number(row.dataset.id));
    });
  });
  els.rows.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = Number(e.currentTarget.dataset.id);
      leads = leads.filter(l => l.id !== id);
      renderStats();
      renderRows();
      showToast('Lead removed');
    });
  });
}

function openDetail(id){
  const l = leads.find(x => x.id === id);
  if (!l) return;
  const m = TYPE_META[l.type];
  els.detailContent.innerHTML = `
    <h3>${esc(l.name)}</h3>
    <p class="detail-company">${esc(l.role)}${l.role && l.company ? ', ' : ''}${esc(l.company)}</p>

    <div class="detail-section">
      <label>Problem type</label>
      ${badge(l.type)}
    </div>

    <div class="detail-section">
      <label>Signal strength</label>
      ${strengthPill(l.strength)}
    </div>

    <div class="detail-section">
      <label>Status</label>
      <div class="status-row">
        <select class="status" id="detail-status">
          ${['New','Contacted','Qualified','Closed'].map(s => `<option value="${s}" ${s===l.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="detail-section">
      <label>Source</label>
      <div class="value">${esc(l.source)} · ${esc(l.date)}</div>
    </div>

    <div class="detail-section">
      <label>Signal observed</label>
      <div class="value">${esc(l.signal)}</div>
    </div>

    ${l.snippet ? `
    <div class="detail-section">
      <label>Key snippet</label>
      <div class="snippet-box">"${esc(l.snippet)}"</div>
    </div>` : ''}

    ${l.notes ? `
    <div class="detail-section">
      <label>Notes</label>
      <div class="value">${esc(l.notes)}</div>
    </div>` : ''}

    <button class="btn-outreach" id="startOutreach">Mark as contacted</button>
  `;

  document.getElementById('detail-status').addEventListener('change', e => {
    leads = leads.map(x => x.id === id ? {...x, status: e.target.value} : x);
    renderRows();
  });
  document.getElementById('startOutreach').addEventListener('click', () => {
    leads = leads.map(x => x.id === id ? {...x, status: 'Contacted'} : x);
    document.getElementById('detail-status').value = 'Contacted';
    renderRows();
    showToast(`Marked ${l.name} as contacted`);
  });

  els.detailOverlay.classList.add('open');
  els.detailPanel.classList.add('open');
}

function closeDetail(){
  els.detailOverlay.classList.remove('open');
  els.detailPanel.classList.remove('open');
}

function showToast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), 2200);
}

els.search.addEventListener('input', e => { searchTerm = e.target.value; renderRows(); });
els.statusFilter.addEventListener('change', e => { activeStatus = e.target.value; renderRows(); });

document.getElementById('openAdd').addEventListener('click', () => els.overlay.classList.add('show'));
document.getElementById('cancelAdd').addEventListener('click', () => els.overlay.classList.remove('show'));
els.overlay.addEventListener('click', e => { if (e.target === els.overlay) els.overlay.classList.remove('show'); });
els.detailOverlay.addEventListener('click', closeDetail);
document.getElementById('closeDetail').addEventListener('click', closeDetail);

document.getElementById('saveAdd').addEventListener('click', () => {
  const name = document.getElementById('f-name').value.trim();
  const company = document.getElementById('f-company').value.trim();
  const role = document.getElementById('f-role').value.trim();
  const type = document.getElementById('f-type').value;
  const strength = document.getElementById('f-strength').value;
  const signal = document.getElementById('f-signal').value.trim();
  const snippet = document.getElementById('f-snippet').value.trim();
  const source = document.getElementById('f-source').value.trim() || 'Manual entry';
  if (!name || !signal){
    showToast('Add at least a name and a signal');
    return;
  }
  leads.unshift({
    id: nextId++, name, role, company, type, strength, signal, snippet, notes: '', source,
    status: 'New',
    date: new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' })
  });
  ['f-name','f-company','f-role','f-signal','f-snippet','f-source'].forEach(id => document.getElementById(id).value = '');
  els.overlay.classList.remove('show');
  renderStats();
  renderRows();
  showToast('Lead added');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    closeDetail();
    els.overlay.classList.remove('show');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k'){
    e.preventDefault();
    els.search.focus();
  }
});

renderStats();
renderRows();
</script>
</body>
</html>
